[build]
  command = "npm run build"
  publish = "dist"

# The homepage is NOT handled by a redirect, deliberately. Netlify serves a real
# file before it consults any rule, so a rewrite from "/" could never win against
# dist/index.html — it was silently still serving the React app. The build step
# instead writes the carousel to dist/index.html and moves the React app's html
# to dist/journal/index.html, so each is simply the file at its own address.
#
# Rules below are matched in order, and real files still win before all of them,
# which is what keeps /assets/..., /videos/... and /carousel/... serving directly.

# The React app is a single-page app: every route under /journal/ has to reach
# its index.html so the client router can take over.
[[redirects]]
  from = "/journal/*"
  to = "/journal/index.html"
  status = 200

# Everything unrecognised also goes to the app, not the ring. That keeps old
# links and bookmarks — /listens, /reads, anything shared before today — landing
# where they always did rather than on the new homepage.
[[redirects]]
  from = "/*"
  to = "/journal/index.html"
  status = 200
