<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>The Oswin Journal</title>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="The Oswin Journal" />
    <meta property="og:description" content="It's audio/visual" />
    <meta property="og:image" content="https://oswinjournal.com/og-image.png" />
    <meta property="og:url" content="https://oswinjournal.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Oswin Journal" />
    <meta name="twitter:description" content="It's audio/visual" />
    <meta name="twitter:image" content="https://oswinjournal.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          // Check for updates immediately, then every 5 minutes
          reg.update();
          setInterval(function() { reg.update(); }, 5 * 60 * 1000);
          // When a new SW takes over, reload to show fresh content
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
