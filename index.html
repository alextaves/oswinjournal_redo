<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Oswin Journal — it's audio/visual & words</title>

    <!-- SEO -->
    <meta name="description" content="Oswin Journal is an audio/visual publication. Immersive video, music, and words. Issues 01–03 available now." />
    <meta name="keywords" content="oswin journal, audio visual art, independent publication, experimental music, video art, contemporary art journal" />
    <meta name="author" content="Oswin Journal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oswinjournal.com" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:site_name" content="Oswin Journal" />
    <meta property="og:title" content="Oswin Journal — it's audio/visual & words" />
    <meta property="og:description" content="An audio/visual publication. Immersive video, music, and words. Issues 01–03 available now." />
    <meta property="og:image" content="https://oswinjournal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://oswinjournal.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oswin Journal — it's audio/visual & words" />
    <meta name="twitter:description" content="An audio/visual publication. Immersive video, music, and words. Issues 01–03 available now." />
    <meta name="twitter:image" content="https://oswinjournal.com/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Oswin Journal",
      "url": "https://oswinjournal.com",
      "description": "An audio/visual publication. Immersive video, music, and words.",
      "publisher": {
        "@type": "Organization",
        "name": "Oswin Journal",
        "url": "https://oswinjournal.com"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          // Check for updates immediately, then every 5 minutes
          reg.update();
          setInterval(function() { reg.update(); }, 5 * 60 * 1000);
          // When a new SW takes over, reload to show fresh content
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
