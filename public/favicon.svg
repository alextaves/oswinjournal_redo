<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White with the Journal's own mark on it: the black disc the ring's
       badges and every room's header now carry, at the radius they draw it,
       0.33 of the tile. Full-bleed rather than a circle on transparent — at
       16px a letterboxed mark loses most of its size to the gap. -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="33" fill="#111111"/>
</svg>
