<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Issue 2 — stacked cards (look & feel)</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<script src="/vendor/three.min.js"></script>
<script>
// ── Two homepage-style 3D glass cards, stacked like layers ─────────────────────
// The audio card sits on top/front; the text card sits behind and lower, so a
// step of it sticks out. Reuses the ring's material/lighting so they match.

const scene = new THREE.Scene()
scene.background = null   // transparent — the WallStreet video shows behind the cards

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100)
camera.position.set(0, 0, 9)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setClearColor(0x000000, 0)   // transparent so the bg layer shows through
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
renderer.domElement.style.cssText = 'position:fixed; inset:0; z-index:1;'
document.body.appendChild(renderer.domElement)

// The WallStreet background is rendered by a separate ES module at the bottom of
// the page, using the same three r184 the alextaves app uses (so colours match).

// Environment (drives the glass reflections) — same idea as the ring.
const envScene = new THREE.Scene()
envScene.background = new THREE.Color('#0e0b08')
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 100).texture
scene.add(new THREE.HemisphereLight('#2a1a0a', '#0e0806', 0.15))
const key = new THREE.DirectionalLight('#ffffff', 1.1); key.position.set(4, 6, 5)
const rim = new THREE.DirectionalLight('#ffcf90', 0.5); rim.position.set(-5, 2, -4)
scene.add(key, rim)

// ── Card geometry ──────────────────────────────────────────────────────────────
const PW = 4.125, PH = 5.5, THICK = 0.34   // ~90% homepage card height; chunkier glass edge
const panelGeo = new THREE.BoxGeometry(PW, PH, THICK)
const FRONT_OPACITY = 0.94, BACK_OPACITY = 0.42

// Rounded-corner alpha map (soft edges), same as the ring.
const roundedAlphaMap = (() => {
  const W = 128, H = Math.round(W * PH / PW)
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d'); const r = 6
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.arcTo(W, 0, W, H, r); ctx.arcTo(W, H, 0, H, r)
  ctx.arcTo(0, H, 0, 0, r); ctx.arcTo(0, 0, W, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  const t = new THREE.CanvasTexture(c); return t
})()

// ── Face textures (canvas-drawn, like the ring cards) ──────────────────────────
const FW = 600, FH = 800, LM = 54
const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif"

function newFace() {
  const c = document.createElement('canvas'); c.width = FW; c.height = FH
  return { c, ctx: c.getContext('2d') }
}
function flipTex(canvas) {
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height
  const ctx = c.getContext('2d'); ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(canvas, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// Audio card face (warm paper, dark type) — the frosted playlist, drawn flat.
let playingIdx = -1   // active track index (0-3), or -1 for none
function drawAudioFace(ctx) {
  ctx.clearRect(0, 0, FW, FH)
  ctx.fillStyle = '#ECE9E2'; ctx.fillRect(0, 0, FW, FH)
  ctx.textAlign = 'left'
  const label = (t, x, y) => { ctx.font = `700 15px ${FONT}`; ctx.letterSpacing = '3px'; ctx.fillStyle = 'rgba(38,34,32,0.5)'; ctx.fillText(t.toUpperCase(), x, y) }
  label('Audio', LM, 92)
  ctx.font = `700 44px ${FONT}`; ctx.letterSpacing = '-0.5px'; ctx.fillStyle = '#282623'
  ctx.fillText('Christopher', LM, 150); ctx.fillText('Bissonnette', LM, 198)
  ctx.letterSpacing = '0px'
  const tracks = ['Overture', 'Orffyreus Wheel', 'Undertow', 'Color Deceives Continuously']
  let y = 280
  tracks.forEach((t, i) => {
    const on = i === playingIdx
    ctx.font = on ? `700 27px ${FONT}` : `500 27px ${FONT}`
    ctx.fillStyle = on ? '#151310' : 'rgba(42,38,35,0.82)'
    ctx.fillText(t, LM, y)
    if (on) { ctx.beginPath(); ctx.arc(LM - 22, y - 8, 5, 0, Math.PI * 2); ctx.fill() }
    y += 46
  })
  ctx.font = `italic 500 27px ${FONT}`; ctx.fillStyle = 'rgba(42,38,35,0.82)'; ctx.fillText('silent mode', LM, y); y += 70
  label('Video', LM, y); y += 40
  ctx.font = `700 30px ${FONT}`; ctx.fillStyle = '#282623'; ctx.fillText('OSWIN', LM, y); y += 62
  label('Credit Info', LM, y); y += 40
  label('Notes on Oswin', LM, y)
}

// Shared noise for the portrait's live TV static (grain only — no scanlines).
const noiseC = document.createElement('canvas'); noiseC.width = 200; noiseC.height = 200
const noiseCtx = noiseC.getContext('2d')
function regenNoise() {
  const id = noiseCtx.createImageData(200, 200), d = id.data
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255 }
  noiseCtx.putImageData(id, 0, 0)
}

// ── Text card: portrait (top) + the full issue text, rendered ON the card and
// scrollable — no separate window. ──────────────────────────────────────────
const PAPER = '#ECE9E2'
const portrait = new Image()
const imgH = 540          // portrait band height at the top of the document
let textScrollY = 0       // scroll offset (px) when the card is straightened

const ISSUE_TEXT = {
  essay: [
    `I am excited to share Issue 2 of Oswin Journal. This project really began when I had a gallery in Canada called Oswald Collective. We featured the best of the up and coming talent, but my interest lay more and more in the connection between sound and visual. Not in the music video way, which ironically I've never been that interested in. It's how sound and visual have a way of syncing naturally on their own.`,
    `This became apparent a month before moving to Sydney. We'd sold off all our furniture and all we had left was lawn chairs, our stereo and a TV. I began becoming obsessed with the Apple TV screensavers and pairing them to electronic music, more specifically H. Takahashi. One video that resonated the most was an aerial shot of LAX. Parked planes, some getting ready for take off. The pairing had a huge impact on me. Something connected. And it never stopped.`,
    `So Issue 2 just launched, and this issue is with Chris Bissonnette. For me, getting to work with him was such an honour, and the way we came to meet I found extraordinary.`,
    `We first met many years ago in Detroit on a night that has stuck with me my entire life. I was out with friends at a Poor Boy party. These were five-dollar parties held usually in the abandoned industrial area near downtown, and the way one got to these parties was to firstly know where the parking lot was, then catch a van or small bus to the actual location. This backstory is important: that night was, I believe, one of the biggest raids on a rave Detroit has ever seen. Police in riot gear with batons started clubbing people who were dancing. The scene turned into chaos. A few of my friends decided to find an alternative exit. We kicked down a door and ran for it. But because we'd bused from the parking lot we didn't know where we were going. Luckily, I didn't take acid. Like most of us did. We found the parking lot eventually, but our friend who drove had been arrested at the party. So we were stranded. Moments later, a line of police arrived and surrounded the lot. They were fully armed and ran to where we were hiding, guns drawn. We all lined up against the fence, hands up, legs spread. One cop took a guy to the ground and kicked him. They joked that they've been known to slip on the trigger and no one would know. People were so scared they peed themselves, to which the cops made a spectacle of them. We were released as there was no proof of us being at the party, but we were told to leave the lot or face trespassing charges.`,
    `So what remained of our group started to walk back to Canada, and Detroit during this period was incredibly dangerous. This is where I met Chris. He was like a miracle. Arrived in a car that was circling the party, wondering what the fuck was going on. My friend knew Chris and we got a ride back. I sat in the back so Chris never got a look at who I was. But this story has stuck with me. It was both the most terrifying experience and also the most enlightening. I should say this: we were all white kids partying in a place that once housed jobs for a lot of Detroiters. A lot of them are Black. The cops were all Black. I totally get why they hated us. Even though our intentions weren't to be harmful, I could see how complicated Detroit's history was.`,
    `I would never forget Chris's face. He bailed us out of a jam that could have ended really badly.`,
    `It wasn't until 2024 that I met him again. This time, at an art show I was hosting in Windsor. We chatted and had lots in common. I knew I had met him before, and I went through all the possibilities. Regardless, he reminded me of this energy that one only finds in Windsor. Windsor is for me one of the most interesting cities in Canada. Its connection to Detroit, but still distinctly its own flavour. Chris has that flavour. A creative intellect. I get homesick for that energy.`,
    `Then it dawned on me. It was the guy who saved us. It flashed in my mind and I was certain it was him. I wrote him a quick text and indeed, that was how I knew him.`,
    `He bought a painting from me and gave me his latest album on CD. I connected with it on a really personal level. I picked four tracks for the website. All of his work deserves attention, but Orffyreus Wheel, Undertow and Overture I must have listened to over a hundred times. There's something in those pieces that doesn't let go of you. They loop in your head the way the footage loops on screen. Slow, hypnotic, inevitable.`,
    `That's Issue 2. Headphones on. Lights off. If you have a projector, even better. Your living room becomes the installation.`,
    `oswinjournal.com`,
  ],
  about: [
    `A little about the pairing of visuals with Chris's music. His work felt similar to peeling an onion. It kept reinventing itself over and over and I got completely lost inside the world he created.`,
    `When I first got started on this issue, I began with something that had been on the back of my mind for years. To work with video of a figure skater in a full spin, then loop that. It worked as good as I imagined it would, hypnotic and transcending. But the footage below opened up the music in a different way.`,
    `The found footage is taken from interviews of bankers on Wall Street. I wasn't so much interested in the person being interviewed. I was more interested in the people in the background. This is a recurring theme in my work. I went through a long stint with photography and was particularly drawn to urban areas where lots of people were coming and going. I made myself available to it, almost being like a stage, with actors arriving and leaving as if it were a performance.`,
    `This footage I have watched over and over. Each time I notice something else. It made me hear Chris's music differently. And this is what Oswin Journal is. Opening up music and visuals to experience both as one.`,
  ],
  interview: [
    { q: `Many people who live and breathe jazz claim the golden era was the late '50s. Where on the timeline do you think we are with electronic music? Has it peaked, or is it still building? Where is it all going?`, a: `I feel the term "electronic music" is ultimately to be too broad at this point. In the late 60's and early 70s there was a sense that electronic instruments fit into a clear category. There was fear that they would wrongly replace real instruments or even musicians (The Beatles' use of the Mellotron on 'Strawberry Fields Forever'). And that trend seemed to continue into the 80s with a well-defined delineation of synth pop and psych rock's usage of synthesizers and drum machines etc. But the practice of electronic instruments and methods in production are utilized in almost all popular music today. The technology is inseparable from the process and therefore not truly electronic music in a purest sense. So, I guess in very strict terms, the golden era of electronic music has passed. In the 90s I had a narrower vision of what I believed electronic music production should look like. I was ultimately (save for a few exceptions) exclusively listening to electronic music, like techno and sample based experimental music. Since then, my production methods have evolved to include more traditional instruments, although I'm not using them in a conventional manner. And as I have grown older, I have lost touch with the multitude of genres that have splintered. Black MIDI? I had no idea. There are now hundreds of subgenres of electronic music. And with production methods crossing so many categories, hybridizing and evolving so quickly, it suggests that we are well past the golden era and deeper into uncharted territory.` },
    { q: `What's a piece of art from a completely different medium that shaped how you hear things?`, a: `During a brief gallery tour in Toronto during my art school years, I encountered an exhibition that profoundly altered my understanding of contemporary art. The exhibition was held at The Ydessa Hendeles Gallery and featured a collection of works by Bill Viola, Gary Hill, and James Coleman. Ydessa had modified the gallery's interior structure to accommodate the artworks. This is where I experienced Bill Viola's Arc of Ascent. The installation comprised a synchronized multi-channel video projected onto a suspended 22-foot translucent scrim. The action depicted, in extreme slow motion, was that of a diver plunging into dark water and subsequently ascending to the surface. The three-second dive is slowed to a lengthy seven minutes, creating a sense of tension as the suspended figure gradually descends on the screen. The audio is also slowed to synchronize with the image on the screen. The sound consists of a thunderous wave of bass and noise, creating a powerful visceral experience. In that moment, I realized how the image was significantly influenced by the presence of the sound. This was not music or sound effects but an aural texture designed to challenge viewers' perceptions. From that point on, I developed an understanding that sound art could be atonal and experiential without the need for elaborate context or extraneous meaning.` },
    { q: `You've spent your life on the border, Windsor and Detroit — two cities with different energies, but there is something very unusual about Windsor. How do you see this connection between the two places? How has it shaped how you make music?`, a: `In the early 90s, I spent a considerable amount of time attending warehouse parties and shopping for music at local record shops in Michigan. Detroit has played a significant role in shaping my formative years, providing me with techniques and inspiration. However, the way I currently create music has undergone a significant transformation over the years. Detroit remains an important destination, and it has undergone exponential gentrification and development over the past 25 years. In contrast, Windsor has largely remained unchanged and could potentially learn from Detroit's transformation. Windsor is a border anomaly, and Michiganders regard it like a suburb of Detroit. There are distinct cultural differences, and I think it's important for us to maintain our identity. We really aren't "South Detroit", despite what the Journey song suggests. Nevertheless, the two cities will continue to have a symbiotic relationship, and I hope that this will only improve, despite the current political tensions between the countries.` },
    { q: `What does your process look like when you're starting something new? Does it begin with a sound you've heard out in the world, or is it more about experimentation once you're in the studio? There's a loneliness to your music that I'm drawn to — not sad, but solitary. Where does that come from?`, a: `I rarely step into the studio with a clear vision of what I want to create. While I may have a general idea, I mostly begin with experimentation. Some days, I focus on creating patches that I can use later, while other sessions involve composing and mixing. Over the years, I've become more comfortable with my process, allowing errors in the work to become part of the final product. There are times when it is essential for me to be meticulous, and other times when I need to cut the track loose and understand what the music has become. I don't start a track with the intention of producing something melancholic, but it often ends up being that way. I'm not a dark person, but I find that the process of sound production is cathartic. Perhaps there's a psychological explanation for how I end up with sad sounds. I'm not sure I want to find out.` },
    { q: `Final question: what are you listening to?`, a: `This is my "Best Of" list for 2025. Not everything on my curated lists is a widely lauded success, but there is most often something about a release that I find interesting or unique.` },
  ],
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = ''
  for (const w of words) { const test = line ? line + ' ' + w : w; if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w } else line = test }
  if (line) lines.push(line); return lines
}

// Lay the whole document out below the portrait; returns the total height.
function layoutText(ctx, startY) {
  const maxW = FW - LM * 2, ink = '#242422', soft = 'rgba(38,34,32,0.55)', faint = 'rgba(38,34,32,0.45)'
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  let y = startY
  const label = (t) => { ctx.font = `700 13px ${FONT}`; ctx.letterSpacing = '2.4px'; ctx.fillStyle = faint; ctx.fillText(t.toUpperCase(), LM, y); ctx.letterSpacing = '0px'; y += 26 }
  const heading = (t) => { y += 22; ctx.font = `700 22px ${FONT}`; ctx.fillStyle = ink; ctx.fillText(t, LM, y); y += 36 }
  const body = (t, size, lh, color, weight, italic) => { ctx.font = `${italic ? 'italic ' : ''}${weight || 400} ${size || 16}px ${FONT}`; ctx.fillStyle = color || ink; wrapText(ctx, t, maxW).forEach((ln) => { ctx.fillText(ln, LM, y); y += (lh || 26) }); y += 14 }
  label('Oswin Journal · Issue 2')
  y += 22   // breathing room between the label and the name
  ctx.font = `700 33px ${FONT}`; ctx.fillStyle = ink; ctx.letterSpacing = '-0.6px'
  ctx.fillText('Christopher Bissonnette', LM, y); y += 32; ctx.letterSpacing = '0px'
  ctx.font = `300 14px ${FONT}`; ctx.letterSpacing = '2px'; ctx.fillStyle = soft; ctx.fillText('SOUND & IMAGE', LM, y); y += 36; ctx.letterSpacing = '0px'
  ISSUE_TEXT.essay.forEach((p) => body(p))
  heading('About Issue 2')
  ISSUE_TEXT.about.forEach((p) => body(p))
  heading('The Interview')
  ISSUE_TEXT.interview.forEach((qa) => { label('Oswin Journal'); body(qa.q, 16, 25, ink, 600); label('Chris'); body(qa.a) })
  return y + 30
}

let textCanvas = null, textContentH = 0
function buildTextCanvas() {
  const probe = document.createElement('canvas'); probe.width = FW; probe.height = 200
  textContentH = layoutText(probe.getContext('2d'), 44)
  const c = document.createElement('canvas'); c.width = FW; c.height = textContentH
  const cc = c.getContext('2d'); cc.fillStyle = PAPER; cc.fillRect(0, 0, FW, textContentH)
  layoutText(cc, 44)
  textCanvas = c
}
buildTextCanvas()

function maxScroll() { return Math.max(0, imgH + textContentH - FH) }

function drawTextFace(ctx) {
  const sy = textScrollY
  ctx.clearRect(0, 0, FW, FH); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, FW, FH)
  // Portrait band (document 0..imgH) with live static, if visible in the window.
  const pTop = -sy
  if (portrait.naturalWidth && (imgH - sy) > 0 && pTop < FH) {
    ctx.save()
    const clipTop = Math.max(0, pTop), clipH = Math.min(FH, imgH - sy) - clipTop
    ctx.beginPath(); ctx.rect(0, clipTop, FW, clipH); ctx.clip()
    const s = Math.max(FW / portrait.naturalWidth, imgH / portrait.naturalHeight)
    const dw = portrait.naturalWidth * s, dh = portrait.naturalHeight * s
    ctx.filter = 'grayscale(1) contrast(1.32)'
    ctx.drawImage(portrait, (FW - dw) / 2, pTop + (imgH - dh) / 2, dw, dh)
    ctx.filter = 'none'
    regenNoise(); ctx.imageSmoothingEnabled = false
    ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = 0.11; ctx.drawImage(noiseC, 0, pTop, FW, imgH)
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.075; ctx.drawImage(noiseC, 0, pTop, FW, imgH)
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1
    const fy = pTop + imgH - 120
    const g = ctx.createLinearGradient(0, fy, 0, pTop + imgH)
    g.addColorStop(0, 'rgba(236,233,226,0)'); g.addColorStop(1, 'rgba(236,233,226,1)')
    ctx.fillStyle = g; ctx.fillRect(0, fy, FW, 120)
    ctx.restore()
  }
  // Text (document imgH..imgH+textContentH), windowed out of textCanvas.
  if (textCanvas) {
    const srcTop = Math.max(0, sy - imgH)
    const srcH = Math.min(textContentH, sy - imgH + FH) - srcTop
    if (srcH > 0) ctx.drawImage(textCanvas, 0, srcTop, FW, srcH, 0, imgH + srcTop - sy, FW, srcH)
  }
}

function makeCard(drawFace, panelHex) {
  const sc = document.createElement('canvas'); sc.width = FW; sc.height = FH
  const sctx = sc.getContext('2d'); drawFace(sctx)
  const faceSharp = new THREE.CanvasTexture(sc); faceSharp.encoding = THREE.sRGBEncoding

  // A blurred copy of the same face — shown when this card is the one tucked
  // behind a straightened front card, so the front text reads cleanly.
  const bc = document.createElement('canvas'); bc.width = FW; bc.height = FH
  const bctx = bc.getContext('2d')
  const regenBlur = () => { bctx.clearRect(0, 0, FW, FH); bctx.filter = 'blur(11px)'; bctx.drawImage(sc, 0, 0); bctx.filter = 'none' }
  regenBlur()
  const faceBlur = new THREE.CanvasTexture(bc); faceBlur.encoding = THREE.sRGBEncoding

  const backTex = flipTex(sc)
  const col = new THREE.Color(panelHex)
  const faceMat = new THREE.MeshPhysicalMaterial({ map: faceSharp, transparent: true, opacity: FRONT_OPACITY, side: THREE.FrontSide, roughness: 0.42, metalness: 0, envMapIntensity: 0.28, clearcoat: 0.5, clearcoatRoughness: 0.4, color: 0xffffff, alphaMap: roundedAlphaMap })
  const glassMat = new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: BACK_OPACITY, roughness: 0.24, metalness: 0, envMapIntensity: 0.7, clearcoat: 0.9, clearcoatRoughness: 0.22 })
  const backMat = new THREE.MeshPhysicalMaterial({ map: backTex, transparent: true, opacity: 0.85, roughness: 0.5, metalness: 0, envMapIntensity: 0.28, color: 0xffffff, alphaMap: roundedAlphaMap })
  const sideMat = new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: 0.55, roughness: 0.2, metalness: 0, envMapIntensity: 0.85, clearcoat: 1.0, clearcoatRoughness: 0.18 })
  const mesh = new THREE.Mesh(panelGeo, [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
  mesh.userData.faceSharp = faceSharp
  mesh.userData.faceBlur = faceBlur
  mesh.userData.sctx = sctx
  mesh.userData.drawFace = drawFace
  mesh.userData.redraw = () => { drawFace(sctx); faceSharp.needsUpdate = true; regenBlur(); faceBlur.needsUpdate = true }
  return mesh
}

// Text card (back / lower) and audio card (front / upper), offset into a step.
const textCard = makeCard(drawTextFace, '#E4E0D8')
textCard.position.set(-0.32, -0.06, -0.22)

const audioCard = makeCard(drawAudioFace, '#E9E5DE')
audioCard.position.set(0.32, 0.06, 0.32)

const group = new THREE.Group()
group.add(textCard, audioCard)
scene.add(group)

// ── Click the peeking (back) card to swap it to the front ─────────────────────
const FRONT_POS = audioCard.position.clone()
const BACK_POS = textCard.position.clone()
audioCard.userData.target = FRONT_POS.clone()
textCard.userData.target = BACK_POS.clone()
let frontCard = audioCard
let focused = false   // true = front card pulled dead-centre and straight
function applyLayout() {
  const back = frontCard === audioCard ? textCard : audioCard
  if (focused) {
    frontCard.userData.target.set(0, 0, 0.28)   // straight, centred
    back.userData.target.set(0, 0, -0.28)        // tucked directly behind
  } else {
    frontCard.userData.target.copy(FRONT_POS)
    back.userData.target.copy(BACK_POS)
  }
  // Front card always sharp; the tucked-behind card blurs while focused so the
  // front text reads cleanly through the glass.
  frontCard.material[4].map = frontCard.userData.faceSharp
  frontCard.material[4].needsUpdate = true
  back.material[4].map = focused ? back.userData.faceBlur : back.userData.faceSharp
  back.material[4].needsUpdate = true
  // Reset the scroll unless we're reading the straightened text card.
  if (!(focused && frontCard === textCard)) textScrollY = 0
}

// Scroll the text on the straightened text card (wheel).
addEventListener('wheel', (e) => {
  if (focused && frontCard === textCard) {
    e.preventDefault()
    textScrollY = Math.min(maxScroll(), Math.max(0, textScrollY + e.deltaY))
  }
}, { passive: false })
// ── Track playback (click a track on the audio card face) ─────────────────────
const AUDIO_FILES = ['overture.mp3', 'orffyreus_wheel.mp3', 'undertow.mp3', 'color_deceives.mp3']
const audioCache = {}
let currentAudio = null
function toggleTrack(i) {
  if (i === 4) {   // silent mode → stop
    if (currentAudio) currentAudio.pause()
    currentAudio = null; playingIdx = -1; audioCard.userData.redraw(); return
  }
  const file = AUDIO_FILES[i]
  if (!audioCache[file]) {
    audioCache[file] = new Audio('audio/c_bissonnette/' + file)
    audioCache[file].addEventListener('ended', () => { if (playingIdx === i) { playingIdx = -1; currentAudio = null; audioCard.userData.redraw() } })
  }
  const a = audioCache[file]
  if (currentAudio && currentAudio !== a) currentAudio.pause()
  if (a.paused) { a.play().catch(() => {}); currentAudio = a; playingIdx = i }
  else { a.pause(); currentAudio = null; playingIdx = -1 }
  audioCard.userData.redraw()
}
// Map a hit UV on the audio face to a track row (0-3 tracks, 4 = silent mode).
function trackAt(uv) {
  if (!uv) return -1
  const cx = uv.x * FW, cy = (1 - uv.y) * FH
  if (cx < LM - 26 || cx > LM + 430) return -1
  const base = [280, 326, 372, 418, 464]
  for (let i = 0; i < base.length; i++) if (cy > base[i] - 34 && cy < base[i] + 10) return i
  return -1
}

const raycaster = new THREE.Raycaster()
const ptr = new THREE.Vector2()
renderer.domElement.addEventListener('pointerdown', (e) => {
  ptr.x = (e.clientX / innerWidth) * 2 - 1
  ptr.y = -((e.clientY / innerHeight) * 2 - 1)
  raycaster.setFromCamera(ptr, camera)
  const hits = raycaster.intersectObjects([audioCard, textCard], false)
  if (!hits.length) return
  const hit = hits[0].object
  // A track click on the front audio card plays/stops it (not straighten/swap).
  if (hit === audioCard && audioCard === frontCard && hits[0].face && hits[0].face.materialIndex === 4) {
    const i = trackAt(hits[0].uv)
    if (i >= 0) { toggleTrack(i); return }
  }
  if (hit === frontCard) focused = !focused        // click the front card → straighten (toggle)
  else { frontCard = hit; focused = false }         // click the back card → swap it to front
  applyLayout()
})

// Redraw the text card once the portrait decodes.
portrait.onload = () => { textCard.userData.redraw() }
portrait.src = 'images/chris_portrait.png'

// ── Gentle pointer parallax so the step/depth reads ────────────────────────────
let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) * 2 - 1
  const ny = (e.clientY / innerHeight) * 2 - 1
  targetRY = nx * 0.28
  targetRX = -ny * 0.16
})
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

function render() {
  requestAnimationFrame(render)
  // At rest, a slight angle so the glass thickness/edges read (like the ring);
  // when focused, straighten dead-on.
  const BASE_RX = -0.05, BASE_RY = 0.13
  const wantRX = focused ? 0 : (BASE_RX + targetRX)
  const wantRY = focused ? 0 : (BASE_RY + targetRY)
  curRX += (wantRX - curRX) * 0.06
  curRY += (wantRY - curRY) * 0.06
  group.rotation.x = curRX
  group.rotation.y = curRY
  // Ease the cards toward their targets (swap animation) and keep the nearer
  // one drawing on top.
  audioCard.position.lerp(audioCard.userData.target, 0.13)
  textCard.position.lerp(textCard.userData.target, 0.13)
  audioCard.renderOrder = Math.round(audioCard.position.z * 100)
  textCard.renderOrder = Math.round(textCard.position.z * 100)
  // Keep the portrait's static alive on the text card face every frame.
  drawTextFace(textCard.userData.sctx)
  textCard.userData.faceSharp.needsUpdate = true
  renderer.render(scene, camera)
}
render()
</script>

<!-- WallStreet background — rendered with three r184 (same as the alextaves app)
     so the colours/brightness match the live Moving Images scene exactly. -->
<script type="module">
import * as THREE from './vendor/three184.module.min.js'

const host = document.createElement('div')
host.style.cssText = 'position:fixed; inset:0; z-index:0; filter:blur(6px); background:#000;'
document.body.appendChild(host)

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75))
renderer.toneMapping = THREE.ACESFilmicToneMapping   // react-three-fiber default
host.appendChild(renderer.domElement)

const scene = new THREE.Scene(); scene.background = new THREE.Color('#000')
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100)
camera.position.set(0, 0, 4)

const HALF = 8
const FRAME_H = 2 * Math.tan((60 / 2) * (Math.PI / 180)) * 4
const TILE_W = FRAME_H * (9 / 16)
const SPACING = 2 * TILE_W
const TOTAL = HALF * SPACING
const BASE = TILE_W * 0.4

const stripeMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform float time; varying vec2 vUv; void main(){ float s=mod(floor((vUv.x+time*0.15)*38.0),2.0); vec3 c = s<1.0? vec3(0.192,0.282,0.345):vec3(1.0); gl_FragColor=vec4(c,1.0); }',
})
const stripe = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), stripeMat)
stripe.position.z = -0.1; scene.add(stripe)

const video = document.createElement('video')
video.src = 'videos/wallstreet.mp4'; video.loop = true; video.muted = true; video.playsInline = true
video.play().catch(() => {})
const tex = new THREE.VideoTexture(video); tex.colorSpace = THREE.SRGBColorSpace
const geo = new THREE.PlaneGeometry(TILE_W, FRAME_H)
const mat = new THREE.MeshBasicMaterial({ map: tex, blending: THREE.MultiplyBlending, transparent: true, opacity: 0.75, depthWrite: false })

const meshes = []
;[0, 1, 2, 3, 4, 5].forEach((k) => {
  const offset = TILE_W * k / 6
  for (let i = 0; i < HALF * 2; i++) { const m = new THREE.Mesh(geo, mat); scene.add(m); meshes.push({ m, offset, i }) }
})

const scroll = 0   // static weave, exactly like the live scene at rest (only the stripes animate)
function frame(now) {
  requestAnimationFrame(frame)
  stripeMat.uniforms.time.value = now / 1000
  for (const { m, offset, i } of meshes) {
    const s = scroll + offset
    if (i < HALF) m.position.x = ((i * SPACING - s % TOTAL) % TOTAL + TOTAL) % TOTAL - TOTAL / 2
    else { const j = i - HALF; m.position.x = ((j * SPACING + TILE_W + s % TOTAL) % TOTAL + TOTAL) % TOTAL - TOTAL / 2 }
  }
  renderer.render(scene, camera)
}
requestAnimationFrame(frame)

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})
</script>
