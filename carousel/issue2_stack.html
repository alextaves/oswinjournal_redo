<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Issue 2 — stacked cards (look & feel)</title>
<style>
  html, body { margin:0; height:100%; background:#12151b; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  /* Scrollable reader that fades in over the straightened text card */
  #reader { position:fixed; border:0; opacity:0; pointer-events:none; transition:opacity .35s ease; border-radius:12px; z-index:5; background:#ECE9E2; }
  #readerClose { position:fixed; z-index:6; width:36px; height:36px; border-radius:50%; border:none; background:rgba(20,19,17,0.55); color:#fff; font-size:17px; line-height:1; cursor:pointer; display:none; align-items:center; justify-content:center; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
</style>
</head>
<body>
<iframe id="reader" title="Issue 2 text"></iframe>
<button id="readerClose" aria-label="Close">✕</button>
<script src="/vendor/three.min.js"></script>
<script>
// ── Two homepage-style 3D glass cards, stacked like layers ─────────────────────
// The audio card sits on top/front; the text card sits behind and lower, so a
// step of it sticks out. Reuses the ring's material/lighting so they match.

const scene = new THREE.Scene()
scene.background = new THREE.Color('#12151b')

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100)
camera.position.set(0, 0, 9)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.appendChild(renderer.domElement)

// Environment (drives the glass reflections) — same idea as the ring.
const envScene = new THREE.Scene()
envScene.background = new THREE.Color('#0e0b08')
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 100).texture
scene.add(new THREE.HemisphereLight('#2a1a0a', '#0e0806', 0.15))
const key = new THREE.DirectionalLight('#ffffff', 1.1); key.position.set(4, 6, 5)
const rim = new THREE.DirectionalLight('#ffcf90', 0.5); rim.position.set(-5, 2, -4)
scene.add(key, rim)

// ── Card geometry ──────────────────────────────────────────────────────────────
const PW = 4.125, PH = 5.5, THICK = 0.34   // ~90% homepage card height; chunkier glass edge
const panelGeo = new THREE.BoxGeometry(PW, PH, THICK)
const FRONT_OPACITY = 0.94, BACK_OPACITY = 0.42

// Rounded-corner alpha map (soft edges), same as the ring.
const roundedAlphaMap = (() => {
  const W = 128, H = Math.round(W * PH / PW)
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d'); const r = 6
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.arcTo(W, 0, W, H, r); ctx.arcTo(W, H, 0, H, r)
  ctx.arcTo(0, H, 0, 0, r); ctx.arcTo(0, 0, W, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  const t = new THREE.CanvasTexture(c); return t
})()

// ── Face textures (canvas-drawn, like the ring cards) ──────────────────────────
const FW = 600, FH = 800, LM = 54
const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif"

function newFace() {
  const c = document.createElement('canvas'); c.width = FW; c.height = FH
  return { c, ctx: c.getContext('2d') }
}
function flipTex(canvas) {
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height
  const ctx = c.getContext('2d'); ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(canvas, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// Audio card face (warm paper, dark type) — the frosted playlist, drawn flat.
let playingIdx = -1   // active track index (0-3), or -1 for none
function drawAudioFace(ctx) {
  ctx.clearRect(0, 0, FW, FH)
  ctx.fillStyle = '#ECE9E2'; ctx.fillRect(0, 0, FW, FH)
  ctx.textAlign = 'left'
  const label = (t, x, y) => { ctx.font = `700 15px ${FONT}`; ctx.letterSpacing = '3px'; ctx.fillStyle = 'rgba(38,34,32,0.5)'; ctx.fillText(t.toUpperCase(), x, y) }
  label('Audio', LM, 92)
  ctx.font = `700 44px ${FONT}`; ctx.letterSpacing = '-0.5px'; ctx.fillStyle = '#282623'
  ctx.fillText('Christopher', LM, 150); ctx.fillText('Bissonnette', LM, 198)
  ctx.letterSpacing = '0px'
  const tracks = ['Overture', 'Orffyreus Wheel', 'Undertow', 'Color Deceives Continuously']
  let y = 280
  tracks.forEach((t, i) => {
    const on = i === playingIdx
    ctx.font = on ? `700 27px ${FONT}` : `500 27px ${FONT}`
    ctx.fillStyle = on ? '#151310' : 'rgba(42,38,35,0.82)'
    ctx.fillText(t, LM, y)
    if (on) { ctx.beginPath(); ctx.arc(LM - 22, y - 8, 5, 0, Math.PI * 2); ctx.fill() }
    y += 46
  })
  ctx.font = `italic 500 27px ${FONT}`; ctx.fillStyle = 'rgba(42,38,35,0.82)'; ctx.fillText('silent mode', LM, y); y += 70
  label('Video', LM, y); y += 40
  ctx.font = `700 30px ${FONT}`; ctx.fillStyle = '#282623'; ctx.fillText('OSWIN', LM, y); y += 62
  label('Credit Info', LM, y); y += 40
  label('Notes on Oswin', LM, y)
}

// Shared noise for the portrait's live TV static (grain only — no scanlines).
const noiseC = document.createElement('canvas'); noiseC.width = 200; noiseC.height = 200
const noiseCtx = noiseC.getContext('2d')
function regenNoise() {
  const id = noiseCtx.createImageData(200, 200), d = id.data
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255 }
  noiseCtx.putImageData(id, 0, 0)
}

// Text card face — portrait (always with live static, no hard bottom line) + title.
const PAPER = '#ECE9E2'
const portrait = new Image()
function drawTextFace(ctx) {
  ctx.clearRect(0, 0, FW, FH)
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, FW, FH)
  const imgH = 540
  if (portrait.naturalWidth) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, FW, imgH); ctx.clip()
    const s = Math.max(FW / portrait.naturalWidth, imgH / portrait.naturalHeight)
    const dw = portrait.naturalWidth * s, dh = portrait.naturalHeight * s
    ctx.filter = 'grayscale(1) contrast(1.32)'   // sharp B&W, higher contrast (kill the sepia)
    ctx.drawImage(portrait, (FW - dw) / 2, (imgH - dh) / 2, dw, dh)
    ctx.filter = 'none'
    // live grain static (no scanlines)
    regenNoise()
    ctx.imageSmoothingEnabled = false
    ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = 0.11; ctx.drawImage(noiseC, 0, 0, FW, imgH)
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.075; ctx.drawImage(noiseC, 0, 0, FW, imgH)
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1
    // fade the bottom into the paper so there's no hard line
    const g = ctx.createLinearGradient(0, imgH - 120, 0, imgH)
    g.addColorStop(0, 'rgba(236,233,226,0)'); g.addColorStop(1, 'rgba(236,233,226,1)')
    ctx.fillStyle = g; ctx.fillRect(0, imgH - 120, FW, 120)
    ctx.restore()
  }
  ctx.textAlign = 'left'
  ctx.font = `700 14px ${FONT}`; ctx.letterSpacing = '3px'; ctx.fillStyle = 'rgba(38,34,32,0.5)'
  ctx.fillText('OSWIN JOURNAL · ISSUE 2', LM, imgH + 40)
  ctx.font = `700 40px ${FONT}`; ctx.letterSpacing = '-0.5px'; ctx.fillStyle = '#282623'
  ctx.fillText('Christopher', LM, imgH + 94); ctx.fillText('Bissonnette', LM, imgH + 138)
}

function makeCard(drawFace, panelHex) {
  const sc = document.createElement('canvas'); sc.width = FW; sc.height = FH
  const sctx = sc.getContext('2d'); drawFace(sctx)
  const faceSharp = new THREE.CanvasTexture(sc); faceSharp.encoding = THREE.sRGBEncoding

  // A blurred copy of the same face — shown when this card is the one tucked
  // behind a straightened front card, so the front text reads cleanly.
  const bc = document.createElement('canvas'); bc.width = FW; bc.height = FH
  const bctx = bc.getContext('2d')
  const regenBlur = () => { bctx.clearRect(0, 0, FW, FH); bctx.filter = 'blur(11px)'; bctx.drawImage(sc, 0, 0); bctx.filter = 'none' }
  regenBlur()
  const faceBlur = new THREE.CanvasTexture(bc); faceBlur.encoding = THREE.sRGBEncoding

  const backTex = flipTex(sc)
  const col = new THREE.Color(panelHex)
  const faceMat = new THREE.MeshPhysicalMaterial({ map: faceSharp, transparent: true, opacity: FRONT_OPACITY, side: THREE.FrontSide, roughness: 0.42, metalness: 0, envMapIntensity: 0.28, clearcoat: 0.5, clearcoatRoughness: 0.4, color: 0xffffff, alphaMap: roundedAlphaMap })
  const glassMat = new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: BACK_OPACITY, roughness: 0.24, metalness: 0, envMapIntensity: 0.7, clearcoat: 0.9, clearcoatRoughness: 0.22 })
  const backMat = new THREE.MeshPhysicalMaterial({ map: backTex, transparent: true, opacity: 0.85, roughness: 0.5, metalness: 0, envMapIntensity: 0.28, color: 0xffffff, alphaMap: roundedAlphaMap })
  const sideMat = new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: 0.55, roughness: 0.2, metalness: 0, envMapIntensity: 0.85, clearcoat: 1.0, clearcoatRoughness: 0.18 })
  const mesh = new THREE.Mesh(panelGeo, [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
  mesh.userData.faceSharp = faceSharp
  mesh.userData.faceBlur = faceBlur
  mesh.userData.sctx = sctx
  mesh.userData.drawFace = drawFace
  mesh.userData.redraw = () => { drawFace(sctx); faceSharp.needsUpdate = true; regenBlur(); faceBlur.needsUpdate = true }
  return mesh
}

// Text card (back / lower) and audio card (front / upper), offset into a step.
const textCard = makeCard(drawTextFace, '#E4E0D8')
textCard.position.set(-0.32, -0.06, -0.22)

const audioCard = makeCard(drawAudioFace, '#E9E5DE')
audioCard.position.set(0.32, 0.06, 0.32)

const group = new THREE.Group()
group.add(textCard, audioCard)
scene.add(group)

// ── Click the peeking (back) card to swap it to the front ─────────────────────
const FRONT_POS = audioCard.position.clone()
const BACK_POS = textCard.position.clone()
audioCard.userData.target = FRONT_POS.clone()
textCard.userData.target = BACK_POS.clone()
let frontCard = audioCard
let focused = false   // true = front card pulled dead-centre and straight
function applyLayout() {
  const back = frontCard === audioCard ? textCard : audioCard
  if (focused) {
    frontCard.userData.target.set(0, 0, 0.28)   // straight, centred
    back.userData.target.set(0, 0, -0.28)        // tucked directly behind
  } else {
    frontCard.userData.target.copy(FRONT_POS)
    back.userData.target.copy(BACK_POS)
  }
  // Front card always sharp; the tucked-behind card blurs while focused so the
  // front text reads cleanly through the glass.
  frontCard.material[4].map = frontCard.userData.faceSharp
  frontCard.material[4].needsUpdate = true
  back.material[4].map = focused ? back.userData.faceBlur : back.userData.faceSharp
  back.material[4].needsUpdate = true
  updateReader()
}

// The scrollable HTML reader, shown over the text card when it's straightened.
const reader = document.getElementById('reader')
const readerClose = document.getElementById('readerClose')
function cardRect() {
  const dist = camera.position.z - 0.28
  const worldH = 2 * dist * Math.tan((camera.fov * Math.PI / 180) / 2)
  const pxPerWorld = innerHeight / worldH
  const w = PW * pxPerWorld, h = PH * pxPerWorld
  return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, w, h }
}
function updateReader() {
  const show = focused && frontCard === textCard
  if (show) {
    if (!reader.src) reader.src = 'issue2_text.html'
    const r = cardRect(), pad = Math.round(r.w * 0.03)
    reader.style.left = (r.left + pad) + 'px'
    reader.style.top = (r.top + pad) + 'px'
    reader.style.width = (r.w - pad * 2) + 'px'
    reader.style.height = (r.h - pad * 2) + 'px'
    reader.style.opacity = '1'; reader.style.pointerEvents = 'auto'
    readerClose.style.display = 'flex'
    readerClose.style.left = (r.left + r.w - pad - 46) + 'px'
    readerClose.style.top = (r.top + pad + 10) + 'px'
  } else {
    reader.style.opacity = '0'; reader.style.pointerEvents = 'none'
    readerClose.style.display = 'none'
  }
}
readerClose.addEventListener('click', () => { focused = false; applyLayout() })
// ── Track playback (click a track on the audio card face) ─────────────────────
const AUDIO_FILES = ['overture.mp3', 'orffyreus_wheel.mp3', 'undertow.mp3', 'color_deceives.mp3']
const audioCache = {}
let currentAudio = null
function toggleTrack(i) {
  if (i === 4) {   // silent mode → stop
    if (currentAudio) currentAudio.pause()
    currentAudio = null; playingIdx = -1; audioCard.userData.redraw(); return
  }
  const file = AUDIO_FILES[i]
  if (!audioCache[file]) {
    audioCache[file] = new Audio('audio/c_bissonnette/' + file)
    audioCache[file].addEventListener('ended', () => { if (playingIdx === i) { playingIdx = -1; currentAudio = null; audioCard.userData.redraw() } })
  }
  const a = audioCache[file]
  if (currentAudio && currentAudio !== a) currentAudio.pause()
  if (a.paused) { a.play().catch(() => {}); currentAudio = a; playingIdx = i }
  else { a.pause(); currentAudio = null; playingIdx = -1 }
  audioCard.userData.redraw()
}
// Map a hit UV on the audio face to a track row (0-3 tracks, 4 = silent mode).
function trackAt(uv) {
  if (!uv) return -1
  const cx = uv.x * FW, cy = (1 - uv.y) * FH
  if (cx < LM - 26 || cx > LM + 430) return -1
  const base = [280, 326, 372, 418, 464]
  for (let i = 0; i < base.length; i++) if (cy > base[i] - 34 && cy < base[i] + 10) return i
  return -1
}

const raycaster = new THREE.Raycaster()
const ptr = new THREE.Vector2()
renderer.domElement.addEventListener('pointerdown', (e) => {
  ptr.x = (e.clientX / innerWidth) * 2 - 1
  ptr.y = -((e.clientY / innerHeight) * 2 - 1)
  raycaster.setFromCamera(ptr, camera)
  const hits = raycaster.intersectObjects([audioCard, textCard], false)
  if (!hits.length) return
  const hit = hits[0].object
  // A track click on the front audio card plays/stops it (not straighten/swap).
  if (hit === audioCard && audioCard === frontCard && hits[0].face && hits[0].face.materialIndex === 4) {
    const i = trackAt(hits[0].uv)
    if (i >= 0) { toggleTrack(i); return }
  }
  if (hit === frontCard) focused = !focused        // click the front card → straighten (toggle)
  else { frontCard = hit; focused = false }         // click the back card → swap it to front
  applyLayout()
})

// Redraw the text card once the portrait decodes.
portrait.onload = () => { textCard.userData.redraw() }
portrait.src = 'images/chris_portrait.png'

// ── Gentle pointer parallax so the step/depth reads ────────────────────────────
let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) * 2 - 1
  const ny = (e.clientY / innerHeight) * 2 - 1
  targetRY = nx * 0.28
  targetRX = -ny * 0.16
})
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
  updateReader()
})

function render() {
  requestAnimationFrame(render)
  // At rest, a slight angle so the glass thickness/edges read (like the ring);
  // when focused, straighten dead-on.
  const BASE_RX = -0.05, BASE_RY = 0.13
  const wantRX = focused ? 0 : (BASE_RX + targetRX)
  const wantRY = focused ? 0 : (BASE_RY + targetRY)
  curRX += (wantRX - curRX) * 0.06
  curRY += (wantRY - curRY) * 0.06
  group.rotation.x = curRX
  group.rotation.y = curRY
  // Ease the cards toward their targets (swap animation) and keep the nearer
  // one drawing on top.
  audioCard.position.lerp(audioCard.userData.target, 0.13)
  textCard.position.lerp(textCard.userData.target, 0.13)
  audioCard.renderOrder = Math.round(audioCard.position.z * 100)
  textCard.renderOrder = Math.round(textCard.position.z * 100)
  // Keep the portrait's static alive on the text card face every frame.
  drawTextFace(textCard.userData.sctx)
  textCard.userData.faceSharp.needsUpdate = true
  renderer.render(scene, camera)
}
render()
</script>
</body>
</html>
