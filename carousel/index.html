<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html, body { margin: 0; height: 100%; background: #0c0806; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }

  /* ── Slow-down note ───────────────────────────────────────────────────────────
     Matched to the ring's geometry, not eyeballed:
       height  — a card is 0.9 of the viewport height (panelH in setPanelSize)
       width   — 3/4 of that, the same ratio the cards use
       type    — card titles top out at 74px on a 600x800 card face, so 2/3 of
                 that is 49.33/800 of the card height = 6.167% -> 5.55vh   */
  .slow-note {
    --note-h: 90vh;
    position: fixed; z-index: 60;
    left: 0; top: 50%; transform: translateY(-50%);
    height: var(--note-h); width: calc(var(--note-h) * 3 / 4);
    box-sizing: border-box;
    background: #1B4D3E;
    color: #fff;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 8% 7%;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: calc(var(--note-h) * 0.0617);
    line-height: 1.22;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    transition: opacity 300ms ease;
  }
  .slow-note[hidden] { display: none; }
  .slow-note p { margin: 0; }
  /* #8127D3 — the Arnold Schoenberg purple, averaged off the 1.49M matching
     pixels in images/giftshop-purple.jpg rather than picked by eye. */
  .slow-note .play {
    margin: 0.6em 0 0; padding: 0;
    background: none; border: none; cursor: pointer;
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    color: #8127D3;
    transition: opacity 200ms ease;
  }
  .slow-note .play:hover { opacity: 0.8; }
  .slow-note .credit {
    margin: 0.55em 0 0;
    font-size: 0.42em; font-weight: 300;
    letter-spacing: 0.08em; opacity: 0.85;
  }
  .slow-note .close {
    position: absolute; top: 3%; right: 4%;
    width: 1.1em; height: 1.1em; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: #fff; font-family: inherit; font-weight: 300;
    font-size: calc(var(--note-h) * 0.038); line-height: 1;
    opacity: 0.75; transition: opacity 200ms ease;
  }
  .slow-note .close:hover { opacity: 1; }

  /* Re-open tab: parked on the left edge where the note sits, sized to the same
     visual weight as the note's ✕ so the open/close pair match. */
  .slow-note-open {
    --note-h: 90vh;
    position: fixed; z-index: 60;
    left: 0; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 1.9em; height: 1.9em; padding: 0;
    background: #1B4D3E; color: #fff;
    border: none; cursor: pointer;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 300; line-height: 1;
    font-size: calc(var(--note-h) * 0.038);
    opacity: 0.9; transition: opacity 200ms ease;
  }
  .slow-note-open:hover { opacity: 1; }
  .slow-note-open[hidden] { display: none; }

  .story-overlay {
    --bg: #D9D02F; --bg-r: 217; --bg-g: 208; --bg-b: 47;
    container-type: size;
    position: fixed; z-index: 50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 3px),
      rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.9);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    opacity: 0; pointer-events: none;
    transition: opacity 400ms ease;
    overflow-y: auto; overflow-x: hidden;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 0 90px 18px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.4),
      0 25px 80px rgba(0, 0, 0, 0.7);
  }
  .story-overlay.active {
    opacity: 1; pointer-events: auto;
    animation: storyGlow 5s ease-in-out infinite;
  }
  @keyframes storyGlow {
    0%, 100% { box-shadow: 0 0 90px 18px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.4), 0 25px 80px rgba(0, 0, 0, 0.7); }
    50%      { box-shadow: 0 0 130px 30px rgba(var(--bg-r), var(--bg-g), var(--bg-b), 0.6), 0 25px 80px rgba(0, 0, 0, 0.7); }
  }
  .story-text {
    padding: 7% 8% 10%;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    color: #000;
  }
  .story-text::after { content: ''; display: table; clear: both; }
  /* Same typed-title treatment used for the fiction ring's story cards —
     black ink, floated so the prose wraps around it like a headline. */
  .story-cover-title {
    float: left;
    width: 44%;
    margin: 0 1.6em 1em 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-size: 2.3em;
    line-height: 1.14;
    color: #000;
  }
  .story-cover-title .line { min-height: 1.14em; }
  .story-cover-title .line.cursor-on::after {
    content: '';
    display: inline-block;
    width: 0.06em; height: 0.85em;
    background: #000;
    margin-left: 0.05em;
    vertical-align: -0.08em;
  }
  .story-body p {
    letter-spacing: 0.01em;
    font-size: 1.05em; line-height: 1.85; margin: 0 0 1.2em;
  }
  .story-body .entry-date { font-weight: 700; }
  .story-body .typing::after {
    content: '▋'; color: #000; margin-left: 0.12em;
    animation: caretBlink 0.9s steps(1) infinite;
  }
  @keyframes caretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Enquiries — sized with container-query units so the heading lands at
     exactly the same scale and position as the plain card's own canvas
     texture (makePortalTex: 74px title baseline at 16.5% of height, 9%
     left margin, thin tracked sub at 23.75%) — the form reads as the same
     card continuing to unfold, not a differently-proportioned modal. */
  .enquiry-form {
    display: none;
    padding: 9.5cqh 9cqw 5cqh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #000;
  }
  .enquiry-form h1 {
    font-weight: 700; letter-spacing: -0.01em;
    font-size: 9.25cqh; line-height: 1;
    margin: 0; padding-bottom: 2.3cqh;
    border-bottom: 1px solid rgba(0, 0, 0, 0.22);
    color: rgba(0, 0, 0, 0.88);
  }
  .enquiry-form .enquiry-sub {
    font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 1.75cqh; color: rgba(0, 0, 0, 0.50);
    margin: 3.2cqh 0 7cqh;
  }
  .enquiry-form label {
    display: block;
    font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 1.75cqh; color: rgba(0, 0, 0, 0.75);
    margin: 0 0 4.5cqh;
  }
  .enquiry-form input, .enquiry-form textarea {
    display: block;
    width: 100%;
    margin-top: 1.4cqh;
    background: transparent;
    border: none; border-bottom: 1px solid rgba(0, 0, 0, 0.3);
    padding: 0.6cqh 0;
    font-family: inherit;
    font-weight: 300; letter-spacing: 0.01em; text-transform: none;
    font-size: 2.9cqh;
    color: #000;
    outline: none;
  }
  .enquiry-form input:focus, .enquiry-form textarea:focus { border-bottom-color: #000; }
  .enquiry-form textarea { resize: vertical; min-height: 8cqh; }
  .enquiry-form button[type="submit"] {
    display: block;
    margin-top: 1.5cqh;
    background: none; border: none; border-bottom: 2px solid #000;
    padding: 0.4cqh 0;
    font-family: inherit;
    font-weight: 700; letter-spacing: 0.02em;
    font-size: 2.9cqh;
    color: #000;
    cursor: pointer;
  }
  .enquiry-form button[type="submit"]:hover { opacity: 0.7; }
  .enquiry-form .enquiry-status {
    margin: 2cqh 0 0;
    font-weight: 300; letter-spacing: 0.1em;
    font-size: 1.75cqh; color: rgba(0, 0, 0, 0.6);
  }
</style>

<script>
  // Lobby music — the HWY 3 track, on Web Audio rather than <audio> because an
  // <audio> element cannot play backwards (playbackRate is clamped positive).
  // We decode once, keep a sample-reversed copy of the buffer, and crossfade
  // between the two voices whenever the ring changes direction. The playhead is
  // tracked in forward-time, so the reverse voice starts at (duration - pos).
  const LOBBY_URL = 'audio/hwy3_lobby.mp3'
  // Three fade lengths, because the three transitions mean different things.
  // XFADE stays tiny: it only spans a direction flip, where both voices are the
  // same tape and a long blend would phase against itself. The other two are
  // meant to be heard as gestures — nothing here should ever cut.
  const XFADE = 0.05        // direction flip mid-scrub
  const FADE_TOGGLE = 0.6   // the PLAY / PAUSE card
  const FADE_ISSUE = 1.6    // stepping into or out of an issue

  let actx = null, bufFwd = null, bufRev = null, loading = null
  let voice = null, curDir = 1, playing = false
  let posSec = 0, posAt = 0

  const lobby = { get paused() { return !playing } }

  async function lobbyLoad() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)()
    if (!loading) loading = (async () => {
      const ab = await (await fetch(LOBBY_URL)).arrayBuffer()
      bufFwd = await actx.decodeAudioData(ab)
      bufRev = actx.createBuffer(bufFwd.numberOfChannels, bufFwd.length, bufFwd.sampleRate)
      for (let c = 0; c < bufFwd.numberOfChannels; c++) {
        const a = bufFwd.getChannelData(c), b = bufRev.getChannelData(c)
        for (let i = 0, n = a.length; i < n; i++) b[i] = a[n - 1 - i]
      }
    })()
    await loading
  }

  function lobbyPos() {
    if (!playing || !bufFwd) return posSec
    const d = bufFwd.duration
    const p = posSec + (actx.currentTime - posAt) * curDir
    return ((p % d) + d) % d
  }

  function lobbyStart(dir, fade) {
    const d = bufFwd.duration
    const pos = lobbyPos()
    const src = actx.createBufferSource()
    src.buffer = dir > 0 ? bufFwd : bufRev
    src.loop = true
    const g = actx.createGain()
    const t = actx.currentTime
    g.gain.setValueAtTime(fade ? 0.0001 : 1, t)
    if (fade) g.gain.linearRampToValueAtTime(1, t + fade)
    src.connect(g); g.connect(actx.destination)
    src.start(0, dir > 0 ? pos : d - pos)
    posSec = pos; posAt = t
    return { src, g }
  }

  function lobbyStop(v, fade = XFADE) {
    if (!v) return
    const t = actx.currentTime
    v.g.gain.cancelScheduledValues(t)
    v.g.gain.setValueAtTime(v.g.gain.value, t)
    v.g.gain.linearRampToValueAtTime(0.0001, t + fade)
    v.src.stop(t + fade + 0.02)
  }

  async function lobbyPlay(fade = FADE_TOGGLE) {
    playing = true                 // optimistic so the card label flips at once
    await lobbyLoad()
    await actx.resume()
    if (!playing) return           // paused again while decoding
    // Restart the clock BEFORE lobbyStart reads the playhead. lobbyPos() only
    // returns the parked posSec while `playing` is false, and we just set it
    // true — so without this it extrapolates from the posAt of the last start,
    // silently adding however long we were paused. Pausing for a two-minute
    // visit to an issue would resume two minutes further into the track.
    posAt = actx.currentTime
    voice = lobbyStart(curDir, fade)
  }

  function lobbyPause(fade = FADE_TOGGLE) {
    posSec = lobbyPos(); playing = false
    lobbyStop(voice, fade); voice = null
  }

  function toggleLobby() {
    if (playing) lobbyPause(); else lobbyPlay()
    return playing
  }

  // Called every frame by the ring: +1 with the idle rotation, -1 when you scrub
  // against it. Crossfades the tape rather than cutting.
  function setLobbyDirection(dir) {
    if (!playing || !bufFwd || dir === curDir) return
    // Sample the playhead with the OLD direction FIRST. Flipping curDir before
    // reading it makes lobbyPos() extrapolate the elapsed time the wrong way and
    // the position leaps (and wraps) instead of continuing from where it was.
    posSec = lobbyPos(); posAt = actx.currentTime
    const old = voice
    curDir = dir
    voice = lobbyStart(dir, XFADE)
    lobbyStop(old)
  }

  // Where an issue card sends you. The ?issue=N deep link is handled in the React
  // app (src/App.jsx) and is NOT on main yet, so oswinjournal.com ignores it until
  // that branch ships — until then these links would land on the archive. Running
  // from localhost we therefore point at the local Vite app (npm run dev, :5173),
  // which does understand it. Delete the localhost branch once main has deep links.
  const LIVE_ORIGIN = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://localhost:5173'
    : 'https://oswinjournal.com'
  const LIVE_ISSUE = (n) => `${LIVE_ORIGIN}/?issue=${n}`

  // An issue is its own sound world. When the issue page starts playing audio it
  // posts up to us and the lobby steps aside; the lobby comes back when you LEAVE
  // the issue (see closeCardIframe), not when the issue merely goes quiet —
  // otherwise muting a track mid-visit would pipe corridor music into the room.
  //
  // duckedFrom remembers whether the lobby was actually playing when we ducked,
  // so a lobby you had deliberately paused stays paused when you come back out.
  let duckedFrom = null
  function duckLobby() {
    if (duckedFrom !== null) return   // already ducked; keep the original state
    duckedFrom = playing
    if (playing) lobbyPause(FADE_ISSUE)
  }
  function restoreLobby() {
    const was = duckedFrom
    duckedFrom = null
    if (was && !playing) lobbyPlay(FADE_ISSUE)
  }

  // Set by openCardIframe while a card is open; the overlay owns the BACK label.
  let revealCardBack = null

  window.addEventListener('message', (e) => {
    if (e.origin !== LIVE_ORIGIN) return
    const d = e.data
    if (!d) return
    if (d.type === 'oswinIssueAudio' && d.on) duckLobby()
    // The issue's own "home" control. Home is this ring, so close the overlay
    // and fade the lobby back in.
    if (d.type === 'oswinExitIssue') closeCardIframe()
    // Movement inside the issue — surface BACK for a moment.
    if (d.type === 'oswinActivity' && revealCardBack) revealCardBack(true)
  })
</script>
<div class="story-overlay" id="storyOverlay">
  <div class="story-text" id="storyText">
    <div class="story-cover-title" id="storyCoverTitle">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="story-body" id="storyBody"></div>
  </div>
  <div class="enquiry-form" id="enquiryForm">
    <h1>ENQUIRIES</h1>
    <p class="enquiry-sub">get in touch · looking for like minded</p>
    <form id="enquiryFormEl">
      <label>NAME:<input type="text" name="name" autocomplete="name" required></label>
      <label>EMAIL:<input type="email" name="email" autocomplete="email" required></label>
      <label>MESSAGE:<textarea name="message" required></textarea></label>

<script src="/vendor/three.min.js"></script>
<script>
// STANDALONE OSWIN CAROUSEL PROTOTYPE. Each card is one of the 6 Artboard
// placeholder images, drawn as the full card face (no title/sub text overlay —
// the images already carry their own type). `bg` is the average colour of each
// image, used for the card's sides, back plate, and floor reflection so the
// glass/reflection tint matches the image sitting on it.
const OSWIN_JOURNAL_BODY = [
  `Oswin Journal is a browser built as a gallery. Each issue is a room you enter, not a page you scroll. It began around a simple pairing, a piece of music sat beside a piece of visual art, and it has since loosened into something harder to name and closer to the truth: a curation of things that intrigue me. Sound, image, fiction, whatever the issue asks for. Some rooms lead with music. Some lead with the art and let the sound hold the walls. The pairing was never the point; the room was.`,
  `I've done this in physical space before. I curated Oswald Gallery in Hamilton, Ontario, which the New York Times found within its first six months. Oswin is the same eye moved onto the web, except the web can do something a white room cannot: the space itself can respond, hold sound, change as you move through it. The old line is that the medium is the message. Here that is literal. The room is not where the work is shown. The room is the work.`,
  `There is no feed here, no infinite anything, no next. An issue is made, and then it is finished, and then you can stand in it. What that asks of you is the opposite of what most of the web asks: not attention paid in fragments, but a few minutes given whole. Most of the web forgot it could be this. I'm interested in recalibrating it toward what it was always able to do. You came in through a door. You can stay as long as you like.`,
]

// Order matters: the ring lands on Oli (issue 4, index 3) and, going to the LEFT
// (increasing index), the next cards are issue 3 (Arnold), 2 (Chris), 1 (Karla).
// The other three cards sit on Oli's right.
const PORTALS = [
  { image: 'cards/alexander.png', tv: true, title: 'ALEXANDER TAVES', sub: '', bottomCaption: 'oswin curator', bg: '#0a0a0a', titleColor: '#FFFFFF' },  // Alexander Taves (04)
  { title: 'ENQUIRIES', sub: 'get in touch · looking for like minded', bg: '#00C2A8', light: false },  // Enquiries — exact alextaves card (index must match ENQUIRIES_INDEX)
  { title: 'OSWIN JOURNAL', sub: 'a browser built as a gallery', body: OSWIN_JOURNAL_BODY, bg: '#D4D2CB', light: false },  // was ALEX TAVES (06.png)
  { title: 'OLI GOLDSMITH', sub: 'issue 4', bg: '#FF4F79', light: true, iframe: 'https://ethernity.space/', badge: 4 },  // issue 4 — Oli (landing card); click opens a fullscreen iframe
  { slideshow: ['images/giftshop-green.jpg', 'images/giftshop-orange.jpg', 'images/giftshop-purple.jpg', 'images/giftshop-red.jpg'], title: 'ARNOLD SCHOENBERG', sub: '', bottomCaption: 'visuals by oswin', bg: '#777777', titleColor: '#FFFFFF', badge: 3, iframe: LIVE_ISSUE(3) },  // issue 3 — Arnold (click enters the live Schoenberg piano experience)
  { video: 'videos/chris_bluedancer.mp4', title: 'CHRISTOPHER BISSONNETTE', sub: '', bottomCaption: 'visuals by oswin', bg: '#12151b', titleColor: '#FFFFFF', badge: 2, iframe: LIVE_ISSUE(2) },  // issue 2 — Chris (click enters the live issue-2 page, same as the other issues)
  { video: 'videos/karla_prerace.mp4', title: 'KARLA IS HERE', sub: '', bottomCaption: 'visuals by oswin', bg: '#12151b', titleColor: '#1E2BFF', badge: 1, iframe: LIVE_ISSUE(1) },  // issue 1 — Karla (click enters the live issue-1 detail page)
]
const LANDING_INDEX = 3   // Oli — the card the ring lands on
const COUNT = PORTALS.length
// All the alextaves special-card behaviours (animated Moving Images, Archive
// video, Detroit/Postcards traces, Oswin/Enquiries/Unfiltered/Alex overlays,
// WELCOME entry) are switched off by pointing their indices at -1 — every
// special-case branch in the file is index-guarded, so none of them fire and
// we're left with a clean ring of image cards.
const UNFILTERED_INDEX = -1
const ENQUIRIES_INDEX = 1   // the exact alextaves enquiries card (form preview + typing sample)
const OSWIN_INDEX = -1
const MOVING_IMAGES_INDEX = -1
const ALEX_TAVES_INDEX = -1
const DETROIT_INDEX = -1
const POSTCARDS_INDEX = -1
const ARCHIVE_INDEX = -1
const ARCHIVE_URL = ''
const WELCOME_INDEX = -1

// No WELCOME entry: the ring auto-rotates from the start.
let welcomeActive = false
let welcomeAudioOn = true
let welcomeRegions = null

// Preload each card's media; makePortalTex draws it once ready (see below).
// Image cards get an <img>; the Karla card gets a looping muted <video> that
// the render loop redraws onto its face while it's in the visible front arc.
PORTALS.forEach((p) => {
  if (p.image) {
    const im = new Image()
    im.src = p.image
    p._img = im
  }
  if (p.video) {
    const v = document.createElement('video')
    v.src = p.video; v.muted = true; v.loop = true; v.playsInline = true
    v.setAttribute('webkit-playsinline', ''); v.autoplay = true
    v.play().catch(() => {})
    p._video = v
  }
  if (p.slideshow) {
    p._slides = p.slideshow.map((src) => { const im = new Image(); im.src = src; return im })
  }
})

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene()
const bgC = document.createElement('canvas'); bgC.width = 4; bgC.height = 512
const bgCtx = bgC.getContext('2d')
const bgG = bgCtx.createLinearGradient(0, 0, 0, 512)
bgG.addColorStop(0, '#16110d'); bgG.addColorStop(1, '#0a0704')
bgCtx.fillStyle = bgG; bgCtx.fillRect(0, 0, 4, 512)
const bgTex = new THREE.CanvasTexture(bgC); bgTex.encoding = THREE.sRGBEncoding
scene.background = bgTex
scene.fog = new THREE.Fog('#0e0b08', 8, 50)

// Touch-capability detection (ontouchstart/maxTouchPoints) is unreliable on
// Chrome for iOS specifically — it's a WKWebView wrapper, not Safari's native
// engine plumbing, and has been observed reporting no touch support at all,
// which silently forces the desktop code path on an actual phone regardless
// of the page's own site-mode setting. Viewport width alone is a sufficient,
// more robust signal for "this is a phone/small tablet".
const isMobile = innerWidth < 1024
const RADIUS    = 6.0
const CAM_Z     = 10.0
const MOB_CAM_Z = 2.5
// Mobile ring radius must stay smaller than MOB_CAM_Z so the camera sits
// outside the ring looking in (same relationship desktop has: CAM_Z > RADIUS).
// Using the desktop RADIUS here would put the camera *inside* the ring on
// mobile, causing panels to flip/invert as they cross behind it.
const MOB_RADIUS = 1.5

// Mobile browsers can report a taller innerHeight at load than what's
// actually settled/visible once the address bar finishes animating, and
// visualViewport.height disagrees between Safari and Chrome on the same
// device. CSS `svh` (small viewport height) is the standards-based fix: a
// WebKit-engine-level primitive guaranteed to reflect the height visible
// with the toolbar fully expanded, so it behaves consistently across
// browser apps sharing that engine. Desktop is untouched (plain innerHeight).
const svhProbe = document.createElement('div')
svhProbe.style.cssText = 'position:fixed; top:0; left:0; height:100svh; width:0; visibility:hidden; pointer-events:none;'
document.body.appendChild(svhProbe)
const viewportH = () => {
  if (!isMobile) return innerHeight
  const svh = svhProbe.getBoundingClientRect().height
  const vv = window.visualViewport ? window.visualViewport.height : innerHeight
  return svh > 0 ? Math.min(svh, innerHeight) : Math.min(innerHeight, vv)
}

const camera = new THREE.PerspectiveCamera(55, innerWidth / viewportH(), 0.1, 200)
camera.position.set(0, 0, isMobile ? MOB_CAM_Z : CAM_Z)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, viewportH())
// Adaptive resolution. This scene is fragment-bound (many large translucent,
// blended panels + AA), so on a Retina/high-DPI or weaker GPU, rendering at 2x
// device pixels is what makes the ring step like a second hand. Start at a
// lighter ratio and let the render loop drop it further if the machine can't

// ── Panel geometry ────────────────────────────────────────────────────────────

const mobNearDist = MOB_CAM_Z - MOB_RADIUS
const vFOV = (camera.fov * Math.PI) / 180
let panelW, panelH
if (isMobile) {
  const hFOVhalf = Math.atan(Math.tan(vFOV / 2) * camera.aspect)
  panelW = 2 * mobNearDist * Math.tan(hFOVhalf) * 0.95
  panelH = panelW * (4 / 3)
} else {
  panelH = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
  panelW = panelH * (3 / 4)
}
// THICK is the card's physical depth in world units. Kept proportional to
// panelH (rather than a fixed absolute value) so its edge — visible as a
// dim sliver whenever a card isn't perfectly flat-on to the camera — reads
// at the same relative size on mobile as on desktop. Mobile's camera sits
// much closer to the ring (2.5 vs 10 units away), so the same absolute
// thickness used to look proportionally far more prominent there.
const desktopPanelHRef = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
const THICK      = 0.16 * (panelH / desktopPanelHRef)
const REFL_FRAC  = 0.55
const FRONT_OPACITY = 0.92
const BACK_OPACITY  = 0.42
// SPREAD < 1 compresses ring position without compressing each panel's own
// facing angle (computed from the true, uncompressed geometry below) — on
// the vertical mobile ring that mismatch crowds far more panels into the
// camera's view at once than the FOV should allow, and mismatches each
// one's tilt against where it's actually drawn. Full spread avoids both.
const SPREAD = 1.0
// Mobile touch feel matches the desktop drag/momentum physics (SENS,
// AUTO_SPEED, MAX_VEL, FRICTION below) — same ring, same units (radians),
// just spun about the vertical axis instead of the horizontal one, and
// driven by a vertical swipe instead of a horizontal drag.
const MOB_TOUCH_SENS = 0.006
const panelGeo = new THREE.BoxGeometry(panelW, panelH, THICK)
const reflH    = panelH * REFL_FRAC
const reflGeo  = new THREE.PlaneGeometry(panelW, reflH)

// ── Alpha map ─────────────────────────────────────────────────────────────────
const roundedAlphaMap = (() => {
  const W = 128, H = Math.round(W * panelH / panelW)
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  const r = 5
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.lineTo(W - r, 0)
  ctx.arcTo(W, 0, W, r, r); ctx.lineTo(W, H - r)
  ctx.arcTo(W, H, W - r, H, r); ctx.lineTo(r, H)
  ctx.arcTo(0, H, 0, H - r, r); ctx.lineTo(0, r)
  ctx.arcTo(0, 0, r, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  return new THREE.CanvasTexture(c)
})()

// ── Glow reflection ───────────────────────────────────────────────────────────
function makePortalReflTex(bgHex) {
  const r = parseInt(bgHex.slice(1,3), 16)
  const g = parseInt(bgHex.slice(3,5), 16)
  const b = parseInt(bgHex.slice(5,7), 16)
  const W = 256, H = 160
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, W * 0.72)
  grd.addColorStop(0,    `rgba(${r},${g},${b},0.55)`)
  grd.addColorStop(0.35, `rgba(${r},${g},${b},0.22)`)
  grd.addColorStop(0.7,  `rgba(${r},${g},${b},0.06)`)
  grd.addColorStop(1,    `rgba(${r},${g},${b},0.0)`)
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H)
  const fade = ctx.createLinearGradient(0, 0, 0, H)
  fade.addColorStop(0,    'rgba(14,11,8,0.55)')
  fade.addColorStop(0.12, 'rgba(14,11,8,0.0)')
  fade.addColorStop(0.7,  'rgba(14,11,8,0.0)')
  fade.addColorStop(1,    'rgba(14,11,8,0.82)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Duotone trace — a faint single-hue impression of a video frame or still
// image, composited behind a card's title so it reads as a subtle imprint
// of the content ("a hint of the video play") rather than a picture in its
// own right. Reuses the portal's own bg colour as the tint, so it always
// "reads" as that card's colour, just varied by the source's luminance.
const duotoneOff = document.createElement('canvas')
const duotoneOffCtx = duotoneOff.getContext('2d')
function drawDuotoneTrace(ctx, source, W, H, tintHex, alpha, grayscaleAmt = 1) {
  const sw = source.videoWidth || source.naturalWidth
  const sh = source.videoHeight || source.naturalHeight
  if (!sw || !sh) return
  duotoneOff.width = W; duotoneOff.height = H
  duotoneOffCtx.filter = `grayscale(${grayscaleAmt}) contrast(1.1)`
  const scale = Math.max(W / sw, H / sh)
  const dw = sw * scale, dh = sh * scale
  duotoneOffCtx.drawImage(source, (W - dw) / 2, (H - dh) / 2, dw, dh)
  duotoneOffCtx.filter = 'none'
  duotoneOffCtx.globalCompositeOperation = 'multiply'
  duotoneOffCtx.fillStyle = tintHex
  duotoneOffCtx.fillRect(0, 0, W, H)
  duotoneOffCtx.globalCompositeOperation = 'source-over'
  ctx.save()
  ctx.globalAlpha = alpha
  ctx.drawImage(duotoneOff, 0, 0, W, H)
  ctx.restore()
}

// Swimmer marquee trace: each figure is height-fit to the card and the
// seamless tile is repeated across, offset by swimScroll so the figures
// drift right-to-left. Same duotone (grayscale → tint multiply) as the trace
// above, so it reads identically to the diver it replaced.
const SWIM_TILE_ASPECT = 555 / 995   // seamless tile's own width / height
const SWIM_SCROLL_SPEED = 0.12       // tile-widths per second, right-to-left
const SWIM_WATER = 0.08              // ripple strength — a touch of water, gentler than the marquee
const SWIM_CAUSTIC = 0.04           // caustic shimmer strength (subtle)
let swimScroll = 0                   // accumulated tile-widths
let swimTime = 0                     // seconds, drives the ripple + caustic phase

// Caustic shimmer: the marquee's shader adds a moving light-mesh (product of
// two drifting sine gratings) on top of the figure. We reproduce it on a small
// offscreen buffer — cheap to compute, and upscaling softens it into blobs —
// then composite it additively over the card.
const CAUSTIC_W = 150, CAUSTIC_H = 200
const causticCanvas = document.createElement('canvas')
causticCanvas.width = CAUSTIC_W; causticCanvas.height = CAUSTIC_H
const causticCtx = causticCanvas.getContext('2d')
const causticData = causticCtx.createImageData(CAUSTIC_W, CAUSTIC_H)
function drawCaustics(ctx, W, H, t) {
  const d = causticData.data
  let i = 0
  for (let py = 0; py < CAUSTIC_H; py++) {
    const uy = py / CAUSTIC_H
    for (let px = 0; px < CAUSTIC_W; px++) {
      const ux = px / CAUSTIC_W
      const c = (Math.sin(ux * 22.0 + uy * 18.0 + t * 1.6) * 0.5 + 0.5)
              * (Math.sin(ux * 11.0 - uy * 26.0 - t * 2.1) * 0.5 + 0.5)
      d[i] = 255; d[i + 1] = 255; d[i + 2] = 255
      d[i + 3] = c * SWIM_CAUSTIC * 255
      i += 4
    }
  }
  causticCtx.putImageData(causticData, 0, 0)
  ctx.save()
  ctx.globalCompositeOperation = 'lighter'
  ctx.imageSmoothingEnabled = true
  ctx.drawImage(causticCanvas, 0, 0, W, H)
  ctx.restore()
}
function drawSwimTrace(ctx, W, H, tintHex, alpha, grayscaleAmt = 1) {
  const tile = swimGrayTile || (swimImg.complete && swimImg.naturalWidth ? swimImg : null)
  if (!tile) return
  // 1. Build the scrolling, tiled figure as a plain greyscale plate offscreen.
  //    The greyscale/contrast is pre-baked into swimGrayTile once (buildSwimGray),
  //    so this loop is plain drawImage — no per-frame canvas filter. Size the
  //    offscreen only when it changes, so we don't reallocate it every frame.
  if (duotoneOff.width !== W || duotoneOff.height !== H) { duotoneOff.width = W; duotoneOff.height = H }
  else duotoneOffCtx.clearRect(0, 0, W, H)
  const dh = H
  const dw = dh * SWIM_TILE_ASPECT
  const startX = -(((swimScroll % 1) + 1) % 1) * dw
  for (let x = startX; x < W; x += dw) {
    duotoneOffCtx.drawImage(tile, x, 0, dw, dh)
  }
  // 2. Composite to the card in horizontal slices, each nudged sideways by the
  //    same sine ripple the marquee shader uses, so the figure reads as seen
  //    through moving water.
  ctx.save()
  ctx.globalAlpha = alpha
  const SLICE = 3
  for (let y = 0; y < H; y += SLICE) {
    const v = y / H
    const dx = (Math.sin(v * 14.0 + swimTime * 1.3) * 0.014
              + Math.sin(v * 23.0 - swimTime * 0.8) * 0.006) * SWIM_WATER * W
    ctx.drawImage(duotoneOff, 0, y, W, SLICE, dx, y, W, SLICE)
  }
  ctx.restore()
  // Bright caustic light-mesh over the figure, at full additive strength.
  drawCaustics(ctx, W, H, swimTime)
}

// OSWIN JOURNAL: a large black circle filling most of the bottom 3/4 of the

function drawOswinCircle(ctx, W, H, portal) {

  const margin = 20

}

// ── Portal card texture ───────────────────────────────────────────────────────
// drawTrace(ctx, W, H), if given, is called right after the bg fill and
// before the title — used to bake in the faint duotone trace above.
// Mean luminance of a card region — used to decide whether the title needs a
// light or dark ink to read against whatever the image puts behind it.
function regionLuma(ctx, x, y, w, h) {
  const data = ctx.getImageData(x, y, w, h).data
  let sum = 0, n = 0
  for (let i = 0; i < data.length; i += 16) {
    sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; n++
  }
  return sum / n
}

// The genuine lightest colour of a trace panel's *source* photo (before the
// duotone tint darkens it). Cached once the image has loaded.
const _srcLightest = new Map()
function sourceLightest(portal) {
  if (_srcLightest.has(portal)) return _srcLightest.get(portal)
  const img = portal === PORTALS[DETROIT_INDEX] ? detroitTraceImg
            : portal === PORTALS[POSTCARDS_INDEX] ? postcardsTraceImg
            : portal === PORTALS[MOVING_IMAGES_INDEX] ? swimImg : null
  if (!img || !img.complete || !img.naturalWidth) return null
  const w = 100, h = 133
  const oc = document.createElement('canvas'); oc.width = w; oc.height = h
  const octx = oc.getContext('2d'); octx.drawImage(img, 0, 0, w, h)
  const d = octx.getImageData(0, 0, w, h).data
  let bl = -1, r = 245, g = 245, b = 245
  for (let i = 0; i < d.length; i += 4) {
    const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]
    if (l > bl) { bl = l; r = d[i]; g = d[i + 1]; b = d[i + 2] }
  }
  const c = { r, g, b }; _srcLightest.set(portal, c); return c
}

// Which titles currently read as light ink; sticky per portal (hysteresis) so
// the animated Moving Images card doesn't flicker as its backdrop scrolls.
// _titleSampled throttles the (costly) getImageData for the animated card.
const _titleLight = new Map()
const _titleSampled = new Map()

// Shared title metrics: keep the type large and wrap long titles onto two lines
// (three only if a title truly won't fit one word per line at the minimum size),
// shrinking only as a last resort. Also reports where the header ends so the
// content cards can start their body below a taller, wrapped title.
function titleLayout(ctx, portal, maxW) {
  let size = 74, lines
  for (; size >= 24; size -= 2) {
    ctx.font = `700 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '-0.01em'
    lines = wrapText(ctx, portal.title, maxW)
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width))
    if (lines.length <= 3 && widest <= maxW) break
  }
  const lineH = size
  const titleTop = 64
  const titleBottom = titleTop + lines.length * lineH
  const ruleY = titleBottom + 10
  const subTop = ruleY + 12
  const headerBottom = subTop + 24
  return { size, lines, lineH, titleTop, titleBottom, ruleY, subTop, headerBottom }
}

// WELCOME entry portal: same header system as the others (chartreuse plate,
// dark ink), plus ON/OFF (the CURRENT audio state is dulled) and a Begin
// control. Records hit rects (in 600×800 card pixels) for click routing.
function drawWelcomeCard(ctx, W, H, portal, lm) {
  ctx.textAlign = 'left'
  // Chartreuse text on the intro blue.
  const ink = '#D8FF14', dull = 'rgba(216,255,20,0.30)', inkSub = 'rgba(216,255,20,0.62)', inkRule = 'rgba(216,255,20,0.38)'
  const t = titleLayout(ctx, portal, W - lm * 2)
  ctx.font = `700 ${t.size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '-0.01em'; ctx.textBaseline = 'top'; ctx.fillStyle = ink
  t.lines.forEach((ln, i) => ctx.fillText(ln, lm, t.titleTop + i * t.lineH))
  ctx.strokeStyle = inkRule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(lm, t.ruleY); ctx.lineTo(W - lm, t.ruleY); ctx.stroke()
  ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"; ctx.letterSpacing = '0.16em'
  ctx.textBaseline = 'top'; ctx.fillStyle = inkSub
  ctx.fillText(portal.sub, lm, t.subTop)

  // Intro line, wrapped, beneath the subtitle
  ctx.font = "300 16px 'Helvetica Neue', Helvetica, Arial, sans-serif"; ctx.letterSpacing = '0.02em'
  ctx.textBaseline = 'top'; ctx.fillStyle = inkSub
  let iy = t.subTop + 34
  wrapText(ctx, 'this is a slow web experience — the sound will follow you', W - lm * 2)
    .forEach((ln) => { ctx.fillText(ln, lm, iy); iy += 24 })

  // ON / OFF — the selected state is the lit (ink) one, the other is dulled
  // (audio on → ON lit), so the highlight matches what you actually hear.
  ctx.textBaseline = 'alphabetic'
  ctx.font = "700 34px 'Helvetica Neue', Helvetica, Arial, sans-serif"; ctx.letterSpacing = '0.03em'
  const rowY = 384
  ctx.fillStyle = welcomeAudioOn ? ink : dull
  ctx.fillText('ON', lm, rowY)
  const onW = ctx.measureText('ON').width
  const offX = lm + onW + 34
  ctx.fillStyle = welcomeAudioOn ? dull : ink
  ctx.fillText('OFF', offX, rowY)
  const offW = ctx.measureText('OFF').width

  // Begin
  ctx.font = "700 40px 'Helvetica Neue', Helvetica, Arial, sans-serif"; ctx.letterSpacing = '0'
  const beginY = 724
  ctx.fillStyle = ink
  ctx.fillText('Begin  →', lm, beginY)
  const beginW = ctx.measureText('Begin  →').width

  welcomeRegions = {
    on:    { x: lm - 14, y: rowY - 40, w: onW + 28, h: 56 },
    off:   { x: offX - 14, y: rowY - 40, w: offW + 28, h: 56 },
    begin: { x: lm - 14, y: beginY - 46, w: beginW + 28, h: 64 },
  }
}

function drawPortalCard(ctx, portal, W, H, lm, drawTrace) {
  ctx.clearRect(0, 0, W, H)
  ctx.fillStyle = portal.bg; ctx.fillRect(0, 0, W, H)
  if (drawTrace) drawTrace(ctx, W, H)

  // WELCOME entry portal — bespoke layout with ON/OFF + Begin controls.
  if (portal.welcome) { drawWelcomeCard(ctx, W, H, portal, lm); return }

  let ink     = portal.light ? 'rgba(255,255,255,0.92)' : 'rgba(0,0,0,0.88)'
  let inkSub  = portal.light ? 'rgba(255,255,255,0.52)' : 'rgba(0,0,0,0.50)'
  let inkRule = portal.light ? 'rgba(255,255,255,0.30)' : 'rgba(0,0,0,0.22)'

  const maxW = W - lm * 2
  ctx.textAlign = 'left'
  const t = titleLayout(ctx, portal, maxW)

  // Detroit/Postcards/Moving Images: when the image behind the title is dark,
  // switch the header to the source photo's lightest tone so it pops; keep the
  // dark ink when the backdrop is light. Re-evaluated every redraw (so it flips
  // between the faded and full-colour held looks), with hysteresis to stop the
  // animated Moving Images card flickering near the threshold.
  if (portal === PORTALS[DETROIT_INDEX] || portal === PORTALS[POSTCARDS_INDEX] || portal === PORTALS[MOVING_IMAGES_INDEX]) {
    // Deciding the title colour needs a getImageData pixel read-back. For the
    // static Detroit/Postcards cards (redrawn rarely) that's fine every redraw.
    // But the Moving Images card redraws ~60x/sec, and re-sampling it a few times
    // a second allocated a fresh ~300KB ImageData each time — ~2.5MB/s of garbage
    // that filled the heap and triggered a main-thread GC pause ~10-15s in (the
    // "runs great then studders" onset). Its water backdrop keeps a near-constant
    // brightness in the title band, so sample it ONCE and reuse the result.
    const animated = portal === PORTALS[MOVING_IMAGES_INDEX]
    const now = performance.now()
    // Sample the animated card's brightness once — but only after its water tile
    // is actually drawn, so the title colour latches onto real content, not the
    // bare background. Non-animated cards re-check every (rare) redraw as before.
    const due = animated ? (!!swimGrayTile && !_titleLight.has(portal)) : true
    if (due) {
      _titleSampled.set(portal, now)
      const bandH = Math.max(20, Math.min(H - t.titleTop - 2, t.titleBottom - t.titleTop))
      const backLuma = regionLuma(ctx, lm, t.titleTop, maxW, bandH)
      let light = _titleLight.get(portal) ?? (backLuma < 135)
      if (backLuma < 120) light = true
      else if (backLuma > 155) light = false
      _titleLight.set(portal, light)
    }
    if (_titleLight.get(portal)) {
      const c = sourceLightest(portal) || { r: 245, g: 245, b: 245 }
      ink     = `rgba(${c.r},${c.g},${c.b},0.96)`
      inkSub  = `rgba(${c.r},${c.g},${c.b},0.60)`
      inkRule = `rgba(${c.r},${c.g},${c.b},0.40)`
    }
  }

  // Fixed heading colour (e.g. ARCHIVE's chartreuse), overriding the defaults.
  if (portal.titleColor) {
    ink     = portal.titleColor + 'F2'
    inkSub  = portal.titleColor + '99'
    inkRule = portal.titleColor + '55'
  }

  ctx.font = `700 ${t.size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '-0.01em'
  ctx.textBaseline = 'top'
  ctx.fillStyle = ink
  t.lines.forEach((ln, i) => ctx.fillText(ln, lm, t.titleTop + i * t.lineH))

  ctx.strokeStyle = inkRule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(lm, t.ruleY); ctx.lineTo(W - lm, t.ruleY); ctx.stroke()

  ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ctx.letterSpacing = '0.16em'
  ctx.textBaseline = 'top'
  ctx.fillStyle = inkSub
  ctx.fillText(portal.sub, lm, t.subTop)
}

// Draw an image cover-fit (fill the whole 600×800 card, cropping overflow).
function drawImageCover(ctx, img, W, H) {
  ctx.clearRect(0, 0, W, H)
  if (!img || !img.naturalWidth) { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H); return }
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight)
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh)
}

// Draw the video frame to fill the card proportionally (cover-fit: keep aspect,
// scale up to cover the whole card, crop the overflow), centred both axes, with
// a dark gradient behind the header so the title stays legible. Used as the
// drawTrace for the Karla video card; the title is drawn on top in the shared
// alextaves font.
function drawVideoTrace(ctx, portal, W, H) {
  const video = portal._video
  const vw = video.videoWidth, vh = video.videoHeight
  if (vw && vh) {
    const s = Math.max(W / vw, H / vh)   // cover: fill the card, crop overflow
    const dw = vw * s, dh = vh * s
    ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh)   // centred both axes
  }
  // Top gradient keeps the title legible.
  const gTop = ctx.createLinearGradient(0, 0, 0, H * 0.5)
  gTop.addColorStop(0, 'rgba(0,0,0,0.55)'); gTop.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = gTop; ctx.fillRect(0, 0, W, H * 0.5)

  // Bottom caption ("visuals by oswin") at the foot of the card, at 2x the
  // normal sub size, over its own gradient for legibility.
  if (portal.bottomCaption) {
    const gBot = ctx.createLinearGradient(0, H * 0.72, 0, H)
    gBot.addColorStop(0, 'rgba(0,0,0,0)'); gBot.addColorStop(1, 'rgba(0,0,0,0.55)')
    ctx.fillStyle = gBot; ctx.fillRect(0, H * 0.72, W, H * 0.28)

    ctx.save()
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
    ctx.font = "300 28px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = portal.titleColor || 'rgba(255,255,255,0.9)'
    ctx.fillText(portal.bottomCaption, 54, H - 48)
    ctx.restore()
  }
}

// Body-text card (Oswin Journal): a passage laid out below the title, in the
// shared font, auto-sized as large as will fit the card so it stays readable.
function drawBodyText(ctx, W, H, portal) {
  const lm = 54
  const maxW = W - lm * 2
  const t = titleLayout(ctx, portal, maxW)
  const startY = t.headerBottom + 12
  const availH = H - startY - 44
  const paras = portal.body
  const ink = portal.light ? 'rgba(255,255,255,0.86)' : 'rgba(0,0,0,0.82)'

  // Shrink the body from a comfortable max until the whole passage fits.
  let size = 24, lineH = 0, layout = []
  for (; size >= 9; size--) {
    ctx.font = `400 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '0'
    lineH = Math.round(size * 1.5)
    const gap = Math.round(size * 0.9)
    layout = paras.map((p) => wrapText(ctx, p, maxW))
    const total = layout.reduce((n, lines) => n + lines.length * lineH, 0) + gap * (paras.length - 1)
    if (total <= availH) break
  }
  const gap = Math.round(size * 0.9)
  ctx.font = `400 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '0'
  ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top'
  let y = startY
  layout.forEach((lines) => {
    lines.forEach((ln) => { ctx.fillText(ln, lm, y); y += lineH })
    y += gap
  })
}

// ── B&W TV static card ─────────────────────────────────────────────────────────
// Small noise buffer, regenerated each frame and scaled up over the card for a
// live-static look (cheaper than per-pixel noise at full card resolution).
const _noiseCanvas = document.createElement('canvas'); _noiseCanvas.width = 220; _noiseCanvas.height = 293
const _noiseCtx = _noiseCanvas.getContext('2d')
function regenNoise() {
  const id = _noiseCtx.createImageData(_noiseCanvas.width, _noiseCanvas.height)
  const d = id.data
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255
  }
  _noiseCtx.putImageData(id, 0, 0)
}

// Base of the B&W TV card: the grayscale photo (baked once into portal._bw),
// a legibility gradient, and the bottom caption. NO static here — the static is
// applied last (applyTvStatic), AFTER the title, so the type sits inside the
// same signal as the picture.
function drawTvBase(ctx, portal, W, H) {
  const img = portal._img
  if (img && img.naturalWidth) {
    if (!portal._bw) {
      const bc = document.createElement('canvas'); bc.width = W; bc.height = H
      const bx = bc.getContext('2d')
      bx.filter = 'grayscale(1) contrast(1.2) brightness(0.95)'
      const s = Math.max(W / img.naturalWidth, H / img.naturalHeight)
      const dw = img.naturalWidth * s, dh = img.naturalHeight * s
      bx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh)
      portal._bw = bc
    }
    ctx.drawImage(portal._bw, 0, 0)
  } else {
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H)
  }

  const gTop = ctx.createLinearGradient(0, 0, 0, H * 0.5)
  gTop.addColorStop(0, 'rgba(0,0,0,0.6)'); gTop.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = gTop; ctx.fillRect(0, 0, W, H * 0.5)

  if (portal.bottomCaption) {
    const gBot = ctx.createLinearGradient(0, H * 0.72, 0, H)
    gBot.addColorStop(0, 'rgba(0,0,0,0)'); gBot.addColorStop(1, 'rgba(0,0,0,0.6)')
    ctx.fillStyle = gBot; ctx.fillRect(0, H * 0.72, W, H * 0.28)
    ctx.save()
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
    ctx.font = "300 28px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = portal.titleColor || 'rgba(255,255,255,0.9)'
    ctx.fillText(portal.bottomCaption, 54, H - 48)
    ctx.restore()
  }
}

// Animated static + scanlines applied over the WHOLE card (picture AND type),
// drawn last so the text degrades in the same signal — that's what makes it
// feel like a real broadcast.
// A/B switches while we work out whether the card static fights the screen-space
// grain the post pass adds. ?grain=0 drops the noise, ?scan=0 drops the
// scanlines. Both default ON, i.e. unchanged.
const _q = new URLSearchParams(location.search)
const CARD_GRAIN = _q.get('grain') !== '0'
const CARD_SCANLINES = _q.get('scan') !== '0'

function applyTvStatic(ctx, W, H) {
  if (CARD_GRAIN) {
    ctx.save()
    ctx.imageSmoothingEnabled = false
    ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = 0.11
    ctx.drawImage(_noiseCanvas, 0, 0, W, H)
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.075
    ctx.drawImage(_noiseCanvas, 0, 0, W, H)
    ctx.restore()
  }

  if (CARD_SCANLINES) {
    ctx.save()
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#000'
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1)
    ctx.restore()
  }
}
regenNoise()   // seed one noise frame so build-time static has something to draw

// The static-free face for any card: image cover, video frame, body text, TV
// base (B&W photo), or a plain portal card. Every card type routes through here
// so the same static can be applied on top uniformly.
function drawCardBase(ctx, portal, W, H, drawTrace) {
  const lm = 54
  if (portal.tv) drawPortalCard(ctx, portal, W, H, lm, (cx, w, h) => drawTvBase(cx, portal, w, h))
  else if (portal.slideshow) drawPortalCard(ctx, portal, W, H, lm, (cx, w, h) => drawSlideshow(cx, portal, w, h))
  else if (portal._img) drawImageCover(ctx, portal._img, W, H)
  else if (portal._video) drawPortalCard(ctx, portal, W, H, lm, (cx, w, h) => drawVideoTrace(cx, portal, w, h))
  else if (portal.body) drawPortalCard(ctx, portal, W, H, lm, (cx, w, h) => drawBodyText(cx, w, h, portal))
  else drawPortalCard(ctx, portal, W, H, lm, drawTrace)
}

// Cover-fit an image without clearing (so slideshow layers can composite).
function coverDraw(ctx, img, W, H) {
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight)
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh)
}

// Crossfade slideshow: hold each image, then smoothly (eased) fade to the next,
// looping forever — "stacked images, one on, the others off."
const SLIDE_HOLD = 2400, SLIDE_FADE = 1800
function drawSlideshow(ctx, portal, W, H) {
  const imgs = portal._slides || []
  const n = imgs.length
  ctx.clearRect(0, 0, W, H)
  if (!n) return
  const PER = SLIDE_HOLD + SLIDE_FADE
  const t = performance.now() % (PER * n)
  const idx = Math.floor(t / PER)
  const local = t - idx * PER
  const cur = imgs[idx], nxt = imgs[(idx + 1) % n]
  let a = local <= SLIDE_HOLD ? 0 : (local - SLIDE_HOLD) / SLIDE_FADE
  a = a * a * (3 - 2 * a)   // smoothstep — elegant ease in/out
  if (cur && cur.naturalWidth) coverDraw(ctx, cur, W, H)
  if (a > 0 && nxt && nxt.naturalWidth) { ctx.save(); ctx.globalAlpha = a; coverDraw(ctx, nxt, W, H); ctx.restore() }

  // Top gradient so the title (drawn on top by drawPortalCard) stays legible
  // over whichever colourway is showing.
  const gTop = ctx.createLinearGradient(0, 0, 0, H * 0.5)
  gTop.addColorStop(0, 'rgba(0,0,0,0.55)'); gTop.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = gTop; ctx.fillRect(0, 0, W, H * 0.5)

  if (portal.bottomCaption) {
    const gBot = ctx.createLinearGradient(0, H * 0.72, 0, H)
    gBot.addColorStop(0, 'rgba(0,0,0,0)'); gBot.addColorStop(1, 'rgba(0,0,0,0.55)')
    ctx.fillStyle = gBot; ctx.fillRect(0, H * 0.72, W, H * 0.28)
    ctx.save()
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
    ctx.font = "300 28px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = portal.titleColor || 'rgba(255,255,255,0.9)'
    ctx.fillText(portal.bottomCaption, 54, H - 48)
    ctx.restore()
  }
}

function makePortalTex(portal, drawTrace) {
  const W = 600, H = 800
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  drawCardBase(ctx, portal, W, H, drawTrace)
  applyTvStatic(ctx, W, H)   // every card wears the same TV static
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; return tex
}

// Numbered badge: a raised square tile (side = 1/8 the card height, same depth
// as the card) stuck onto the card's right side, carrying a Helvetica-bold
// numeral. Parented to the card so it orbits and tilts with it.
//
// The face is a canvas texture that runs a synced slideshow: every 3s it slides
// to the right and swaps to the next colourway — white → inverted → poppy red →
// yellow → back to white. All badges share one clock so they change together.
const BADGE_STYLES = [
  { bg: '#FFFFFF', fg: '#111111' },  // white, black type
  { bg: '#111111', fg: '#FFFFFF' },  // inverted: black, white type
  { bg: '#FF2E1F', fg: '#FFFFFF' },  // poppy red, white type
  { bg: '#FFD400', fg: '#111111' },  // yellow, black type
]
const BADGE_S = 256
const BADGE_TRANS_MS = 550   // slide duration
const BADGE_HOLD_MS = 3000   // time each style is held before it slides again
const registeredBadges = []  // { canvas, ctx, tex, num }
let badgeStyleIdx = 0

// Draw one tile (bg + centred numeral) into ctx at horizontal offset x.
function drawBadgeTile(ctx, x, num, style, S) {
  ctx.fillStyle = style.bg
  ctx.fillRect(x, 0, S, S)
  ctx.fillStyle = style.fg
  ctx.font = `700 ${Math.round(S * 0.6)}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText(String(num), x + S / 2, S / 2 + S * 0.04)
}

// Render every badge at transition progress p (0→1). Outgoing style slides off
// to the right; the incoming style follows in from the left.
function paintBadges(fromIdx, toIdx, p) {
  registeredBadges.forEach((b) => {
    const S = b.canvas.width
    b.ctx.clearRect(0, 0, S, S)
    if (p >= 1 || fromIdx === toIdx) {
      drawBadgeTile(b.ctx, 0, b.num, BADGE_STYLES[toIdx], S)
    } else {
      const dx = p * S
      drawBadgeTile(b.ctx, dx, b.num, BADGE_STYLES[fromIdx], S)      // outgoing → right
      drawBadgeTile(b.ctx, dx - S, b.num, BADGE_STYLES[toIdx], S)    // incoming ← left
    }
    b.tex.needsUpdate = true
  })
}

function startBadgeSlideshow() {
  setInterval(() => {
    const from = badgeStyleIdx
    const to = (badgeStyleIdx + 1) % BADGE_STYLES.length
    const t0 = performance.now()
    const step = (now) => {
      const p = Math.min(1, (now - t0) / BADGE_TRANS_MS)
      paintBadges(from, to, p)
      if (p < 1) requestAnimationFrame(step)
      else badgeStyleIdx = to
    }
    requestAnimationFrame(step)
  }, BADGE_HOLD_MS)
}

function makeBadgeMesh(num) {
  const bs = panelH / 8               // side length: 1/8 the card height
  const canvas = document.createElement('canvas'); canvas.width = BADGE_S; canvas.height = BADGE_S
  const ctx = canvas.getContext('2d')
  drawBadgeTile(ctx, 0, num, BADGE_STYLES[0], BADGE_S)   // start on the white style
  const tex = new THREE.CanvasTexture(canvas); tex.encoding = THREE.sRGBEncoding
  registeredBadges.push({ canvas, ctx, tex, num })

  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.0, envMapIntensity: 0.15 })
  const faceM = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5, metalness: 0.0, envMapIntensity: 0.15 })
  // BoxGeometry material order: [+x, -x, +y, -y, +z(front), -z]. Number on +z.
  const badge = new THREE.Mesh(new THREE.BoxGeometry(bs, bs, THICK), [white, white, white, white, faceM, white])
  // Stuck onto the right side: a slab tab extending off the card's right edge,
  // top-flush, sharing the card's thickness (coplanar), number facing front.
  badge.position.set(panelW / 2 + bs / 2, panelH / 2 - bs / 2, 0)
  badge.frustumCulled = false
  return badge
}

function makeFlippedTex(canvas) {
  const c = document.createElement('canvas')
  c.width = canvas.width; c.height = canvas.height
  const ctx = c.getContext('2d')
  ctx.translate(c.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(canvas, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Build ring (horizontal, XZ plane) ─────────────────────────────────────────
const orbitQuat = new THREE.Quaternion()
const orbitEuler = new THREE.Euler()
const orbitPos   = new THREE.Vector3()

// MOVING IMAGES gets a faint duotone trace of the swimmer marquee — the
// seamless leaping figure (water2_seamless.webp) height-fit to the card and
// tiled across, scrolling right-to-left like the full-screen marquee, under
// the same Klein-blue duotone the diver footage used to wear.
const swimImg = new Image()
swimImg.src = '/water2_seamless.webp'

// Pre-bake the grayscale+contrast version of the swim tile ONCE. drawSwimTrace
// tiles this across the card every frame; doing the `grayscale(1) contrast(1.1)`
// canvas filter per tile per frame (the old path) was the single most expensive
// thing in the render loop and is what stuttered the ring while spinning.
let swimGrayTile = null
function buildSwimGray() {
  if (!swimImg.naturalWidth) return
  const c = document.createElement('canvas')
  c.width = swimImg.naturalWidth; c.height = swimImg.naturalHeight
  const cx = c.getContext('2d')
  cx.filter = 'grayscale(1) contrast(1.1)'
  cx.drawImage(swimImg, 0, 0)
  swimGrayTile = c
}
if (swimImg.complete) buildSwimGray()
else swimImg.addEventListener('load', buildSwimGray)

// ARCHIVE panel plays the showreel that showcases the previous alextaves.com,

archiveVideo.src = '/videos/showreel2_3.mp4'

// Route a click on the (frozen, front-centre) WELCOME card to ON / OFF / Begin.

  const wh = hits.find(h => h.object.userData.panelIdx === WELCOME_INDEX)
  if (!wh || !wh.uv || !welcomeRegions) return
  const cx = wh.uv.x * 600, cy = (1 - wh.uv.y) * 800   // uv → card pixels (flipY)

  if (inR(welcomeRegions.begin)) beginSite()
  else if (inR(welcomeRegions.on)) setWelcomeAudio(true)
  else if (inR(welcomeRegions.off)) setWelcomeAudio(false)
}

const JOURNAL_CHAR_MS = 32.5 // 2x IntroOverlay's typewriter cadence
const JOURNAL_HOLD_MS = 3000
let unfilteredFaceTex = null, unfilteredFaceCtx = null
let journalQuoteIdx = 0, journalCharCount = 0, journalPhase = 'typing'

function wrapText(ctx, text, maxW) {
  const words = text.split(' ')
  const lines = []
  let line = ''
  for (const w of words) {
    const test = line ? line + ' ' + w : w
    if (line && ctx.measureText(test).width > maxW) {
      lines.push(line)
      line = w
    } else {
      line = test
    }
  }
  if (line) lines.push(line)
  return lines
}

function drawJournalQuote(ctx, W, H, portal) {
  const lm = 54
  const startY = Math.max(234, titleLayout(ctx, portal, W - lm * 2).headerBottom)
  const quote = JOURNAL_QUOTES[journalQuoteIdx]
  const done = journalCharCount >= quote.text.length
  const shown = done ? quote.text : quote.text.slice(0, journalCharCount)
  const inkQuote = portal.light ? 'rgba(255,255,255,0.72)' : 'rgba(0,0,0,0.68)'
  const inkDate  = portal.light ? 'rgba(255,255,255,0.40)' : 'rgba(0,0,0,0.38)'

  ctx.textAlign = 'left'
  ctx.font = "300 15px 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ctx.letterSpacing = '0.01em'
  ctx.fillStyle = inkQuote
  const display = done ? `"${shown}"` : `"${shown}`
  const lines = wrapText(ctx, display, W - lm * 2)
  const lineHeight = 24
  let y = startY
  lines.forEach((ln) => { ctx.fillText(ln, lm, y); y += lineHeight })

  if (done) {
    ctx.font = "300 12px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = inkDate
    ctx.fillText(quote.date, lm, y + 8)
  }
}

setInterval(() => {
  if (journalPhase !== 'typing') return
  const quote = JOURNAL_QUOTES[journalQuoteIdx]
  journalCharCount = Math.min(quote.text.length, journalCharCount + 1)
  if (unfilteredFaceTex) {
    drawPortalCard(unfilteredFaceCtx, PORTALS[UNFILTERED_INDEX], 600, 800, 54,
      (ctx, W, H) => drawJournalQuote(ctx, W, H, PORTALS[UNFILTERED_INDEX]))
    unfilteredFaceTex.needsUpdate = true
  }
  if (journalCharCount >= quote.text.length) {
    journalPhase = 'holding'
    setTimeout(() => {
      journalQuoteIdx = (journalQuoteIdx + 1) % JOURNAL_QUOTES.length
      journalCharCount = 0
      journalPhase = 'typing'
    }, JOURNAL_HOLD_MS)
  }
}, JOURNAL_CHAR_MS)

setInterval(() => {

const panels = [], homePositions = []
const faceMats = [], glassMats = [], backMats = [], sideMats = []
const faceTexes = []
const animatedFaceTexes = []   // { idx, portal, faceTex, ctx, kind } for video/tv cards

for (let i = 0; i < COUNT; i++) {
  const a = (i / COUNT) * Math.PI * 2
  homePositions.push(isMobile
    ? new THREE.Vector3(0, Math.sin(a) * MOB_RADIUS, Math.cos(a) * MOB_RADIUS)
    : new THREE.Vector3(Math.cos(a) * RADIUS, 0, Math.sin(a) * RADIUS))

  const portal = PORTALS[i]
  const drawTrace = i === MOVING_IMAGES_INDEX
    ? (ctx, W, H) => drawSwimTrace(ctx, W, H, portal.bg, 1.0)
    : i === ARCHIVE_INDEX
    ? (ctx, W, H) => drawArchiveVideo(ctx, W, H)
    : i === DETROIT_INDEX
    ? (ctx, W, H) => drawDuotoneTrace(ctx, detroitTraceImg, W, H, portal.bg, 0.5, TRACE_GRAYSCALE)
    : i === POSTCARDS_INDEX
    ? (ctx, W, H) => drawDuotoneTrace(ctx, postcardsTraceImg, W, H, portal.bg, 0.5, TRACE_GRAYSCALE)
    : i === OSWIN_INDEX
    ? (ctx, W, H) => drawOswinCircle(ctx, W, H, PORTALS[OSWIN_INDEX])
    : i === ENQUIRIES_INDEX
    ? (ctx, W, H) => drawEnquiryFormPreview(ctx, W, H, portal)
    : i === UNFILTERED_INDEX
    ? (ctx, W, H) => drawJournalQuote(ctx, W, H, portal)
    : i === ALEX_TAVES_INDEX
    ? (ctx, W, H) => drawAlexTavesBio(ctx, W, H, portal)
    : null
  const faceTex  = makePortalTex(portal, drawTrace)
  faceTexes.push(faceTex)
  // Static-free base for this card, reused every frame under the animated static.
  const baseCanvas = document.createElement('canvas'); baseCanvas.width = 600; baseCanvas.height = 800
  const baseCtx = baseCanvas.getContext('2d')
  drawCardBase(baseCtx, portal, 600, 800, drawTrace)
  if (i === MOVING_IMAGES_INDEX) {
    movingImagesFaceTex = faceTex
    movingImagesFaceCtx = faceTex.image.getContext('2d')
    swimImg.onload = () => {
      drawPortalCard(faceTex.image.getContext('2d'), portal, 600, 800, 54, drawTrace)
      faceTex.needsUpdate = true
    }
  }
  if (i === ARCHIVE_INDEX) {
    archiveFaceTex = faceTex
    archiveFaceCtx = faceTex.image.getContext('2d')
  }
  if (i === WELCOME_INDEX) {
    welcomeFaceTex = faceTex
    welcomeFaceCtx = faceTex.image.getContext('2d')
  }
  if (i === UNFILTERED_INDEX) {
    unfilteredFaceTex = faceTex
    unfilteredFaceCtx = faceTex.image.getContext('2d')
  }
  if (i === ENQUIRIES_INDEX) {
    enquiryFaceTex = faceTex
    enquiryFaceCtx = faceTex.image.getContext('2d')
  }
  // Once the trace image is decoded, cache BOTH looks (faint + full-colour held)
  // up front and leave the resting faint look showing. This moves the expensive
  // render off the interaction path so the first drag across the card doesn't
  // hitch — later crossings just blit the cached pixels (see redrawTraceCard).
  if (i === DETROIT_INDEX) {
    detroitTraceImg.onload = () => {
      redrawTraceCard(DETROIT_INDEX, TRACE_GRAYSCALE_HELD, 1.0)

  if (i === POSTCARDS_INDEX) {
    postcardsTraceImg.onload = () => {

    }
  }
  const backTex  = makeFlippedTex(faceTex.image)
  const panelCol = new THREE.Color(PORTALS[i].bg)

  // Card images decode after this synchronous build. Once ready, refresh the
  // base with the loaded image, then the face (base + static) and the mirrored
  // back plate (clean base). Covers image AND TV cards.
  if (portal._img) {
    const applyImg = () => {
      portal._bw = null   // force the TV card to re-bake its B&W photo
      drawCardBase(baseCtx, portal, 600, 800, drawTrace)
      const fctx = faceTex.image.getContext('2d')
      fctx.clearRect(0, 0, 600, 800)
      fctx.drawImage(baseCanvas, 0, 0)
      applyTvStatic(fctx, 600, 800)
      faceTex.needsUpdate = true
      const bctx = backTex.image.getContext('2d')
      bctx.setTransform(1, 0, 0, 1, 0, 0)
      bctx.clearRect(0, 0, backTex.image.width, backTex.image.height)

      backTex.needsUpdate = true
    }
    if (portal._img.complete && portal._img.naturalWidth) applyImg()
    else portal._img.addEventListener('load', applyImg, { once: true })
  }

  const faceMat = new THREE.MeshPhysicalMaterial({
    map: faceTex, transparent: true, opacity: FRONT_OPACITY, side: THREE.FrontSide,
    roughness: 0.55, metalness: 0.0, envMapIntensity: 0.12,
    color: new THREE.Color(0xffffff), alphaMap: roundedAlphaMap,
  })
  const glassMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: BACK_OPACITY,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const backMat = new THREE.MeshPhysicalMaterial({
    map: backTex, transparent: true, opacity: 0.72,
    roughness: 0.6, metalness: 0.0, color: new THREE.Color(0xffffff), alphaMap: roundedAlphaMap,
  })
  const sideMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: 0.65,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const reflMat = new THREE.MeshBasicMaterial({
    map: makePortalReflTex(PORTALS[i].bg), transparent: true, opacity: isMobile ? 0.42 : 0.38,
  })

  const mesh = new THREE.Mesh(panelGeo, [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
  mesh.frustumCulled = false
  mesh.userData = { panelIdx: i }

  const reflMesh = new THREE.Mesh(reflGeo, reflMat)
  reflMesh.position.set(0, -(panelH + reflH) / 2, THICK / 2 + 0.002)
  reflMesh.frustumCulled = false
  mesh.add(reflMesh)

  // Numbered white badge on selected cards (Karla 1, Christopher 2, Arnold 3).
  if (portal.badge) mesh.add(makeBadgeMesh(portal.badge))

  // Every card redraws each frame so they all wear the same live static. Only
  // video cards need their base re-rendered per frame (live footage); the rest
  // reuse their cached base and just get a fresh static pass over it.
  animatedFaceTexes.push({ idx: i, portal, faceTex, ctx: faceTex.image.getContext('2d'), baseCanvas, baseCtx, drawTrace, live: !!portal._video || !!portal.slideshow || i === ENQUIRIES_INDEX })

  scene.add(mesh)
  panels.push(mesh)
  faceMats.push(faceMat); glassMats.push(glassMat)
  backMats.push(backMat); sideMats.push(sideMat)
}

// Press-and-hold reveal: Detroit and Postcards redraw their own card texture
// with the trace swapped between its resting look (75% grayscale, 0.5 alpha —
// faint) and a full-colour, full-opacity look (0% grayscale, 1.0 alpha) while
// the card is actively held.
// Each trace panel has only two looks (faint resting / full-colour held). Both
// are expensive to render (getImageData luma read + a grayscale canvas filter on
// a large image), and setHeldTrace can ask for them every time a drag crosses the
// card — which is what stuttered the DETROIT/POSTCARDS cluster. So render each
// look ONCE, cache the pixels, and thereafter just blit the cached face.
const _traceFaceCache = new Map()   // key `${idx}:${held}` -> ImageData
function redrawTraceCard(idx, grayscaleAmt, alpha) {
  const held = grayscaleAmt === TRACE_GRAYSCALE_HELD
  const key = idx + ':' + held
  const faceTex = faceTexes[idx]
  const ctx = faceTex.image.getContext('2d')
  const cached = _traceFaceCache.get(key)
  if (cached) {
    ctx.putImageData(cached, 0, 0)
  } else {
    const portal = PORTALS[idx]
    const traceImg = idx === DETROIT_INDEX ? detroitTraceImg : postcardsTraceImg
    // If the source image isn't decoded yet, draw live (don't cache an empty face).
    const drawTrace = (c, W, H) => drawDuotoneTrace(c, traceImg, W, H, portal.bg, alpha, grayscaleAmt)
    drawPortalCard(ctx, portal, 600, 800, 54, drawTrace)
    if (traceImg.complete && (traceImg.naturalWidth || traceImg.videoWidth)) {
      _traceFaceCache.set(key, ctx.getImageData(0, 0, faceTex.image.width, faceTex.image.height))
    }
  }
  faceTex.needsUpdate = true
}
// The panel currently pressed and held. Any held panel renders fully opaque
// (see the loop below); Detroit/Postcards additionally recolour their trace to
// full colour + full opacity. Everything reverts on release.
let heldTraceIdx = null
const isTracePanel = (i) => i === DETROIT_INDEX || i === POSTCARDS_INDEX
function setHeldTrace(idx) {
  if (heldTraceIdx === idx) return
  if (isTracePanel(heldTraceIdx)) redrawTraceCard(heldTraceIdx, TRACE_GRAYSCALE, 0.5)
  heldTraceIdx = idx
  if (isTracePanel(idx)) redrawTraceCard(idx, TRACE_GRAYSCALE_HELD, 1.0)
}
function clearHeldTrace() {
  if (heldTraceIdx === null) return
  if (isTracePanel(heldTraceIdx)) redrawTraceCard(heldTraceIdx, TRACE_GRAYSCALE, 0.5)
  heldTraceIdx = null
}

      { date: "JULY 2, 2026", text: "Pushed the grid through Eno and Hawtin. Make it generative, not looped, a seeded shuffle so every visitor gets a different configuration. Treat the ratio of interview tiles to images as a compositional variable, tested, not guessed. And the pressable thesis: the infinite scroll rebuilt with every platform mechanic removed." },
      { date: "JULY 8, 2026 — 4:44AM", text: "Everything is a portal. What is the difference between alextaves.com and oswinjournal.com, both are portals into themselves. The user moves seamlessly through each without feeling they left the other. The web becomes a place one moves through, no beginning and no end. Two domains, one application. The trip did not give me a new plan. It gave me the philosophy that makes the plan coherent." },
      { date: "JULY 8, 2026", text: "The global audio layer. Music chosen at arrival, persisting as you move between portals, fading out when you cross into a defined ecosystem like an issue. The whole idea of Oswin is collaboration with audio artists, so the corridor has sound and the screening rooms have their own. The fade is the architectural signature." },
      { date: "JULY 8, 2026", text: "The Jasper piece, argued and won. A brilliant artist lives in my house. A week of two-hour sessions, existing Three.js patterns, one track, one interactive piece. A gift he can show his friends and teachers, the smallest possible demo of the portal ecosystem, and an audience-building artifact all at once. Not drift. Resequencing, and the window is his enthusiasm, which does not wait." },
    ],
  },
  [ALEX_TAVES_INDEX]: {
    coverLines: ['ALEX', 'TAVES'],
    coverTypeOpts: { typeDur: 1600, backspaceDur: 1600, cycle: 6200 },
    bg: PORTALS[ALEX_TAVES_INDEX]?.bg,
    paragraphs: [
      "Alex Taves builds rooms on the internet, part of what he calls the Slow Web, and his gut says the web is only beginning. He started in fashion, twelve years as art director to Joseph Mimran, then got pulled into the art world and opened a gallery in Hamilton, Ontario. It took off, earned a nod from The New York Times, then crashed. The crash mattered: it opened a whole new world. Out of desperation he learned to code, and React, the framework Netflix runs on, became an obsession. It seemed wildly untapped as a medium for art.",
      "Canadian by birth, Melburnian by choice. His goal is to bridge art and the net. To Alex, platforms like Instagram already feel dated. It's time to evolve into the humans we could be: not desperate for likes, not dictated to by an algorithm.",
    ],
  },
}

const storyOverlay = document.getElementById('storyOverlay')
const storyText = document.getElementById('storyText')
const storyCoverTitle = document.getElementById('storyCoverTitle')
const storyBody = document.getElementById('storyBody')
const enquiryForm = document.getElementById('enquiryForm')
const enquiryFormEl = document.getElementById('enquiryFormEl')
const enquiryStatus = document.getElementById('enquiryStatus')

enquiryFormEl.addEventListener('click', (e) => e.stopPropagation())
enquiryFormEl.addEventListener('submit', (e) => {
  e.preventDefault()
  const name = enquiryFormEl.name.value.trim()
  const email = enquiryFormEl.email.value.trim()
  const message = enquiryFormEl.message.value.trim()
  const subject = `Enquiry from ${name || email}`
  const body = `${message}\n\n— ${name} (${email})`
  window.location.href = `mailto:alextaves@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`
  enquiryStatus.textContent = 'opening your email client…'
