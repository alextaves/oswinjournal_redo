function setStoryBg(hex) {
  storyOverlay.style.setProperty('--bg', hex)
  storyOverlay.style.setProperty('--bg-r', parseInt(hex.slice(1, 3), 16))
  storyOverlay.style.setProperty('--bg-g', parseInt(hex.slice(3, 5), 16))
  storyOverlay.style.setProperty('--bg-b', parseInt(hex.slice(5, 7), 16))
}

// Exact duplicate of makeTypedOverlay's type/backspace loop (same durations,
// same absolute-clock phase), but writing into DOM line divs instead of a
// canvas — this is the black echo of the portal card's own neon title.
function startCoverTitleLoop(lines, opts) {
  const TYPE_DUR = opts.typeDur, BACKSPACE_DUR = opts.backspaceDur, CYCLE = opts.cycle
  const totalLen = lines.reduce((n, l) => n + l.length, 0)
  const lineEls = Array.from(storyCoverTitle.children)
  let raf = null
  function frame(now) {
    const t = now % CYCLE
    let charCount
    if (t < TYPE_DUR) {
      charCount = Math.min(totalLen, Math.floor((t / TYPE_DUR) * (totalLen + 1)))
    } else if (t > CYCLE - BACKSPACE_DUR) {
      const bt = t - (CYCLE - BACKSPACE_DUR)
      charCount = totalLen - Math.min(totalLen, Math.floor((bt / BACKSPACE_DUR) * (totalLen + 1)))
    } else {
      charCount = totalLen
    }
    const cursorOn = Math.floor(now / 375) % 2 === 0
    let remaining = charCount
    let activeIdx = 0
    lines.forEach((line, i) => {
      const take = Math.max(0, Math.min(line.length, remaining))
      lineEls[i].textContent = line.slice(0, take)
      remaining -= take
      if (take > 0) activeIdx = i
    })
    lineEls.forEach((el, i) => el.classList.toggle('cursor-on', i === activeIdx && cursorOn))
    raf = requestAnimationFrame(frame)
  }
  raf = requestAnimationFrame(frame)
  return () => { if (raf) cancelAnimationFrame(raf) }
}

// Fast terminal-style readout: the paragraphs type in as one continuous
// stream, in reading order, at a fixed character rate — quick enough to
// feel like a data dump, slow enough that each line visibly builds.
const TYPE_CPS = 140
let typingRAF = null

function typeStory(idx) {
  const story = STORIES[idx]
  storyBody.innerHTML = ''
  // A paragraph entry is either a plain string, or a { date, text } object
  // whose date prefix renders bold (see .entry-date).
  const nodes = story.paragraphs.map((entry) => {
    const p = document.createElement('p')
    const dateEl = document.createElement('span')
    dateEl.className = 'entry-date'
    const bodyEl = document.createElement('span')
    p.appendChild(dateEl); p.appendChild(bodyEl)
    storyBody.appendChild(p)
    const datePart = typeof entry === 'string' ? '' : entry.date + ' — '
    const bodyPart = typeof entry === 'string' ? entry : entry.text
    return { el: p, dateEl, bodyEl, datePart, bodyPart, full: datePart + bodyPart }
  })

  const totalLen = nodes.reduce((n, node) => n + node.full.length, 0)
  const startTime = performance.now()
  // Normal stories type start-to-end; reverseReveal types the last entry
  // first and works backward, DOM position unchanged — so already-typed
  // text never moves, it just scrolls out of view as we work backward.
  const order = []
  for (let i = 0; i < nodes.length; i++) order.push(story.reverseReveal ? nodes.length - 1 - i : i)
  let activeIdx = -1

  function tick(now) {
    const charCount = Math.min(totalLen, Math.floor(((now - startTime) / 1000) * TYPE_CPS))
    let offset = 0
    let newActiveIdx = order[order.length - 1]
    let foundActive = false
    order.forEach((i) => {
      const node = nodes[i]
      const take = Math.max(0, Math.min(node.full.length, charCount - offset))
      const dateTake = Math.min(node.datePart.length, take)
      const bodyTake = Math.max(0, take - node.datePart.length)
      node.dateEl.textContent = node.datePart.slice(0, dateTake)
      node.bodyEl.textContent = node.bodyPart.slice(0, bodyTake)
      if (!foundActive && take < node.full.length) { newActiveIdx = i; foundActive = true }
      offset += node.full.length
    })
    if (newActiveIdx !== activeIdx) {
      nodes.forEach((node, i) => node.el.classList.toggle('typing', i === newActiveIdx))
      activeIdx = newActiveIdx
    }
    if (story.reverseReveal) {
      // Hug the bottom: the most-recently-completed entries stay in view at
      // the bottom while older ones silently fill in above, out of sight —
      // the only way to actually watch text being typed is to scroll up,
      // away from the bottom. Only re-pin when already at/near the bottom,
      // so a deliberate scroll-up to watch it type isn't fought every frame.
      const nearBottom = storyOverlay.scrollHeight - storyOverlay.scrollTop - storyOverlay.clientHeight < 48
      if (nearBottom) storyOverlay.scrollTop = storyOverlay.scrollHeight
    }
    // Forward (non-reverseReveal) stories intentionally don't auto-scroll —
    // the overlay opens at the top and stays there, so the reader can start
    // straight away instead of waiting for the typing animation to catch up.
    typingRAF = charCount < totalLen ? requestAnimationFrame(tick) : null
  }
  typingRAF = requestAnimationFrame(tick)
}

let storyOpen = false
let storyPanelIdx = null
const _storyCorner = new THREE.Vector3()

// Projects the clicked panel's own front-face corners to screen space so the
// overlay stays contained within that portal's on-screen shape.
function updateStoryRect() {
  if (storyPanelIdx === null) return
  const mesh = panels[storyPanelIdx]
  mesh.updateMatrixWorld(true)
  const hw = panelW / 2, hh = panelH / 2, z = THICK / 2
  const corners = [[-hw, -hh, z], [hw, -hh, z], [hw, hh, z], [-hw, hh, z]]
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  corners.forEach(([x, y, zz]) => {
    _storyCorner.set(x, y, zz).applyMatrix4(mesh.matrixWorld).project(camera)
    const sx = (_storyCorner.x * 0.5 + 0.5) * innerWidth
    const sy = (1 - (_storyCorner.y * 0.5 + 0.5)) * viewportH()
    minX = Math.min(minX, sx); maxX = Math.max(maxX, sx)
    minY = Math.min(minY, sy); maxY = Math.max(maxY, sy)
  })
  storyOverlay.style.left = minX + 'px'
  storyOverlay.style.top = minY + 'px'
  storyOverlay.style.width = (maxX - minX) + 'px'
  storyOverlay.style.height = (maxY - minY) + 'px'
}

let coverTitleStop = null
function openStory(idx) {
  if (storyOpen) return
  storyOpen = true
  storyPanelIdx = idx
  angVel = 0
  if (idx === ENQUIRIES_INDEX) {
    setStoryBg(PORTALS[ENQUIRIES_INDEX].bg)
    storyText.style.display = 'none'
    enquiryForm.style.display = 'block'
    enquiryFormEl.reset()
    enquiryStatus.textContent = ''
  } else {
    const story = STORIES[idx]
    setStoryBg(story.bg)
    storyText.style.display = ''
    enquiryForm.style.display = 'none'
    if (coverTitleStop) coverTitleStop()
    coverTitleStop = startCoverTitleLoop(story.coverLines, story.coverTypeOpts)
    typeStory(idx)
    if (!story.reverseReveal) storyOverlay.scrollTop = 0
  }
  updateStoryRect()
  storyOverlay.classList.add('active')
}
function closeStory() {
  storyOpen = false
  storyPanelIdx = null
  if (typingRAF) { cancelAnimationFrame(typingRAF); typingRAF = null }
  if (coverTitleStop) { coverTitleStop(); coverTitleStop = null }
  storyOverlay.classList.remove('active')
}
storyOverlay.addEventListener('click', closeStory)
window.addEventListener('keydown', (e) => { if (storyOpen && e.key === 'Escape') closeStory() })

// Panels that navigate away from the carousel entirely (as opposed to
// opening an in-place overlay) need a confirm step — the first click just
// focuses/opacifies the panel, a second click on that same still-focused
// panel is what actually triggers the reroute. Stops a stray click while
// spinning the ring from yanking you out of it.
let pendingConfirmIdx = null

// A click is meant to act on the panel the user is looking at — the one rotated
// to the front of the ring. Picking the nearest raycast hit instead grabs
// whichever large, semi-transparent neighbour happens to intercept the ray
// first (adjacent cards like Detroit/Postcards overlap heavily off-centre), so
// clicks landed on the wrong panel. Selecting the front-most panel by depth is
// deterministic and matches what's visually centred.
function frontPanelIdx() {
  let best = -1, bestZ = -Infinity
  for (let i = 0; i < COUNT; i++) {
    const z = panels[i].position.z
    if (z > bestZ) { bestZ = z; best = i }
  }
  return best
}

// Fullscreen iframe overlay — cards with an `iframe` URL open it on click, with
// a ✕ (and Escape) to return to the ring.
function openCardIframe(url) {
  if (document.getElementById('cardIframeOverlay')) return
  const overlay = document.createElement('div')
  overlay.id = 'cardIframeOverlay'
  overlay.style.cssText = 'position:fixed; inset:0; z-index:2000; background:#000;'
  const frame = document.createElement('iframe')
  frame.src = url
  frame.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; border:0;'
  frame.setAttribute('allow', 'autoplay; fullscreen; microphone; camera; gyroscope; accelerometer; xr-spatial-tracking')
  // Embedded three.js pages (issue2_stack) measure innerWidth/Height once at load —
  // which happens before the frame reaches full size, so they come up zoomed and
  // off-centre. Nudge them to re-measure. try/catch: cross-origin frames (Oli's
  // ethernity.space) throw on contentWindow access.
  frame.onload = () => { try { frame.contentWindow.dispatchEvent(new Event('resize')) } catch {} }
  overlay.appendChild(frame)
  // No ✕ in the top right — it sat on top of the issue pages' own fullscreen
  // control. A BACK label fades in at the top left on movement or touch and
  // fades away again, the same idle-reveal the issue pages use for their own
  // controls.
  const back = document.createElement('button')
  back.textContent = '← BACK'
  back.setAttribute('aria-label', 'Back to the carousel')
  // mix-blend-mode:difference rather than a fixed colour or a dark pill: the
  // issue pages behind this range from Arnold's bright yellow to Karla's near
  // black, and plain white would vanish into the first. Difference inverts
  // against whatever it sits on, so the label stays legible without putting a
  // chip of chrome back over the page.
  // Typeset to match the site's other controls (the live pages' "enter" link):
  // Helvetica Neue 13px/400 at 0.05em. Spelled out rather than left to inherit,
  // because a button does not take the body font on its own.
  back.style.cssText = "position:fixed; top:22px; left:26px; z-index:2001; padding:6px 4px; border:none; background:none; color:#fff; mix-blend-mode:difference; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; font-weight:400; letter-spacing:0.05em; line-height:1; cursor:pointer; opacity:0; transition:opacity 0.55s ease;"
  back.onclick = closeCardIframe
  overlay.appendChild(back)

  // We cannot see pointer events over a cross-origin iframe, so our own issue
  // pages post their activity up to us (oswinActivity) and that drives the
  // reveal. A page that never reports — Oli's external site — gets a BACK that
  // simply stays put, because hiding it there would remove the only way out.
  let hideTimer = null
  let pageReportsActivity = false
  revealCardBack = (fromPage) => {
    if (fromPage) pageReportsActivity = true
    back.style.opacity = '0.9'
    back.style.pointerEvents = 'auto'
    clearTimeout(hideTimer)
    if (!pageReportsActivity) return
    hideTimer = setTimeout(() => {
      back.style.opacity = '0'
      back.style.pointerEvents = 'none'
    }, 2600)
  }
  overlay.addEventListener('pointermove', () => revealCardBack(true))
  document.body.appendChild(overlay)
  requestAnimationFrame(() => revealCardBack(false))   // present on arrival
  // Give the overlay its own history entry so the browser Back button returns to
  // the ring instead of leaving the carousel altogether.
  history.pushState({ cardIframe: true }, '')
  cardIframePushed = true
}
let cardIframePushed = false

function closeCardIframe() {
  const o = document.getElementById('cardIframeOverlay')
  if (!o) return
  o.remove()
  revealCardBack = null
  restoreLobby()
  // Closing via ✕ or Escape should also unwind the history entry we pushed, so
  // Back doesn't need two presses to leave the ring.
  if (cardIframePushed) { cardIframePushed = false; history.back() }
}

// Back button while a card is open: drop the overlay, stay on the carousel.
window.addEventListener('popstate', () => {
  const o = document.getElementById('cardIframeOverlay')
  if (o) { cardIframePushed = false; o.remove(); revealCardBack = null; restoreLobby() }
})
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCardIframe() })

function handlePanelClick(idx) {
  if (PORTALS[idx] && PORTALS[idx].iframe) { openCardIframe(PORTALS[idx].iframe); return }
  if (idx === UNFILTERED_INDEX || idx === ENQUIRIES_INDEX || idx === ALEX_TAVES_INDEX) { openStory(idx); return }
  if (idx === OSWIN_INDEX) { window.open('https://oswinjournal.com', '_blank'); return }
  if (pendingConfirmIdx !== idx) {
    pendingConfirmIdx = idx
    return
  }
  pendingConfirmIdx = null
  if (idx === ARCHIVE_INDEX) {
    (window.top || window).location.href = ARCHIVE_URL
    return
  }
  if (window !== window.top) {
    window.parent.postMessage({ type: 'portalClick', idx }, '*')
  }
}

// The ambient piano lives in the parent app (one continuous layer across
// every ring/page) — this just reports when the user is actively moving
// this ring, not the constant idle auto-rotation.
function notifyRingDrag(dragging) {
  if (window !== window.top) window.parent.postMessage({ type: 'ringDrag', dragging }, '*')
}

// ── Interaction ───────────────────────────────────────────────────────────────
const SENS = 0.005, FRICTION = 2.5, MAX_VEL = 6.0
const AUTO_SPEED = 0.0375, DRAG_THRESH = 6
const raycaster = new THREE.Raycaster()
const clickPointer = new THREE.Vector2()

// On first arrival start with WELCOME front & centre; otherwise a normal ring.
// Land with the Oli card (LANDING_INDEX) front-and-centre.
let angle = (LANDING_INDEX / COUNT) * Math.PI * 2 - Math.PI / 2, angVel = 0
// Which way the ring idles. Any deliberate spin faster than the idle speed
// re-aims it, and it KEEPS going that way until you send it back.
let autoDir = 1
let dragging = false, didDrag = false
let downX = 0, downY = 0, lastX = 0, lastMoveT = 0, trackedVel = 0
// Clicking a panel pauses the auto-rotation so it holds still for the confirm
// tap. The fully-opaque focus look is now driven by press-and-hold (heldTraceIdx),
// not by the click itself. Dragging clears the pause, same as before.
let paused = false

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (isMobile || storyOpen) return
  dragging = true; didDrag = false
  downX = lastX = e.clientX; downY = e.clientY
  lastMoveT = performance.now(); trackedVel = 0
  clickPointer.x = (downX / innerWidth) * 2 - 1
  clickPointer.y = -((downY / innerHeight) * 2 - 1)
  raycaster.setFromCamera(clickPointer, camera)
  const hits = raycaster.intersectObjects(panels, false)
  if (hits.length > 0) setHeldTrace(frontPanelIdx())
})
renderer.domElement.addEventListener('pointermove', (e) => {
  if (isMobile || !dragging || welcomeActive) return
  const now = performance.now()
  const dx  = e.clientX - lastX
  const dtm = Math.max((now - lastMoveT) / 1000, 0.001)
  lastX = e.clientX; lastMoveT = now
  if (Math.abs(e.clientX - downX) > DRAG_THRESH || Math.abs(e.clientY - downY) > DRAG_THRESH) {
    if (!didDrag) { paused = false; pendingConfirmIdx = null; notifyRingDrag(true) }
    didDrag = true
    angle += dx * SENS
    trackedVel = trackedVel * 0.6 + (dx / dtm) * 0.4
  }
})
renderer.domElement.addEventListener('pointerup', () => {
  clearHeldTrace()
  if (isMobile || !dragging) return
  if (didDrag) notifyRingDrag(false)
  dragging = false
  if (!didDrag) {
    clickPointer.x = (downX / innerWidth) * 2 - 1
    clickPointer.y = -((downY / innerHeight) * 2 - 1)
    raycaster.setFromCamera(clickPointer, camera)
    const hits = raycaster.intersectObjects(panels, false)
    // Entry state: the only live controls are ON / OFF / Begin on the WELCOME card.
    if (welcomeActive) { handleWelcomeClick(hits); return }
    if (hits.length > 0) { paused = true; handlePanelClick(frontPanelIdx()) }
  } else {
    const av = (performance.now() - lastMoveT > 120) ? 0 : trackedVel * SENS
    angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, av))
  }
})
renderer.domElement.addEventListener('pointerleave', clearHeldTrace)
renderer.domElement.addEventListener('pointercancel', clearHeldTrace)

// Mobile touch — vertical swipe (ring spins on the vertical axis on mobile)
let touchId = null, touchLastY = 0, touchLastT = 0, touchVel = 0
let mobHSwiping = false, touchStartX = 0, touchStartY = 0

renderer.domElement.addEventListener('touchstart', (e) => {
  if (!isMobile || storyOpen) return
  e.preventDefault()
  const t = e.touches[0]
  touchId = t.identifier
  touchStartX = t.clientX
  touchStartY = touchLastY = t.clientY
  touchLastT = performance.now()
  touchVel = 0; mobHSwiping = false
  dragging = true
  clickPointer.x = (t.clientX / innerWidth) * 2 - 1
  clickPointer.y = -((t.clientY / viewportH()) * 2 - 1)
  raycaster.setFromCamera(clickPointer, camera)
  const holdHits = raycaster.intersectObjects(panels, false)
  if (holdHits.length > 0) setHeldTrace(frontPanelIdx())
}, { passive: false })
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!isMobile || welcomeActive) return
  e.preventDefault()
  const t = Array.from(e.touches).find(x => x.identifier === touchId)
  if (!t) return
  const now = performance.now()
  const dy  = t.clientY - touchLastY
  const dtm = Math.max((now - touchLastT) / 1000, 0.016)
  if (!mobHSwiping && Math.abs(t.clientY - touchStartY) > 8) { mobHSwiping = true; paused = false; pendingConfirmIdx = null; notifyRingDrag(true) }
  if (mobHSwiping) {
    angle += dy * MOB_TOUCH_SENS
    touchVel = touchVel * 0.6 + (dy / dtm) * 0.4
  }
  touchLastY = t.clientY; touchLastT = now
}, { passive: false })
renderer.domElement.addEventListener('touchend', (e) => {
  clearHeldTrace()
  if (!isMobile || storyOpen) return
  if (mobHSwiping) notifyRingDrag(false)
  dragging = false
  if (!mobHSwiping) {
    const t = e.changedTouches[0]
    clickPointer.x = (t.clientX / innerWidth) * 2 - 1
    clickPointer.y = -((t.clientY / viewportH()) * 2 - 1)
    raycaster.setFromCamera(clickPointer, camera)
    const hits = raycaster.intersectObjects(panels, false)
    if (welcomeActive) { handleWelcomeClick(hits); touchId = null; return }
    if (hits.length > 0) { paused = true; handlePanelClick(frontPanelIdx()) }
  } else {
    angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, touchVel * MOB_TOUCH_SENS))
  }
  touchId = null
}, { passive: true })
renderer.domElement.addEventListener('touchcancel', clearHeldTrace, { passive: true })

// Wheel events fire continuously through a scroll gesture with no natural
// start/end like pointerdown/up — debounce so the piano gets one "started"
// per burst and one "stopped" after scrolling actually pauses.
let wheelDragTimeout = null
window.addEventListener('wheel', (e) => {
  if (storyOpen || welcomeActive) return
  e.preventDefault()
  angle -= e.deltaY * 0.0008
  angVel = 0
  if (!wheelDragTimeout) notifyRingDrag(true)
  clearTimeout(wheelDragTimeout)
  wheelDragTimeout = setTimeout(() => { notifyRingDrag(false); wheelDragTimeout = null }, 220)
}, { passive: false })

window.addEventListener('keydown', (e) => {
  if (storyOpen || welcomeActive) return
  if (e.key === 'ArrowLeft')       angVel = Math.min(MAX_VEL, angVel + 1.8)
  else if (e.key === 'ArrowRight') angVel = Math.max(-MAX_VEL, angVel - 1.8)
})
window.addEventListener('message', (e) => {
  if (storyOpen || welcomeActive) return
  if (!e.data || e.data.type !== 'key') return
  if (e.data.key === 'ArrowLeft')       angVel = Math.min(MAX_VEL, angVel + 1.8)
  else if (e.data.key === 'ArrowRight') angVel = Math.max(-MAX_VEL, angVel - 1.8)
})

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / viewportH()
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, viewportH())
  updateStoryRect()
})

// ── Render loop ───────────────────────────────────────────────────────────────
let last = performance.now()

// The animated card faces (moving-images water/caustic + archive video) redraw
// every frame so their motion stays smooth. The per-frame cost is kept low by
// pre-baking the grayscale swim tile once (see buildSwimGray) instead of running
// a canvas filter on every tile of every frame, which is what used to stutter
// the ring while spinning.
let prFrames = 0, prAccum = 0
function render(now) {
  requestAnimationFrame(render)
  let dt = (now - last) / 1000; last = now
  if (dt > 0.05) dt = 0.05

  // Twice a second, if we're below ~56fps, shed a quarter step of pixel ratio
  // (down to 0.75) so the ring recovers when the GPU throttles under sustained
  // load. Only steps down, so it settles without oscillating. Checking twice a
  // second lets it react to a thermal drop within ~half a second.
  prFrames++; prAccum += dt
  if (prAccum >= 0.5) {
    const fps = prFrames / prAccum
    prFrames = 0; prAccum = 0
    if (fps < 56 && curPR > 0.75) {
      curPR = Math.max(0.75, curPR - 0.25)
      renderer.setPixelRatio(curPR)
      renderer.setSize(innerWidth, viewportH())
    }
  }

  // Only rebuild + re-upload the two animated card textures (moving-images
  // caustics, archive video) while the card is in the visible front arc. When a
  // card is rotated to the back of the ring its animation can't be read anyway,
  // so redrawing it there was pure sustained GPU load — the thing that heats the
  // machine and makes it studder ~10-15s in. Phase (swimTime/swimScroll) still
  // advances every frame, so there's no jump when a card swings back into view.
  const visThresh = -(isMobile ? MOB_RADIUS : RADIUS) * 0.2   // front ~60% of the ring
  const miVisible = !panels[MOVING_IMAGES_INDEX] || panels[MOVING_IMAGES_INDEX].position.z > visThresh
  const arVisible = !panels[ARCHIVE_INDEX] || panels[ARCHIVE_INDEX].position.z > visThresh

  if (movingImagesFaceTex && swimImg.complete && swimImg.naturalWidth) {
    swimScroll += SWIM_SCROLL_SPEED * dt
    swimTime += dt
    if (miVisible) {
      drawPortalCard(movingImagesFaceCtx, PORTALS[MOVING_IMAGES_INDEX], 600, 800, 54,
        (ctx, W, H) => drawSwimTrace(ctx, W, H, PORTALS[MOVING_IMAGES_INDEX].bg, 1.0))
      movingImagesFaceTex.needsUpdate = true
    }
  }

  if (arVisible && archiveFaceTex && archiveVideo.readyState >= 2) {
    drawPortalCard(archiveFaceCtx, PORTALS[ARCHIVE_INDEX], 600, 800, 54,
      (ctx, W, H) => drawArchiveVideo(ctx, W, H))
    archiveFaceTex.needsUpdate = true
  }

  // Every card wears the same live TV static: regenerate one shared noise frame,
  // then for each visible card blit its base and apply the static over it. Video
  // cards re-render their base (live footage) first.
  regenNoise()
  animatedFaceTexes.forEach((vc) => {
    const p = panels[vc.idx]
    const vis = !p || p.position.z > visThresh
    if (!vis) return
    if (vc.live) {
      const v = vc.portal._video
      // Re-render the base each frame for live cards: video only once ready,
      // slideshow/enquiries always (their content advances over time).
      if (!v || v.readyState >= 2) drawCardBase(vc.baseCtx, vc.portal, 600, 800, vc.drawTrace)
    }
    vc.ctx.clearRect(0, 0, 600, 800)
    vc.ctx.drawImage(vc.baseCanvas, 0, 0)
    applyTvStatic(vc.ctx, 600, 800)
    vc.faceTex.needsUpdate = true
  })

  if (!dragging && !storyOpen && !welcomeActive) {
    if (!paused) {
      if (Math.abs(angVel) > AUTO_SPEED * 1.5) autoDir = Math.sign(angVel)
      const target = AUTO_SPEED * autoDir
      angVel = target + (angVel - target) * Math.exp(-FRICTION * dt)
    } else {
      angVel *= Math.exp(-FRICTION * dt)
    }
    angle += angVel * dt
  }

  // While the pointer is down (holding or dragging), keep the front-most panel
  // fully opaque so it stays solid as you spin through the ring; released → revert.
  if (dragging) setHeldTrace(frontPanelIdx())

  if (isMobile) {
    orbitEuler.set(angle, 0, 0, 'XYZ')
    orbitQuat.setFromEuler(orbitEuler)

    for (let i = 0; i < COUNT; i++) {
      orbitPos.copy(homePositions[i]).applyQuaternion(orbitQuat)
      panels[i].position.set(0, orbitPos.y * SPREAD, orbitPos.z)
      panels[i].rotation.set(Math.atan2(-orbitPos.y, orbitPos.z), 0, 0)

      const norm = Math.min(1, Math.max(0, (orbitPos.z + MOB_RADIUS) / (2 * MOB_RADIUS)))
      faceMats[i].opacity  = FRONT_OPACITY * (0.5 + 0.5 * norm)
      glassMats[i].opacity = BACK_OPACITY  * (0.3 + 0.7 * norm)
      sideMats[i].opacity  = 0.65 * (0.22 + 0.45 * norm)
      backMats[i].opacity  = 0.72
      // Held card (Detroit/Postcards full-colour reveal) goes fully solid —
      // no glass/back translucency, so nothing behind it reads through.
      if (i === heldTraceIdx) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      if (welcomeActive && i === WELCOME_INDEX) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      panels[i].renderOrder = Math.round(orbitPos.z * 1000)
    }
  } else {
    orbitEuler.set(0, angle, 0, 'XYZ')
    orbitQuat.setFromEuler(orbitEuler)

    for (let i = 0; i < COUNT; i++) {
      orbitPos.copy(homePositions[i]).applyQuaternion(orbitQuat)
      panels[i].position.set(orbitPos.x * SPREAD, 0, orbitPos.z)
      panels[i].rotation.set(0, Math.atan2(orbitPos.x, orbitPos.z), 0)

      const norm = Math.min(1, Math.max(0, (orbitPos.z + RADIUS) / (2 * RADIUS)))
      faceMats[i].opacity  = FRONT_OPACITY * (0.5 + 0.5 * norm)
      glassMats[i].opacity = BACK_OPACITY  * (0.3 + 0.7 * norm)
      sideMats[i].opacity  = 0.65 * (0.22 + 0.45 * norm)
      backMats[i].opacity  = 0.72
      if (i === heldTraceIdx) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      if (welcomeActive && i === WELCOME_INDEX) {
        faceMats[i].opacity = 1; glassMats[i].opacity = 1
        sideMats[i].opacity = 1; backMats[i].opacity = 1
      }
      panels[i].renderOrder = Math.round(orbitPos.z * 1000)
    }
  }

  if (storyOpen) updateStoryRect()

  updateNoteCard(dt)

  if (POST.on) renderPost(); else renderer.render(scene, camera)
}

// Background colour (locked in): dark desaturated blue — HSL 223 / 18% / 9%
// (≈ #12151b). The fog colour is tied to it so cards fade into the same colour.
;(function () {
  const col = new THREE.Color().setHSL(223 / 360, 0.18, 0.09)
  scene.background = col.clone()
  scene.fog.color.copy(col)
})()

// ── Slow-note card ────────────────────────────────────────────────────────────
// A seventh card that is NOT part of the ring: same geometry, same materials,
// same live TV static, but parked at the left of the screen and never rotated
// by the carousel. White face, black type, purple PLAY.
//
// It sits slightly in front of the ring (NOTE_Z) so passing cards can never
// intersect it, and is scaled by the distance ratio so it still measures the
// same on screen as a front ring card.
const NOTE_COPY = 'This site is to be taken slow. Push play on the lobby music and enjoy browsing.'
const NOTE_PURPLE = '#8127D3'
const NOTE_Z = RADIUS + 1.2
const noteScale = (CAM_Z - NOTE_Z) / nearDist

const noteBase = document.createElement('canvas'); noteBase.width = 600; noteBase.height = 800
const noteBaseCtx = noteBase.getContext('2d')
const noteFaceCanvas = document.createElement('canvas'); noteFaceCanvas.width = 600; noteFaceCanvas.height = 800
const noteFaceCtx = noteFaceCanvas.getContext('2d')
const noteHits = { play: null, close: null }

// Type is 2/3 the size of a card title (titleLayout tops out at 74px on this
// same 600x800 face), matching the proportion agreed for the old HTML box.
const NOTE_MENU = [
  { id: 'write', label: 'WRITE US' },
  { id: 'interviews', label: 'INTERVIEWS' },
  { id: 'listens', label: 'LISTENS' },
  { id: 'bsides', label: 'B-SIDES' },
  { id: 'alextaves', label: 'ALEXTAVES.COM' },
]

function drawNoteBase() {
  const ctx = noteBaseCtx, W = 600, H = 800, lm = 54
  const size = 42                    // 15% down from 49
  const maxW = W - lm * 2
  const FONT = `'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H)
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'

  ctx.font = `700 ${size}px ${FONT}`
  ctx.letterSpacing = '-0.01em'
  ctx.fillStyle = '#111111'
  const lines = wrapText(ctx, NOTE_COPY.toUpperCase(), maxW)
  let y = 116
  lines.forEach((l) => { ctx.fillText(l, lm, y); y += size * 1.18 })

  y += 22
  ctx.fillStyle = NOTE_PURPLE
  const label = lobby.paused ? 'PLAY' : 'PAUSE'
  ctx.fillText(label, lm, y)
  noteHits.play = [lm - 14, y - 12, ctx.measureText(label).width + 28, size + 24]
  y += size * 1.18 + 10

  // Credit: bigger, heavier and darker than the old 300-weight line so it holds
  // its own. Wraps if it needs a second or third line.
  const cs = 27
  ctx.font = `500 ${cs}px ${FONT}`
  ctx.letterSpacing = '0.04em'
  ctx.fillStyle = 'rgba(17,17,17,0.92)'
  wrapText(ctx, 'AUDIO: WRONG BY HWY 3', maxW).forEach((l) => { ctx.fillText(l, lm, y); y += cs * 1.26 })

  // Quick links.
  y += 24
  ctx.strokeStyle = 'rgba(17,17,17,0.22)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(lm, y + 0.5); ctx.lineTo(W - lm, y + 0.5); ctx.stroke()
  y += 24

  const ms = 30
  ctx.font = `700 ${ms}px ${FONT}`
  ctx.letterSpacing = '0.02em'
  ctx.fillStyle = '#111111'
  noteHits.menu = []
  NOTE_MENU.forEach((m) => {
    ctx.fillText(m.label, lm, y)
    noteHits.menu.push({ id: m.id, rect: [lm - 14, y - 10, ctx.measureText(m.label).width + 28, ms + 20] })
    y += ms * 1.42
  })

  ctx.font = `300 42px ${FONT}`
  ctx.letterSpacing = '0'
  ctx.fillStyle = '#111111'
  ctx.textAlign = 'right'
  ctx.fillText('✕', W - lm, 52)
  ctx.textAlign = 'left'
  noteHits.close = [W - lm - 72, 38, 82, 82]
}
drawNoteBase()

const noteTex = new THREE.CanvasTexture(noteFaceCanvas)
const noteWhite = new THREE.Color('#ffffff')
const noteFaceMat = new THREE.MeshPhysicalMaterial({
  map: noteTex, transparent: true, opacity: 1, side: THREE.FrontSide,
  roughness: 0.55, metalness: 0.0, envMapIntensity: 0.12,
  color: new THREE.Color(0xffffff), alphaMap: roundedAlphaMap,
})
const noteEdgeMat = new THREE.MeshStandardMaterial({
  color: noteWhite, transparent: true, opacity: 1,
  roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
})
const noteBackMat = new THREE.MeshStandardMaterial({
  color: noteWhite, transparent: true, opacity: 0.92,
  roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
})
// Spine type. When tucked, the face pointing at the camera is the box's +x side
// (material index 0), so OSWIN JOURNAL goes there, rotated to run along the
// spine and centred. Canvas is tall and narrow to match the THICK x panelH face.
// 2x resolution: the spine renders ~44px wide on screen, so at the old 128px
// canvas the type resolved to ~11px and anti-aliasing greyed the stems out.
// Same relative size (66 on 256 == 33 on 128), twice the glyph detail.
const spineCanvas = document.createElement('canvas'); spineCanvas.width = 256; spineCanvas.height = 2048
const spineCtx = spineCanvas.getContext('2d')
spineCtx.fillStyle = '#ffffff'; spineCtx.fillRect(0, 0, 256, 2048)
spineCtx.save()
spineCtx.translate(128, 1024); spineCtx.rotate(-Math.PI / 2)
spineCtx.fillStyle = '#000000'
spineCtx.font = `700 99px 'Helvetica Neue', Helvetica, Arial, sans-serif`   // 1.5x (66 -> 99 at 2x res)
spineCtx.letterSpacing = '-0.01em'   // matches titleLayout — the wide 0.20em read far lighter
spineCtx.textAlign = 'center'; spineCtx.textBaseline = 'middle'
spineCtx.fillText('OSWIN JOURNAL', 0, 0)
spineCtx.restore()

// Black dot at the top of the spine, 90% of the spine's width. The gap is in
// texture pixels: the 2048-tall canvas maps to roughly 812 CSS px of spine, so
// ~2.52 texture px per CSS px — 63 gives about 25 CSS px at a full-height
// window. It scales with the viewport, since the texture itself is fixed.
// A round dot needs an ELLIPSE in texture space: the 256x2048 canvas is mapped
// onto a face that is THICK wide by (panelH * tuckY) tall, so one texture pixel
// covers far less world space vertically than horizontally. Solve for equal
// world extent in both directions and the dot renders as a true circle.
const _dotDist = CAM_Z - NOTE_Z
const _dotTuckY = (_dotDist - (panelW * noteScale) / 2) / _dotDist
const worldPerTexX = (THICK * noteScale) / 256
const worldPerTexY = (panelH * noteScale * _dotTuckY) / 2048
const DOT_RX = (256 * 0.9) / 2                          // 90% of the spine width
const DOT_RY = DOT_RX * (worldPerTexX / worldPerTexY)   // same size in world units
const DOT_GAP = 63
spineCtx.beginPath()
spineCtx.ellipse(128, DOT_GAP + DOT_RY, DOT_RX, DOT_RY, 0, 0, Math.PI * 2)
spineCtx.fillStyle = '#000000'
spineCtx.fill()

const spineTex = new THREE.CanvasTexture(spineCanvas)
const noteSpineMat = new THREE.MeshStandardMaterial({
  map: spineTex, color: new THREE.Color(0xffffff), transparent: true, opacity: 1,
  roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
})

const noteCard = new THREE.Mesh(panelGeo, [noteSpineMat, noteEdgeMat, noteEdgeMat, noteEdgeMat, noteFaceMat, noteBackMat])
noteCard.frustumCulled = false
noteCard.scale.setScalar(noteScale)
scene.add(noteCard)

let noteOpen = true, noteT = 1   // noteT: 1 = open and facing us, 0 = tucked edge-on

// Glide the ring so card `i` ends up front-and-centre. Card i sits dead centre
// when angle == (i/COUNT)*2PI - PI/2 (the same formula LANDING_INDEX uses); we
// pick whichever equivalent angle is nearest so it takes the short way round.
let ringTarget = null
function focusCard(i) {
  let t = (i / COUNT) * Math.PI * 2 - Math.PI / 2
  while (t - angle > Math.PI) t -= Math.PI * 2
  while (angle - t > Math.PI) t += Math.PI * 2
  ringTarget = t
  paused = true      // stop the idle auto-spin fighting the glide
  angVel = 0
}

function noteXPositions() {
  const dist = CAM_Z - NOTE_Z
  const halfWAt = (d) => d * Math.tan(vFOV / 2) * camera.aspect
  // Turned edge-on the spine swings panelW/2 NEARER the camera, where the
  // frustum is narrower — so its flush-left x must be solved at that depth, not
  // at the card's centre depth, or the spine ends up off-screen entirely.
  const spineDist = dist - (panelW * noteScale) / 2
  return {
    open: -halfWAt(dist) + (panelW * noteScale) / 2,     // face flush to the left edge
    closed: -halfWAt(spineDist) + (THICK * noteScale) / 2,
    spineDist,
  }
}

function updateNoteCard(dt) {
  // Ring direction drives the tape. AUTO_SPEED is positive, so scrubbing against
  // the idle rotation gives a negative angVel and flips the audio to reverse.
  // Small deadzone so it doesn't chatter as the ring coasts through zero.
  // While dragging, angVel stays 0 (angle is moved directly), so use the tracked
  // pointer velocity — the tape should turn the instant you scrub, not on release.
  if (dragging) {
    if (trackedVel > 40) setLobbyDirection(1)
    else if (trackedVel < -40) setLobbyDirection(-1)
  } else if (angVel > 0.004) setLobbyDirection(1)
  else if (angVel < -0.004) setLobbyDirection(-1)

  // Ring glide toward a focused card; any drag cancels it.
  if (ringTarget !== null) {
    if (dragging) ringTarget = null
    else {
      angle += (ringTarget - angle) * Math.min(1, dt * 3.2)
      if (Math.abs(ringTarget - angle) < 0.002) { angle = ringTarget; ringTarget = null }
    }
  }

  const target = noteOpen ? 1 : 0
  noteT += (target - noteT) * Math.min(1, dt * 5.5)
  const e = noteT * noteT * (3 - 2 * noteT)   // smoothstep the tuck

  const x = noteXPositions()
  noteCard.position.set(x.closed + (x.open - x.closed) * e, 0, NOTE_Z)

  // A flat -90deg puts the spine parallel to the screen, so it reads straight-on
  // rather than as an oblique sliver. It also turns the printed face to point
  // -x (away from the camera, which sits to its right), so the face stays hidden.
  const dist = CAM_Z - NOTE_Z
  noteCard.rotation.y = -Math.PI / 2 * (1 - e)

  // Edge-on, the card's WIDTH now runs along the line of sight, so its near
  // edge sits (panelW/2) closer to the camera and perspective makes the bar
  // taller than a ring card. Screen height goes as 1/view-z, so scaling Y by
  // (near view-z / centre view-z) puts the tucked spine back at card height.
  // Spine sits nearer, so shrink Y by the depth ratio to land back at card height.
  const tuckY = x.spineDist / dist
  noteCard.scale.set(noteScale, noteScale * (tuckY + (1 - tuckY) * e), noteScale)

  // The card body is a thin plane at a constant x; seen from a camera that
  // isn't in that plane it ALWAYS projects as a wedge running back into the
  // scene. Occluding it would mean angling the card, which is what we don't
  // want — so fade the body out instead and leave a clean spine.
  noteFaceMat.opacity = e
  noteBackMat.opacity = 0.92 * e
  noteEdgeMat.opacity = e
  // Opacity 0 still writes depth, which silently occludes the ring behind the
  // tucked card — an invisible slab cutting holes in the carousel. Drop depth
  // writing once the body has faded, and restore it while it's on screen.
  const bodyDrawn = e > 0.02
  noteFaceMat.depthWrite = bodyDrawn
  noteBackMat.depthWrite = bodyDrawn
  noteEdgeMat.depthWrite = bodyDrawn

  // Same live static every other card wears — redrawn from the cached base.
  noteFaceCtx.setTransform(1, 0, 0, 1, 0, 0)
  noteFaceCtx.clearRect(0, 0, 600, 800)
  noteFaceCtx.drawImage(noteBase, 0, 0)
  applyTvStatic(noteFaceCtx, 600, 800)
  noteTex.needsUpdate = true
}

// Capture-phase so it wins before the ring's own drag/click handling.
renderer.domElement.addEventListener('pointerdown', (e) => {
  clickPointer.x = (e.clientX / innerWidth) * 2 - 1
  clickPointer.y = -((e.clientY / innerHeight) * 2 - 1)
  raycaster.setFromCamera(clickPointer, camera)
  const hit = raycaster.intersectObject(noteCard, false)[0]
  if (!hit) return
  // Tucked, the body is invisible but its geometry still catches rays, so a
  // click anywhere in the empty gap between spine and ring was landing on the
  // card. Only the spine face (+x, material 0) counts; anything else falls
  // through untouched so the ring still gets the event.
  if (!noteOpen) {
    if (hit.face.materialIndex !== 0) return
    e.stopPropagation()
    noteOpen = true
    return
  }
  e.stopPropagation()
  if (hit.face.materialIndex !== 4 || !hit.uv) return // only the printed face
  const px = hit.uv.x * 600, py = (1 - hit.uv.y) * 800
  const inRect = (r) => r && px >= r[0] && px <= r[0] + r[2] && py >= r[1] && py <= r[1] + r[3]
  if (inRect(noteHits.close)) { noteOpen = false; return }
  if (inRect(noteHits.play)) { toggleLobby(); drawNoteBase(); return }
  for (const m of noteHits.menu || []) {
    if (!inRect(m.rect)) continue
    if (m.id === 'write') { focusCard(ENQUIRIES_INDEX); noteOpen = false }
    else if (m.id === 'listens') { openCardIframe('listens.html') }
    // B-sides — first one is Dancer (the nine-card Chris ring).
    else if (m.id === 'bsides') { openCardIframe('dancer.html') }
    else if (m.id === 'alextaves') window.open('https://alextaves.com', '_blank', 'noopener')
    // 'interviews' has no destination yet — hit target is live, action pending.
    return
  }
}, true)

// ── Post-processing ───────────────────────────────────────────────────────────
// Hand-rolled rather than EffectComposer: this scene runs on the classic r136
// global build, and the addons in vendor/postprocessing are ES modules bound to
// r184 — mixing them means two three.js instances, which fails at render time.
// Everything below uses the same THREE the ring already uses.
//
// Colour pipeline (r136): tone mapping is applied by the scene's own materials,
// so the scene RT holds ACES-mapped LINEAR values. Three does NOT inject an
// encoding conversion into a raw ShaderMaterial, so the composite converts
// linear -> sRGB itself. Skip that and everything comes out washed out.
//
// Toggle live with the P key, or load with ?post=0 to start off.
const POST = { on: new URLSearchParams(location.search).get('post') !== '0' }

// All tunable from the URL so the look can be dialled without editing:
//   ?exp=1.4  ?vig=0.1  ?bloom=0.7  ?grain=0.06
const _num = (k, d) => { const v = parseFloat(_q.get(k)); return Number.isFinite(v) ? v : d }

const EXPOSURE = _num('exp', 1.02)        // flat multiplier, applied first
// Shadow lift. EXPOSURE alone widens the gap between the bright cards (which
// bloom and clip) and the dark ones (Karla, Alexander), which is what made them
// read as too dark. This is a gamma curve: it raises shadows and midtones and
// leaves white at white, so the dark cards come up without blowing the pink one.
const LIFT = _num('lift', 1.12)
const BLOOM_STRENGTH = _num('bloom', 0.34) // how much glow is added back
const BLOOM_THRESHOLD = 0.70  // luminance above which a pixel blooms
const BLOOM_KNEE = 0.28       // soft shoulder, so the threshold isn't a hard edge
const GRAIN = _num('grain2', 0.032)
// Depth of field. Focus sits on the front of the ring; blur ramps in behind it.
// DOF_NEAR/FAR are distances BEYOND the front card, in world units, over which
// the blur goes from none to full. DOF_MAX caps it so the back stays readable.
const DOF_MAX  = _num('dof', 0.38)
const DOF_NEAR = _num('dofnear', RADIUS * 1.05)
const DOF_FAR  = _num('doffar', RADIUS * 2.1)
// Darkens the background/fog for the post pass only. The clear colour is the
// background, so scaling it here darkens the field WITHOUT touching the cards —
// and the no-post path still uses the locked-in #12151b untouched.
const BG_DARK = _num('bg', 0.5)
const VIGNETTE = _num('vig', 0.075)

const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null)
const fsScene = new THREE.Scene().add(fsQuad)
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)

const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.HalfFloatType }
let rtScene, rtA, rtB, rtC, rtD, rtDepth

function sizePostTargets() {
  const w = Math.max(1, Math.floor(innerWidth * curPR))
  const h = Math.max(1, Math.floor(viewportH() * curPR))
  const bw = Math.max(1, Math.floor(w / 4)), bh = Math.max(1, Math.floor(h / 4))
  if (!rtScene) {
    // MSAA only applies to the canvas, so rendering the scene into a plain
    // target throws away the renderer's antialias:true and the card edges go
    // jagged. A multisample target puts it back. The bloom targets don't need
    // it — they're blurred to nothing anyway.
    const MS = renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget
    rtScene = MS ? new THREE.WebGLMultisampleRenderTarget(w, h, rtOpts)
                 : new THREE.WebGLRenderTarget(w, h, rtOpts)
    if (MS) rtScene.samples = Math.min(4, renderer.getContext().getParameter(renderer.getContext().MAX_SAMPLES))
    rtA = new THREE.WebGLRenderTarget(bw, bh, rtOpts)
    rtB = new THREE.WebGLRenderTarget(bw, bh, rtOpts)
    // Scene blur (for DoF) needs its own pair — rtA/rtB are busy with bloom.
    rtC = new THREE.WebGLRenderTarget(bw, bh, rtOpts)
    rtD = new THREE.WebGLRenderTarget(bw, bh, rtOpts)
    // Depth pre-pass. Plain 8-bit RGBA with packed depth: multisample targets
    // can't carry a depth texture here, so depth is rendered separately.
    rtDepth = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, format: THREE.RGBAFormat })
  } else {
    rtScene.setSize(w, h); rtA.setSize(bw, bh); rtB.setSize(bw, bh)
    rtC.setSize(bw, bh); rtD.setSize(bw, bh); rtDepth.setSize(w, h)
  }
  blurMat.uniforms.texel.value.set(1 / bw, 1 / bh)
}

const VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, threshold: { value: BLOOM_THRESHOLD }, knee: { value: BLOOM_KNEE } },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tex; uniform float threshold; uniform float knee; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tex, vUv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float w = smoothstep(threshold - knee, threshold + knee, l);
      gl_FragColor = vec4(c * w, 1.0);
    }`,
})

// Separable 9-tap gaussian — run once horizontally, once vertically.
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2(1, 0) }, texel: { value: new THREE.Vector2(1 / 512, 1 / 512) } },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tex; uniform vec2 dir; uniform vec2 texel; varying vec2 vUv;
    void main(){
      vec2 o = dir * texel;
      vec3 c = texture2D(tex, vUv).rgb * 0.227027;
      c += texture2D(tex, vUv + o * 1.3846).rgb * 0.316216;
      c += texture2D(tex, vUv - o * 1.3846).rgb * 0.316216;
      c += texture2D(tex, vUv + o * 3.2308).rgb * 0.070270;
      c += texture2D(tex, vUv - o * 3.2308).rgb * 0.070270;
      gl_FragColor = vec4(c, 1.0);
    }`,
})

const compositeMat = new THREE.ShaderMaterial({
  uniforms: {
    tex: { value: null }, bloomTex: { value: null },
    blurTex: { value: null }, depthTex: { value: null },
    dofMax: { value: DOF_MAX }, dofNear: { value: 0 }, dofFar: { value: 0 },
    camNear: { value: 0 }, camFar: { value: 0 },
    strength: { value: BLOOM_STRENGTH }, grain: { value: GRAIN },
    vignette: { value: VIGNETTE }, exposure: { value: EXPOSURE },
    lift: { value: LIFT }, time: { value: 0 },
  },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tex; uniform sampler2D bloomTex;
    uniform sampler2D blurTex; uniform sampler2D depthTex;
    uniform float dofMax; uniform float dofNear; uniform float dofFar;
    uniform float camNear; uniform float camFar;
    uniform float strength; uniform float grain; uniform float vignette;
    uniform float exposure; uniform float lift; uniform float time;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    // three's packDepthToRGBA, inverted.
    float unpackDepth(vec4 v){
      return dot(v, vec4(255.0/256.0/16777216.0, 255.0/256.0/65536.0, 255.0/256.0/256.0, 255.0/256.0));
    }
    void main(){
      // Distance from the camera, in world units, for this pixel.
      float zdepth = unpackDepth(texture2D(depthTex, vUv));
      float viewZ = (camNear * camFar) / ((camFar - camNear) * zdepth - camFar);
      float dist = -viewZ;
      float coc = smoothstep(dofNear, dofFar, dist) * dofMax;

      vec3 sharp = texture2D(tex, vUv).rgb;
      vec3 soft = texture2D(blurTex, vUv).rgb;
      vec3 c = mix(sharp, soft, coc) + texture2D(bloomTex, vUv).rgb * strength;
      c *= exposure;
      c = pow(max(c, 0.0), vec3(1.0 / lift));   // lifts shadows, leaves white at white
      vec2 d = vUv - 0.5;
      c *= 1.0 - vignette * dot(d, d) * 2.0;
      // Weight grain by luminance. Flat grain destroys the background: the dark
      // field carries almost no signal, so the noise is all you see there. This
      // fades it out below ~0.22 luminance, so grain lives on the cards and the
      // background stays clean.
      float lumv = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float gw = smoothstep(0.02, 0.22, lumv);
      c += (hash(vUv * 1024.0 + fract(time)) - 0.5) * grain * gw;
      // linear -> sRGB. r136 makes materials write LINEAR into a render target
      // (encoding only applies when drawing to the canvas), so this conversion
      // has to happen here or the whole frame comes out ~20% dark. The clear
      // colour is linearised in renderPost so the background matches.
      c = max(c, 0.0);
      vec3 lo = c * 12.92;
      vec3 hi = 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055;
      gl_FragColor = vec4(mix(hi, lo, step(c, vec3(0.0031308))), 1.0);
    }`,
})

function drawQuad(mat, target) {
  fsQuad.material = mat
  renderer.setRenderTarget(target || null)
  renderer.render(fsScene, fsCam)
}

let postPR = -1, _bgLinear = null, _fogLinear = null
const depthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking })
function renderPost() {
  if (!rtScene || postPR !== curPR) { sizePostTargets(); postPR = curPR }

  // The clear colour and fog are written raw, not through a material, so they'd
  // land in the target already-encoded while everything else lands linear. Swap
  // in linearised copies for the offscreen pass so the whole target is linear,
  // then put the originals back — the no-post path must stay untouched.
  if (!_bgLinear) {
    // Fog is scaled with the background so distant cards still fade into the
    // same colour — that tie is deliberate in the original scene setup.
    _bgLinear = scene.background.clone().convertSRGBToLinear().multiplyScalar(BG_DARK)
    _fogLinear = scene.fog.color.clone().convertSRGBToLinear().multiplyScalar(BG_DARK)
  }
  const bgWas = scene.background, fogWas = scene.fog.color.clone()
  scene.background = _bgLinear
  scene.fog.color.copy(_fogLinear)

  renderer.setRenderTarget(rtScene)
  renderer.clear()
  renderer.render(scene, camera)

  scene.background = bgWas
  scene.fog.color.copy(fogWas)

  // Depth pre-pass — same scene, depth-packed material.
  scene.overrideMaterial = depthMat
  renderer.setRenderTarget(rtDepth)
  renderer.clear()
  renderer.render(scene, camera)
  scene.overrideMaterial = null

  // Blurred copy of the whole scene, for the out-of-focus half of the mix.
  blurMat.uniforms.tex.value = rtScene.texture; blurMat.uniforms.dir.value.set(1, 0)
  drawQuad(blurMat, rtC)
  blurMat.uniforms.tex.value = rtC.texture; blurMat.uniforms.dir.value.set(0, 1)
  drawQuad(blurMat, rtD)
  blurMat.uniforms.tex.value = rtD.texture; blurMat.uniforms.dir.value.set(1, 0)
  drawQuad(blurMat, rtC)

  brightMat.uniforms.tex.value = rtScene.texture
  drawQuad(brightMat, rtA)

  blurMat.uniforms.tex.value = rtA.texture; blurMat.uniforms.dir.value.set(1, 0)
  drawQuad(blurMat, rtB)
  blurMat.uniforms.tex.value = rtB.texture; blurMat.uniforms.dir.value.set(0, 1)
  drawQuad(blurMat, rtA)

  compositeMat.uniforms.tex.value = rtScene.texture
  compositeMat.uniforms.bloomTex.value = rtA.texture
  compositeMat.uniforms.blurTex.value = rtC.texture
  compositeMat.uniforms.depthTex.value = rtDepth.texture
  compositeMat.uniforms.camNear.value = camera.near
  compositeMat.uniforms.camFar.value = camera.far
  compositeMat.uniforms.dofNear.value = nearDist + DOF_NEAR
  compositeMat.uniforms.dofFar.value = nearDist + DOF_FAR
  compositeMat.uniforms.time.value = performance.now() / 1000
  drawQuad(compositeMat, null)
}

addEventListener('resize', () => { if (rtScene) sizePostTargets() })
window.addEventListener('keydown', (e) => {
  if (e.key === 'p' || e.key === 'P') { POST.on = !POST.on; renderer.setRenderTarget(null) }
})

startBadgeSlideshow()

requestAnimationFrame(render)
</script>
</body>
</html>
