<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oswin Journal — Oli Goldsmith, Rectangles</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  html, body { margin:0; min-height:100vh; background:#0a0a0a; color:#fff;
               font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; }
  body > canvas { position:fixed; inset:0; width:100%; height:100%; display:block;
                  touch-action:pan-y; cursor:grab; }
  body.dragging > canvas { cursor:grabbing; }
  #backBtn {
    position:fixed; top:20px; left:22px; z-index:20;
    padding:6px 4px; border:none; background:none; cursor:pointer;
    color:var(--ink-dim); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing:0.22em; transition:color 200ms ease;
  }
  #backBtn:hover { color:var(--ink); }
  #counter { position:fixed; left:0; right:0; bottom:26px; z-index:20; text-align:center;
             pointer-events:none; font-size:12px; font-weight:300; letter-spacing:0.26em;
             color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  /* Ink is the one thing CSS owns across both rooms; everything else in the
     scene is WebGL and changes through applyTheme(). */
  :root { --ink: rgba(255,255,255,0.92); --ink-dim: rgba(255,255,255,0.45); --swatch-ring: rgba(255,255,255,0.30); }
  body.light { --ink: rgba(0,0,0,0.85); --ink-dim: rgba(0,0,0,0.38); --swatch-ring: rgba(0,0,0,0.25); }
  html, body { transition: background-color 420ms ease; }
  body.light { background:#ffffff; }

  /* The toggle. Two swatches of the two rooms, nothing else — no label, no
     track, no shadow. The ring says which you are in. */
  #theme {
    position:fixed; top:20px; right:22px; z-index:21;
    display:flex; gap:7px; padding:6px; border-radius:999px;
    opacity:0; transform:translateY(-4px); pointer-events:none;
    transition: opacity 420ms ease, transform 420ms ease;
  }
  #theme.awake { opacity:1; transform:none; pointer-events:auto; }
  #theme button {
    width:15px; height:15px; padding:0; border-radius:50%; cursor:pointer;
    border:1px solid var(--swatch-ring); background:#0A0A0C;
    box-shadow:0 0 0 0 transparent; transition: box-shadow 220ms ease, transform 220ms ease;
  }
  #theme button[data-t="light"] { background:#FFFFFF; }
  #theme button:hover { transform:scale(1.14); }
  /* The selected swatch gets a gap then a ring, so it reads as chosen rather
     than as merely bigger. */
  #theme button[aria-pressed="true"] { box-shadow:0 0 0 2px var(--ink-dim); }

</style>
</head>
<body>

<button id="backBtn" aria-label="Back">&larr;&nbsp;&nbsp;BACK</button>
<div id="theme" role="group" aria-label="Background">
  <button data-t="dark"  aria-label="Black background" aria-pressed="true"></button>
  <button data-t="light" aria-label="White background" aria-pressed="false"></button>
</div>
<div id="counter"></div>

<script src="vendor/three.min.js"></script>
<script>
// ── Oli Goldsmith — Rectangles ───────────────────────────────────────────────
// Nineteen sheets, the second room of the sketchbook. Like the sketchbook pages
// these were shot at whatever shape the sheet was — some landscape, some
// portrait — so the ratios run either side of 1 rather than settling on one.
//
// So every card is built to ITS OWN image. The slab, the reflection plane and
// the rounded corner mask are all per-aspect, and the ring is not built until
// the images have decoded — their real dimensions are the input, rather than a
// ratio declared up front and hoped for.
// Nineteen sheets and one card that is not a sheet: the way on to the squares.
// It is built as a canvas rather than a file so its board matches the sheets'
// matt exactly — same colour value, not a second export to keep in step.
const MATT_COLOUR = '#FCFCFC'
const ENTRIES = [
  ...Array.from({ length: 19 }, (_, i) => ({
    src: 'images/oli_rectangles/rect-' + String(i + 1).padStart(2, '0') + '.jpg',
  })),
  { label: 'more oli', href: 'square.html', aspect: 3 / 4 },
]
const COUNT = ENTRIES.length

// The label card. Drawn at the sheets' own scale so its type sits at a size
// that belongs with them, and centred on both axes.
function makeLabelCanvas(entry) {
  const H = 900, W = Math.round(H * entry.aspect)
  const c = document.createElement('canvas')
  c.width = W; c.height = H
  const ctx = c.getContext('2d')
  ctx.fillStyle = MATT_COLOUR
  ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = '#111111'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  const SIZE = 27
  const TRACK = 0.14
  ctx.font = '600 ' + SIZE + "px 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ctx.letterSpacing = TRACK + 'em'
  // letterSpacing adds a trailing gap after the LAST character too, which shifts
  // centred text left by half of it. Adding it back is the difference between
  // "centred" and "nearly centred".
  const trail = SIZE * TRACK / 2
  ctx.fillText(entry.label, W / 2 + trail, H / 2)
  return c
}

const CARD_FOV_FRAC = 0.855
const GAP_FRAC = 0.4
const NEAR = 4.0
const FOV = 55

const vFOV = (FOV * Math.PI) / 180
const panelH = CARD_FOV_FRAC * 2 * NEAR * Math.tan(vFOV / 2)
const THICK = 0.16 * (CARD_FOV_FRAC / 0.9)
const REFL_FRAC = 0.55
const reflH = panelH * REFL_FRAC

// This room is the one with sheets on BOTH sides of square — some landscape,
// some portrait. The sketchbook sizes every card to a fixed height, which is
// right when every sheet is portrait, but here it would make a 4:3 sheet half
// again as big as a 3:4 one. So a card is sized off its LONG side instead: a
// horizontal sheet is the same object as a vertical one, turned, not a bigger
// one. Portrait cards are unchanged — their long side already was the height.
function cardSize(aspect) {
  const h = aspect > 1 ? panelH / aspect : panelH
  return { w: h * aspect, h, rh: h * REFL_FRAC }
}

// ── The two rooms ───────────────────────────────────────────────────────────
// Everything that differs between black and white, in one table, so the toggle
// has a single thing to read and nothing is left behind on a switch. These are
// not inversions of each other: the dark room LIGHTS the sheets and throws
// their own colour on the floor, the white room can only SHADE them, so the
// reflection plane changes job rather than changing colour.
const THEMES = {
  dark: {
    bg: ['#0A0A0C', '#000000'], fog: '#050506', env: '#050507',
    hemi: ['#2a1a0a', '#0e0806', 0.15], rim: ['#ffcf90', 0.5], key: 1.1,
    exposure: 1.2,
    edge: '#009CD3', edgeGlow: 0.5, edgeFace: 0.62, edgeSide: 0.85, back: '#FFFFFF',
    face: 0.92, faceEnv: 0.12, shadow: 0,
    refl: 'glow', reflOpacity: 0.52,
  },
  light: {
    bg: ['#FFFFFF', '#E8E8E6'], fog: '#F4F4F2', env: '#F2F2F0',
    hemi: ['#ffffff', '#d8d8d6', 0.55], rim: ['#ffffff', 0.35], key: 0.85,
    exposure: 1.0,
    edge: '#000000', edgeGlow: 0, edgeFace: 0.88, edgeSide: 0.94, back: '#E5E2DA',
    face: 1.0, faceEnv: 0.03, shadow: 0.5,
    refl: 'shadow', reflOpacity: 0.60,
  },
}
let THEME = THEMES.dark

const scene = new THREE.Scene()
const bgC = document.createElement('canvas'); bgC.width = 4; bgC.height = 512
const bgCtx = bgC.getContext('2d')
function paintBg(t) {
  const g = bgCtx.createLinearGradient(0, 0, 0, 512)
  g.addColorStop(0, t.bg[0]); g.addColorStop(1, t.bg[1])
  bgCtx.fillStyle = g; bgCtx.fillRect(0, 0, 4, 512)
}
paintBg(THEME)
const bgTex = new THREE.CanvasTexture(bgC); bgTex.encoding = THREE.sRGBEncoding
scene.background = bgTex

const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 400)
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = THEME.exposure
document.body.appendChild(renderer.domElement)

const envScene = new THREE.Scene()
envScene.background = new THREE.Color(THEME.env)
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
function rebuildEnv() {
  if (scene.environment) scene.environment.dispose()
  scene.environment = pmrem.fromScene(envScene, 0, 0.1, 200).texture
}
rebuildEnv()
const hemi = new THREE.HemisphereLight(THEME.hemi[0], THEME.hemi[1], THEME.hemi[2])
scene.add(hemi)
const keyLight = new THREE.DirectionalLight('#ffffff', THEME.key); keyLight.position.set(4, 6, 5)
const rimLight = new THREE.DirectionalLight(THEME.rim[0], THEME.rim[1]); rimLight.position.set(-5, 2, -4)
scene.add(keyLight, rimLight)

// Cached by ratio: several pages happen to share one, and there is no reason to
// build the same corner mask twice.
const _alphaCache = new Map()
function alphaMapFor(aspect) {
  const k = aspect.toFixed(4)
  let t = _alphaCache.get(k)
  if (t) return t
  const AW = 128, AH = Math.round(AW / aspect)
  const c = document.createElement('canvas'); c.width = AW; c.height = AH
  const ctx = c.getContext('2d')
  const r = 5
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, AW, AH)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.lineTo(AW - r, 0)
  ctx.arcTo(AW, 0, AW, r, r); ctx.lineTo(AW, AH - r)
  ctx.arcTo(AW, AH, AW - r, AH, r); ctx.lineTo(r, AH)
  ctx.arcTo(0, AH, 0, AH - r, r); ctx.lineTo(0, r)
  ctx.arcTo(0, 0, r, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  t = new THREE.CanvasTexture(c)
  _alphaCache.set(k, t)
  return t
}

function avgColour(img) {
  const s = document.createElement('canvas'); s.width = 1; s.height = 1
  const sctx = s.getContext('2d')
  sctx.drawImage(img, 0, 0, 1, 1)
  const [r, g, b] = sctx.getImageData(0, 0, 1, 1).data
  return { r, g, b }
}

// ── The white room's drop shadow ────────────────────────────────────────────
// Face-on at the centre of the ring a card shows no depth at all: its sides go
// edge-on and a white sheet on a white ground has nothing to separate it. The
// slab's black edges solve this for every card BUT the one you are looking at.
// So the white room gets a soft shadow sitting just behind each card, reaching
// a little past its silhouette — the only place it can be seen. Dropped a touch
// low, as if the room's light were overhead. The dark room has no use for it:
// a black halo on black is nothing, and the edges already read there.
const SHADOW_PAD = 0.10          // how far it reaches past the card, as a fraction

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y,     x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x,     y + h, r)
  ctx.arcTo(x,     y + h, x,     y,     r)
  ctx.arcTo(x,     y,     x + w, y,     r)
  ctx.closePath()
}

function shadowTex(aspect) {
  const H = 512, W = Math.max(8, Math.round(H * aspect))
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d')
  // The card's own footprint inside the oversized plane.
  const inset = SHADOW_PAD / (1 + 2 * SHADOW_PAD)
  const px = W * inset, py = H * inset
  ctx.filter = 'blur(' + Math.round(H * 0.030) + 'px)'
  ctx.fillStyle = 'rgba(0,0,0,0.62)'
  roundRectPath(ctx, px, py + H * 0.014, W - 2 * px, H - 2 * py, Math.min(W, H) * 0.018)
  ctx.fill()
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// Two different jobs, not two colourways. In the dark room the plane is the
// sheet's own colour thrown on the floor — it LIGHTS. In the white room pale on
// pale is invisible, so the same plane becomes a contact shadow: the sheet is
// shaded onto the ground instead of glowing onto it. That is why the white room
// does not consult avgColour at all.
function reflTexFrom(img, t) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 160
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(128, 0, 0, 128, 0, 184)
  if (t.refl === 'glow') {
    const { r, g, b } = avgColour(img)
    const rgb = r + ',' + g + ',' + b
    grd.addColorStop(0, 'rgba(' + rgb + ',0.74)')
    grd.addColorStop(0.35, 'rgba(' + rgb + ',0.34)')
    grd.addColorStop(0.7, 'rgba(' + rgb + ',0.12)')
    grd.addColorStop(1, 'rgba(' + rgb + ',0.0)')
  } else {
    grd.addColorStop(0, 'rgba(0,0,0,0.34)')
    grd.addColorStop(0.35, 'rgba(0,0,0,0.15)')
    grd.addColorStop(0.7, 'rgba(0,0,0,0.05)')
    grd.addColorStop(1, 'rgba(0,0,0,0.0)')
  }
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 256, 160)
  // Dissolving into whatever the floor is: into black in the dark room, into
  // the floor's own grey in the white one. A black smear on white reads as dirt.
  const fade = ctx.createLinearGradient(0, 0, 0, 160)
  if (t.refl === 'glow') {
    fade.addColorStop(0, 'rgba(0,0,0,0.58)')
    fade.addColorStop(0.12, 'rgba(0,0,0,0.0)')
    fade.addColorStop(0.7, 'rgba(0,0,0,0.0)')
    fade.addColorStop(1, 'rgba(0,0,0,0.94)')
  } else {
    fade.addColorStop(0, 'rgba(232,232,230,0.0)')
    fade.addColorStop(0.55, 'rgba(232,232,230,0.35)')
    fade.addColorStop(1, 'rgba(232,232,230,0.95)')
  }
  ctx.fillStyle = fade; ctx.fillRect(0, 0, 256, 160)
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; return tex
}

// Authored sRGB, converted for the linear pipeline — handed straight to a
// material the renderer encodes it out again and the tint washes pale.
// In the dark room this is #009CD3 at full lightness: the slab's depth is the
// one coloured thing there. In the white room it is black, and doing the whole
// job of separating one sheet from the next.
function edgeColour(t) { return new THREE.Color(t.edge).convertSRGBToLinear() }
// The reverse of a sheet tints what shows through it. Left white in the dark
// room, where the sheet is lit and any tint would read as dirt; in the white
// room it is #E5E2DA, so the back of a card is paper against the room's white
// rather than the same flat value as the wall behind it.
function backColour(t) { return new THREE.Color(t.back).convertSRGBToLinear() }
// Emissive adds the edge's colour back as light the material carries itself,
// so the depth reads at the chosen strength rather than whatever the key light
// leaves of it. 0.5 in the dark room — a black ground gives the blue room to
// travel before it blows out. 0 in the white room: black emits nothing.

const ring = new THREE.Group()
scene.add(ring)

let CARDS = [], RADIUS = 6, CAM_Z = 10
let spin = 0, target = 0
let dragging = false, dragFrom = 0, spinFrom = 0, moved = 0, activeId = null
let lastDragEnd = -Infinity, lastDragMoved = 0

function slotSpin(card) { return Math.PI / 2 - (card._slot / COUNT) * Math.PI * 2 }

function placePanels() {
  CARDS.forEach((card) => {
    const a = (card._slot / COUNT) * Math.PI * 2 + spin
    const x = Math.cos(a) * RADIUS, z = Math.sin(a) * RADIUS
    card._mesh.position.set(x, 0, z)
    card._mesh.rotation.set(0, Math.atan2(x, z), 0)
  })
}

function nearest(from) {
  let best = from, bestD = Infinity
  CARDS.forEach((card) => {
    let a = slotSpin(card)
    a += Math.round((from - a) / (Math.PI * 2)) * Math.PI * 2
    const d = Math.abs(from - a)
    if (d < bestD) { bestD = d; best = a }
  })
  return best
}

function build(sources) {
  // The ring has to clear its WIDEST card. Spacing off an average would let the
  // near-square page overlap its neighbours while the narrow ones sat in space.
  // Measured off the finished widths rather than the raw ratios, because a
  // landscape sheet here is scaled off its long side, not its height.
  const widest = Math.max(...sources.map((s) => cardSize(s.w / s.h).w))
  RADIUS = (widest * (1 + GAP_FRAC)) / (2 * Math.sin(Math.PI / COUNT))
  CAM_Z = RADIUS + NEAR
  camera.position.set(0, 0, CAM_Z)
  camera.lookAt(0, 0, 0)
  scene.fog = new THREE.Fog(THEME.fog, CAM_Z - 2, CAM_Z + RADIUS * 2.6)

  CARDS = sources.map((src, i) => {
    const im = src.el
    const aspect = src.w / src.h
    const { w, h, rh } = cardSize(aspect)
    const alphaMap = alphaMapFor(aspect)

    const tex = new THREE.Texture(im)
    tex.encoding = THREE.sRGBEncoding
    tex.needsUpdate = true

    // The slab's depth — its sides and its top and bottom — is a fixed colour
    // here rather than each sheet's own average, so the stack reads as one set
    // of mounted boards rather than as thirteen differently-edged objects. The
    // floor glow below still comes from the individual sheet.
    const edge = edgeColour(THEME)

    // Opacity and envMap are both theme business, and both are about the ink.
    // At 0.92 the ground shows through every pixel: on black that is invisible,
    // on white it floors the darkest ink at about 20/255 however black the file
    // is — so the white room runs the face fully opaque. The environment is
    // pulled back there too: a bright room throws a specular sheen across the
    // face, and a sheen on black line work is exactly what reads as faded.
    const faceMat = new THREE.MeshPhysicalMaterial({
      map: tex, transparent: true, opacity: THEME.face, side: THREE.FrontSide,
      roughness: 0.55, metalness: 0.0, envMapIntensity: THEME.faceEnv,
      color: new THREE.Color(0xffffff), alphaMap,
    })
    const glassMat = new THREE.MeshStandardMaterial({
      color: edge, transparent: true, opacity: THEME.edgeFace, roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
      emissive: edgeColour(THEME), emissiveIntensity: THEME.edgeGlow,
    })
    const backMat = new THREE.MeshPhysicalMaterial({
      map: tex, transparent: true, opacity: 0.72,
      roughness: 0.6, metalness: 0.0, color: backColour(THEME), alphaMap,
    })
    const sideMat = new THREE.MeshStandardMaterial({
      color: edge, transparent: true, opacity: THEME.edgeSide, roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
      emissive: edgeColour(THEME), emissiveIntensity: THEME.edgeGlow,
    })

    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, THICK),
      [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
    mesh.frustumCulled = false

    const shadowMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(w * (1 + 2 * SHADOW_PAD), h * (1 + 2 * SHADOW_PAD)),
      new THREE.MeshBasicMaterial({ map: shadowTex(aspect), transparent: true,
                                    opacity: THEME.shadow, depthWrite: false }))
    shadowMesh.position.set(0, 0, -THICK / 2 - 0.004)
    shadowMesh.visible = THEME.shadow > 0
    shadowMesh.frustumCulled = false
    mesh.add(shadowMesh)

    const reflMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, rh),
      new THREE.MeshBasicMaterial({ map: reflTexFrom(im, THEME), transparent: true, opacity: THEME.reflOpacity }))
    reflMesh.position.set(0, -(h + rh) / 2, THICK / 2 + 0.002)
    reflMesh.frustumCulled = false
    mesh.add(reflMesh)

    ring.add(mesh)
    mesh.userData.restOpacity = mesh.material.map((m) => m.opacity)
    // The image and the two theme-driven meshes ride along: a switch has to
    // repaint the floor plane and recolour the slab, and neither is reachable
    // from the mesh alone once the ring is built.
    const card = { _slot: i, _mesh: mesh, entry: src.entry, _img: im, _refl: reflMesh,
                   _glass: glassMat, _side: sideMat, _back: backMat, _face: faceMat,
                   _shadow: shadowMesh }
    mesh.userData.card = card
    return card
  })

  spin = target = slotSpin(CARDS[0])
  placePanels()
  frame()
}

const cv = renderer.domElement

cv.addEventListener('pointerdown', (e) => {
  if (dragging || !e.isPrimary || !CARDS.length) return
  dragging = true; moved = 0; activeId = e.pointerId
  dragFrom = e.clientX; spinFrom = spin
  document.body.classList.add('dragging')
})

addEventListener('pointermove', (e) => {
  if (!dragging || e.pointerId !== activeId) return
  const dx = e.clientX - dragFrom
  moved = Math.max(moved, Math.abs(dx))
  // Negated so the ring travels WITH the hand.
  spin = target = spinFrom - (dx / (innerWidth / 3)) * ((Math.PI * 2) / COUNT)
})

function endDrag(e) {
  if (!dragging || (e && e.pointerId !== activeId)) return
  dragging = false; activeId = null
  document.body.classList.remove('dragging')
  lastDragEnd = performance.now(); lastDragMoved = moved
  target = nearest(spin)
}
addEventListener('pointerup', endDrag)
addEventListener('pointercancel', endDrag)

const raycaster = new THREE.Raycaster()
const ndc = new THREE.Vector2()
cv.addEventListener('click', (e) => {
  if (lastDragMoved > 6 && performance.now() - lastDragEnd < 300) return
  ndc.x = (e.clientX / innerWidth) * 2 - 1
  ndc.y = -(e.clientY / innerHeight) * 2 + 1
  raycaster.setFromCamera(ndc, camera)
  const hit = raycaster.intersectObjects(ring.children, false)[0]
  if (!hit || !hit.object.userData.card) return
  const card = hit.object.userData.card
  // A card off to the side turns to face you first; only one already at the
  // centre acts. Same contract as the rings on Oli's page, so a card never
  // takes you somewhere you had not squarely looked at.
  const centred = Math.abs(slotSpin(card) - spin) < 0.01
  if (centred && card.entry && card.entry.href) {
    // replace(), not assign(): this page is shown inside the ring's card
    // overlay, and pushing onto the top-level history would swallow the BACK
    // that closes it.
    location.replace(card.entry.href)
    return
  }
  target = nearest(slotSpin(card))
})

addEventListener('keydown', (e) => {
  if (!CARDS.length) return
  const step = (Math.PI * 2) / COUNT
  if (e.key === 'ArrowLeft')  target = nearest(target + step * 0.6)
  if (e.key === 'ArrowRight') target = nearest(target - step * 0.6)
  if (e.key === 'Escape') goBack()
})

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

const counterEl = document.getElementById('counter')
let shownIdx = -1

function frame() {
  spin += (target - spin) * 0.16
  if (Math.abs(target - spin) < 0.0001) spin = target
  placePanels()

  let front = CARDS[0], bestD = Infinity
  const halfStep = Math.PI / COUNT
  CARDS.forEach((card) => {
    const off = (card._slot / COUNT) * Math.PI * 2 + spin - Math.PI / 2
    const d = Math.abs(Math.atan2(Math.sin(off), Math.cos(off)))
    if (d < bestD) { bestD = d; front = card }

    // The card at the centre goes fully opaque; the rest sit back at their
    // resting translucency. Driven by distance from centre rather than by the
    // click itself, so it is the same whether you clicked it, dragged to it or
    // arrowed to it — and it eases rather than snapping, because the ring
    // easing into place and the card solidifying should be one movement.
    const k = Math.max(0, 1 - d / halfStep)
    const e = k * k * (3 - 2 * k)                       // smoothstep
    const rest = card._mesh.userData.restOpacity
    card._mesh.material.forEach((m, mi) => {
      m.opacity = rest[mi] + (1 - rest[mi]) * e
    })
  })
  if (front._slot !== shownIdx) {
    shownIdx = front._slot
    counterEl.textContent = String(shownIdx + 1).padStart(2, '0') + ' / ' + COUNT
  }

  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}

// Embedded in the ring's card overlay, history.back() drives the PARENT's
// history, which trips its popstate handler and closes the overlay — the same
// contract oli.html's own BACK keeps. Standalone, though — opened directly or
// refreshed into — there is no entry behind this page and back() does nothing,
// so the button steps back one room instead of sitting dead.
const BACK_TO = 'sketches.html'
function goBack() {
  if (window !== window.top) { try { window.parent.history.back(); return } catch (e) {} }
  if (history.length > 1) history.back(); else location.replace(BACK_TO)
}
// ── Switching rooms ─────────────────────────────────────────────────────────
// Everything the scene was given at build time has to be handed back: the
// background canvas, the fog, the environment map the materials sample, the
// lights, the exposure, and then per card the slab's two materials and the
// floor plane's texture. restOpacity is rewritten too — the frame loop eases
// each card from its resting opacity toward solid, so a stale rest value would
// leave the ring easing toward the OTHER room's edge.
function applyTheme(name) {
  THEME = THEMES[name] || THEMES.dark
  document.body.classList.toggle('light', name === 'light')

  paintBg(THEME); bgTex.needsUpdate = true
  if (scene.fog) scene.fog.color.set(THEME.fog)
  envScene.background.set(THEME.env); rebuildEnv()
  hemi.color.set(THEME.hemi[0]); hemi.groundColor.set(THEME.hemi[1]); hemi.intensity = THEME.hemi[2]
  rimLight.color.set(THEME.rim[0]); rimLight.intensity = THEME.rim[1]
  keyLight.intensity = THEME.key
  renderer.toneMappingExposure = THEME.exposure

  const edge = edgeColour(THEME)
  CARDS.forEach((card) => {
    ;[['_glass', 'edgeFace'], ['_side', 'edgeSide']].forEach(([k, op]) => {
      const m = card[k]
      if (!m) return
      m.color.copy(edge)
      m.emissive.copy(edge)
      m.emissiveIntensity = THEME.edgeGlow
      m.opacity = THEME[op]
      m.needsUpdate = true
    })
    if (card._shadow) {
      card._shadow.material.opacity = THEME.shadow
      card._shadow.visible = THEME.shadow > 0
    }
    if (card._face) {
      card._face.opacity = THEME.face
      card._face.envMapIntensity = THEME.faceEnv
      card._face.needsUpdate = true
    }
    if (card._back) { card._back.color.copy(backColour(THEME)); card._back.needsUpdate = true }
    if (card._refl) {
      card._refl.material.map.dispose()
      card._refl.material.map = reflTexFrom(card._img, THEME)
      card._refl.material.opacity = THEME.reflOpacity
      card._refl.material.needsUpdate = true
    }
    // Re-read AFTER the opacities above, or the ring eases toward stale values.
    card._mesh.userData.restOpacity = card._mesh.material.map((m) => m.opacity)
  })

  try { localStorage.setItem('oswin.rectangles.theme', name) } catch (e) {}
  document.querySelectorAll('#theme button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.t === name))
  })
}

// ── The control, and its sleep ──────────────────────────────────────────────
// Shown on any sign of life, gone two and a half seconds after the last one, so
// the room is what you are looking at rather than the furniture. Hovering it
// counts as activity, which is what stops it fading out from under the cursor.
const themeEl = document.getElementById('theme')
let sleepT = 0
function wake() {
  themeEl.classList.add('awake')
  clearTimeout(sleepT)
  sleepT = setTimeout(() => themeEl.classList.remove('awake'), 2500)
}
;['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((ev) =>
  addEventListener(ev, wake, { passive: true }))
themeEl.addEventListener('pointerenter', wake)
themeEl.addEventListener('pointermove', (e) => e.stopPropagation())
themeEl.querySelectorAll('button').forEach((b) =>
  b.addEventListener('click', () => { applyTheme(b.dataset.t); wake() }))

// Restored before the ring is built so the first frame is already the right
// room — switching after paint would flash the other one.
let startTheme = 'dark'
try { startTheme = localStorage.getItem('oswin.rectangles.theme') || 'dark' } catch (e) {}
if (!THEMES[startTheme]) startTheme = 'dark'
THEME = THEMES[startTheme]
document.body.classList.toggle('light', startTheme === 'light')
paintBg(THEME); bgTex.needsUpdate = true
envScene.background.set(THEME.env); rebuildEnv()
hemi.color.set(THEME.hemi[0]); hemi.groundColor.set(THEME.hemi[1]); hemi.intensity = THEME.hemi[2]
rimLight.color.set(THEME.rim[0]); rimLight.intensity = THEME.rim[1]
keyLight.intensity = THEME.key
renderer.toneMappingExposure = THEME.exposure
document.querySelectorAll('#theme button').forEach((b) => {
  b.setAttribute('aria-pressed', String(b.dataset.t === startTheme))
})
wake()

document.getElementById('backBtn').onclick = goBack

// Built only once every page has decoded: the ring's radius depends on the
// widest of them, and each card's geometry on its own dimensions, so none of it
// can be laid out before the real sizes are known.
Promise.all(ENTRIES.map((entry) => entry.src
  ? new Promise((res, rej) => {
      const im = new Image()
      im.onload = () => res({ el: im, w: im.naturalWidth, h: im.naturalHeight, entry })
      im.onerror = rej
      im.src = entry.src
    })
  : Promise.resolve((() => {
      const c = makeLabelCanvas(entry)
      return { el: c, w: c.width, h: c.height, entry }
    })())
)).then(build).catch((e) => console.error('rectangles failed to load', e))
</script>
</body>
</html>
