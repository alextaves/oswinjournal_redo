<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oswin Journal</title>
<style>
  /* The phone version of the lobby. The ring is a WebGL scene you spin; there is
     no good phone equivalent, so the same rooms are laid out flat as a grid you
     scroll — built to still read as objects, each sitting on its own shadow with
     a lit top edge and a sheen across the glass.

     Faces are DOM, not the ring's canvas textures: a 600x800 card scaled into a
     ~180px column lands its caption at about 4px. Metrics below are the card
     design in container-query units, so the proportions still hold. */
  :root { --font: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }

  .wrap {
    position: fixed; inset: 0;
    background: #E7E2D8;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    /* viewport-fit=cover with a translucent status bar means this runs edge to
       edge once installed — inset on all four sides so nothing lands under the
       clock, the battery, or the notch in landscape. */
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(10px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(10px + env(safe-area-inset-left));
    font-family: var(--font);
  }
  /* Masthead. Its height is set from the first card's title block in JS, so it
     stands exactly as tall as KARLA IS HERE does on the card beneath it — a
     measurement rather than a number that would drift from the cards. Carries
     the same radius and lift as a card so it sits in the same world. */
  .masthead {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    border-radius: 6px;
    background: #F9FF45; color: #111111;
    font-weight: 700; letter-spacing: -0.01em; line-height: 1;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.30),
      inset 0 -1px 0 rgba(0,0,0,0.20),
      0 2px 3px rgba(0,0,0,0.28),
      0 10px 20px rgba(0,0,0,0.22);
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .card {
    container-type: inline-size;
    position: relative;
    display: flex; flex-direction: column;
    aspect-ratio: 3 / 4;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    /* Raised, not floating: a lit top lip and shaded bottom lip give the face a
       thickness, a short hard shadow sits it on the ground, a long soft one
       lifts it off. */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.30),
      0 2px 3px rgba(0,0,0,0.28),
      0 10px 20px rgba(0,0,0,0.22);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .card::after {
    content: '';
    position: absolute; inset: 0; z-index: 4;
    background: linear-gradient(158deg,
      rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.05) 24%, rgba(255,255,255,0) 48%);
    pointer-events: none;
  }
  .card:active {
    transform: translateY(2px) scale(0.988);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(0,0,0,0.30),
      0 1px 2px rgba(0,0,0,0.28),
      0 4px 9px rgba(0,0,0,0.20);
  }

  .media { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; }
  .dancer, .cardArt { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }
  .slide { position: absolute; inset: 0; z-index: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 900ms ease; }
  .slide.on { opacity: 1; }

  /* Same grain the ring wears over every card, so the two read as one site. */
  .static {
    position: absolute; inset: 0; z-index: 3;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"),
      repeating-linear-gradient(rgba(0,0,0,0.16) 0 1px, rgba(0,0,0,0) 1px 3px);
    background-size: 120px 120px, 100% 3px;
    opacity: 0.22;
    pointer-events: none;
    animation: snow 0.32s steps(1) infinite;
  }
  @keyframes snow {
    0%   { background-position: 0 0, 0 0; }
    25%  { background-position: 37px 61px, 0 0; }
    50%  { background-position: 83px 19px, 0 0; }
    75%  { background-position: 15px 94px, 0 0; }
    100% { background-position: 61px 43px, 0 0; }
  }
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 46%; z-index: 1;
           background: linear-gradient(rgba(0,0,0,0.62), rgba(0,0,0,0)); }
  .scrimFoot { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; z-index: 1;
               background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.55)); }

  .head { position: relative; z-index: 2; padding: 9cqw 9cqw 0; }
  .title { margin: 0; font-weight: 700; line-height: 1.0; letter-spacing: -0.01em; }
  .title span { display: block; }
  .subTitle { margin: 1cqw 0 0; }
  .rule { height: 1px; margin: 2.2cqw 0 2cqw; }
  .sub { margin: 0; font-weight: 300; font-size: max(9.5px, 2.33cqw); letter-spacing: 0.14em; line-height: 1.4; }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 9cqw 7cqw;
    font-weight: 300; font-size: max(9px, 2.2cqw); letter-spacing: 0.14em;
  }

  /* The ring's issue tile, flattened: hash, number, then the Journal mark, on
     one shared clock so every badge turns together. */
  .badge {
    position: absolute; top: 0; right: 0; z-index: 3;
    width: 22cqw; height: 22cqw;
    overflow: hidden;
    font-weight: 700; font-size: 12cqw; line-height: 1;
    box-shadow: -1px 1px 3px rgba(0,0,0,0.35);
  }
  /* Two tiles, one showing. On a turn the live one slides off to the right and
     the next follows it in from the left — the ring's own move, which a straight
     content swap loses. */
  .badge .tile {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 550ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .badge i { display: block; width: 62%; height: 62%; border-radius: 50%; background: currentColor; }
  @media (prefers-reduced-motion: reduce) { .badge .tile { transition: none; } }

  .body {
    position: relative; z-index: 2; flex: 1; min-height: 0;
    padding: 4cqw 9cqw 9cqw;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
    font-weight: 300; font-size: max(8px, 2.6cqw); line-height: 1.55;
    color: rgba(0,0,0,0.62);
  }
  .body p { margin: 0 0 0.9em; }

  /* Enquiries: the ring's card types a message out; at this size that can only
     be a smear, so bars stand in for lines of copy being written. */
  .enq { position: relative; z-index: 2; flex: 1; min-height: 0; padding: 5cqw 9cqw 9cqw; display: flex; flex-direction: column; }
  .enqLabel { display: block; font-weight: 300; font-size: max(7px, 2.33cqw); letter-spacing: 0.16em; color: rgba(0,0,0,0.5); }
  .enqCopy { margin: 3.5cqw 0 0; flex: 1; min-height: 0; overflow: hidden;
             mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
             -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%); }
  .copyLine { display: block; height: max(3px, 1.5cqw); margin-bottom: max(3.5px, 1.7cqw);
              background: rgba(0,0,0,0.17); border-radius: 1px;
              transform-origin: left center; transform: scaleX(0);
              transition: transform 1300ms cubic-bezier(0.22,0.8,0.3,1); }
  .copyBreak { margin-top: max(5px, 2.4cqw); }
  .enqSubmit { margin-top: auto; }

  .subscribe {
    display: block; margin: 26px auto calc(6px + env(safe-area-inset-bottom));
    background: none; border: none; padding: 0 0 3px;
    font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: 0.22em;
    color: rgba(0,0,0,0.82); border-bottom: 1px solid rgba(0,0,0,0.82);
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Sheets ───────────────────────────────────────────────────────────── */
  .sheet {
    position: fixed; inset: 0; z-index: 60;
    background: #E7E2D8; color: #111;
    overflow-y: auto; touch-action: pan-y;
    padding: calc(28px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
             calc(28px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    font-family: var(--font);
  }
  .sheet.teal { background: #00C2A8; }
  /* A room: a sheet that holds a grid rather than a passage, so it takes the
     lobby's own gutter and lets its cards do the work. */
  .sheet.room { padding-left: calc(10px + env(safe-area-inset-left)); padding-right: calc(10px + env(safe-area-inset-right)); }
  .sheet.room .actions { justify-content: center; margin-top: 22px; }
  .sheet h2 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet .sheetSub { margin: 10px 0 30px; font-size: 13px; font-weight: 300; letter-spacing: 0.1em;
                     text-transform: uppercase; color: rgba(0,0,0,0.62); }
  .sheet p.copy { margin: 0 0 1.1em; font-weight: 300; font-size: 15px; line-height: 1.62; color: rgba(0,0,0,0.82); }
  .sheet label { display: block; margin-bottom: 22px; font-size: 12px; letter-spacing: 0.1em; color: rgba(0,0,0,0.62); }
  .sheet input, .sheet textarea {
    display: block; width: 100%; margin-top: 8px;
    background: none; border: none; border-bottom: 1px solid rgba(0,0,0,0.35);
    padding: 6px 0; font-family: var(--font); font-size: 16px; color: #111; border-radius: 0;
  }
  .sheet textarea { min-height: 120px; resize: vertical; }
  .sheet input:focus, .sheet textarea:focus { outline: none; border-bottom-color: #111; }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
  .sheet button, .sheet a.act {
    background: none; border: none; padding: 0 0 3px; cursor: pointer; text-decoration: none;
    font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #111;
    border-bottom: 1px solid #111;
  }
  .sheet button.close { font-weight: 300; color: rgba(0,0,0,0.5); border-bottom: none; }
  .sheet ol.steps {
    margin: 0 0 8px; padding-left: 1.3em;
    font-weight: 300; font-size: 15px; line-height: 1.62; color: rgba(0,0,0,0.82);
  }
  .sheet ol.steps li { margin-bottom: 0.7em; padding-left: 0.2em; }
  .sheet p.close-note { margin-top: 30px; }
  .sheet .status { margin: 14px 0 0; font-size: 12px; color: rgba(0,0,0,0.62); }
  /* Interview furniture: the portrait leads, section heads break the piece up,
     and a question sits in the card-title weight so the answer reads as reply. */
  .sheet .portrait { display: block; width: 100%; height: auto; border-radius: 6px; margin-bottom: 26px; }
  .sheet h3.section {
    margin: 34px 0 16px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(0,0,0,0.62);
  }
  .sheet p.deck {
    margin: -18px 0 26px; font-size: 15px; font-weight: 300;
    line-height: 1.5; color: rgba(0,0,0,0.6);
  }
  .sheet p.disclosure {
    margin: 0 0 30px;
    padding: 18px 0;
    border-top: 1px solid rgba(0,0,0,0.30);
    border-bottom: 1px solid rgba(0,0,0,0.30);
    font-size: 14px; font-weight: 400; line-height: 1.55;
    letter-spacing: 0; color: rgba(0,0,0,0.78);
  }
  .sheet p.q {
    margin: 26px 0 10px; font-size: 15px; font-weight: 700;
    line-height: 1.45; letter-spacing: -0.01em; color: #111;
  }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) { .static { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead" id="masthead">OSWIN JOURNAL</div>
  <div class="grid" id="grid"></div>
  <button class="subscribe" type="button" id="subscribeBtn">SUBSCRIBE</button>
</div>

<script src="covers.js"></script>
<script src="fiction_stories.js"></script>
<script src="interviews.js"></script>
<script>
// Where the React app lives. Same reasoning as the ring: in dev Vite serves the
// app at "/" and this page at /carousel/mobile.html; in production Netlify
// serves the ring at "/" and the app under /journal/.
const JOURNAL_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? '/' : '/journal/'
const LIVE_ISSUE = (n) => `${JOURNAL_BASE}?issue=${n}`
const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xvgevdda'

// The site's yellow: the badge's third state, the masthead, and the interviews
// card all sit on this one value.
const BADGE_YELLOW = '#F9FF45'

// The read-me card. Blue because it has to pull the eye without fighting the
// yellow it sits beside — blue and yellow are complements, where red and yellow
// are two warm colours competing for the same attention. This is the blue
// already on the site (Karla's title), so nothing new enters the palette.
const READ_ME_BG = '#1E2BFF'

const OSWIN_JOURNAL_BODY = [
  "Oswin Journal is a browser built as a gallery. Each issue is a room you enter, not a page you scroll. It began around a simple pairing, a piece of music sat beside a piece of visual art, and it has since loosened into something harder to name and closer to the truth: a curation of things that intrigue me. Sound, image, fiction, whatever the issue asks for.",
  "I've done this in physical space before. I curated Oswald Gallery in Hamilton, Ontario, which the New York Times found within its first six months. Oswin is the same eye moved onto the web, except the web can do something a white room cannot: the space itself can respond, hold sound, change as you move through it.",
  "There is no feed here, no infinite anything, no next. An issue is made, and then it is finished, and then you can stand in it. You came in through a door. You can stay as long as you like.",
]

const ALEX_TAVES_BIO = [
  "Alex Taves builds rooms on the internet, part of what he calls the Slow Web, and his gut says the web is only beginning. He started in fashion, twelve years as art director to Joseph Mimran, then got pulled into the art world and opened a gallery in Hamilton, Ontario. It took off, earned a nod from The New York Times, then crashed. The crash mattered: it opened a whole new world. Out of desperation he learned to code, and React, the framework Netflix runs on, became an obsession. It seemed wildly untapped as a medium for art.",
  "Canadian by birth, Melburnian by choice. His goal is to bridge art and the net. To Alex, platforms like Instagram already feel dated. It's time to evolve into the humans we could be: not desperate for likes, not dictated to by an algorithm.",
]

// Interviews. The Substack post's own furniture — the share button, the sign-off
// link — is left out; what is kept is the writing.

// Add-to-home-screen instructions. Kept to two paths and three steps each —
// anything longer and nobody follows it.
const READ_ME = {
  title: 'PLEASE READ',
  sub: 'Put Oswin on Your Home Screen',
  lead: [
    "Oswin is built to be stood inside, not scrolled past. Saved to your home screen it opens like an app — full screen, no address bar, no browser furniture between you and the room.",
    "It takes about ten seconds.",
  ],
  paths: [
    { heading: 'On iPhone', steps: [
      'Tap the share button at the bottom of Safari — the square with an arrow coming out of it.',
      'Scroll down the list and tap Add to Home Screen.',
      'Tap Add, top right.',
    ] },
    { heading: 'On Android', steps: [
      'Tap the three dots at the top right of Chrome.',
      'Tap Add to Home screen, or Install app.',
      'Tap Install.',
    ] },
  ],
  close: 'Now open it from the icon rather than the browser. Headphones on, lights off.',
}

function openReadMe() {
  const sh = document.createElement('div')
  sh.className = 'sheet'
  sh.innerHTML =
    `<h2>${READ_ME.title}</h2><p class="sheetSub">${READ_ME.sub}</p>` +
    READ_ME.lead.map(p => `<p class="copy">${p}</p>`).join('') +
    READ_ME.paths.map(path =>
      `<h3 class="section">${path.heading}</h3><ol class="steps">` +
      path.steps.map(t => `<li>${t}</li>`).join('') + '</ol>'
    ).join('') +
    `<p class="copy close-note">${READ_ME.close}</p>` +
    '<div class="actions"><button type="button" class="close">CLOSE</button></div>'
  sh.querySelector('.close').addEventListener('click', () => history.back())
  mountSheet(sh)
}

// The four issues in order, then the rooms that are not issues.
const CARDS = [
  { id: 'readme', kind: 'plain', title: 'PLEASE READ', lines: ['PLEASE', 'READ'],
    sub: 'Put Oswin on Your Home Screen', bg: READ_ME_BG, light: true, open: openReadMe },

  { id: 'karla',  kind: 'video', badge: 1, src: 'videos/mobile/karla.mp4',
    title: 'KARLA IS HERE', lines: ['KARLA', 'IS HERE'], foot: 'visuals by oswin',
    bg: '#12151b', open: () => location.href = LIVE_ISSUE(1) },
  { id: 'chris',  kind: 'video', badge: 2, src: 'videos/mobile/chris.mp4',
    title: 'CHRISTOPHER BISSONNETTE', lines: ['CHRIS-', 'TOPHER', 'BISSON-', 'NETTE'], foot: 'visuals by oswin',
    bg: '#12151b', open: () => location.href = LIVE_ISSUE(2) },
  { id: 'arnold', kind: 'slides', badge: 3,
    slides: ['green', 'orange', 'purple', 'red'].map(c => `images/mobile/giftshop-${c}.jpg`),
    title: 'ARNOLD SCHOENBERG', lines: ['ARNOLD', 'SCHOEN-', 'BERG'], foot: 'visuals by oswin',
    bg: '#777777', open: () => location.href = LIVE_ISSUE(3) },
  { id: 'oli',    kind: 'video', badge: 4, src: 'videos/mobile/oli.mp4',
    title: 'OLI GOLDSMITH', lines: ['OLI', 'GOLD-', 'SMITH'], foot: 'audio by karla is here',
    // Set at the name's own size, so it is measured alongside the name and both
    // land at one size that fits. Broken by hand — there is no space to break at.
    subLines: ['UNDER', 'CONSTRUC-', 'TION'], subColor: BADGE_YELLOW,
    bg: '#12151b', open: () => location.href = 'oli.html' },

  // Same treatment as the Oswin Journal card — flat ground, title, caption — on
  // the site's own yellow, the one the badges and the masthead already use.
  // No copy for it yet, so it carries no body and opens nothing.
  // Title and caption only — the writing lives in the room, not on the way in.
  { id: 'interviews', kind: 'plain', title: 'INTERVIEWS', lines: ['INTER-', 'VIEWS'],
    sub: 'Karla Is Here · Christopher Bissonnette · Arnold Schoenberg',
    bg: BADGE_YELLOW, open: openInterviews },

  { id: 'journal', kind: 'body', title: 'OSWIN JOURNAL', lines: ['OSWIN', 'JOURNAL'],
    sub: 'A Browser Built as a Gallery', bg: '#D4D2CB', body: OSWIN_JOURNAL_BODY,
    open: () => openSheet({ title: 'OSWIN JOURNAL', sub: 'a browser built as a gallery', paras: OSWIN_JOURNAL_BODY }) },
  { id: 'fiction', kind: 'plain', title: 'FICTION', lines: ['FICTION'],
    sub: 'Sci Fi Meets Absurdism', bg: '#FF5F00', light: true, open: openFiction },
  { id: 'alex',   kind: 'photo', title: 'ALEXANDER TAVES', lines: ['ALEXANDER', 'TAVES'],
    sub: 'Oswin Curator', bg: '#0a0a0a', src: 'cards/alexander.png',
    open: () => openSheet({
      title: 'ALEXANDER TAVES', sub: 'oswin curator', paras: ALEX_TAVES_BIO,
      actions: [{ label: 'SUBSCRIBE', run: openSubscribe }, { label: 'ALEXTAVES.COM', href: 'https://alextaves.com' }],
    }) },
  { id: 'enquiries', kind: 'enq', title: 'ENQUIRIES', lines: ['ENQUIRIES'],
    sub: 'Get in Touch · Looking for Like Minded', bg: '#00C2A8', open: openEnquiries },
]

// The fiction ring's cards, brought over from alextaves.com — the room FICTION
// has been pointing at without having. Four have covers; the rest are announced
// but unwritten. Built only when the room is opened, so the lobby grid never
// pays for these files.
// The stories themselves, carried over from the fiction ring on alextaves.com.
// Only three are written; the rest of the room is announced but empty.

const FICTION_CARDS = [
  { id: 'hum',    kind: 'video', src: 'videos/fiction/hum.mp4',
    lines: ['HUM'], sub: 'Broken Sign', bg: '#0c0c0c' },
  { id: 'elon',   kind: 'image', src: 'images/fiction/elon.jpg',
    lines: ["ELON'S", 'IN MY', 'ELEVATOR'], sub: 'Floor 41', bg: '#1a1a1a' },
  { id: 'siphon', kind: 'video', src: 'videos/fiction/siphon.mp4',
    lines: ['SIPHON'], sub: 'Falling Dots', bg: '#05061a' },
  { id: 'knife',  kind: 'video', src: 'videos/fiction/knife.mp4',
    lines: ['CASUAL', 'KNIFE', 'FIGHT'], bg: '#C9A400' },
  { id: 'grafting', kind: 'plain', lines: ['GRAFT-', 'ING'], sub: 'Synthetic to Organic', bg: '#046A38', light: true, rope: true },
  { id: 'boogie',   kind: 'plain', lines: ['BOOGIE'],        bg: '#582C83', light: true, dancer: true },
  { id: 'cbc',      kind: 'plain', lines: ['CBC'],           sub: 'The One-Way Glass Incident', bg: '#E4002B', light: true, gem: true },
  { id: 'dorthy',   kind: 'plain', lines: ['DORTHY', 'SOTH-', 'ERBY'], sub: 'Waiting for Applause', bg: '#F37021', light: true, star: true },
]

// An interview reads like an issue: the portrait, then the writing, then the
// questions. Same sheet the journal write-up uses, with the Q&A set apart so
// you can see where the conversation starts.
function openInterview(iv) {
  const sh = document.createElement('div')
  sh.className = 'sheet'
  sh.innerHTML =
    `<img class="portrait" src="${iv.portrait}" alt="">` +
    `<h2>${iv.title}</h2><p class="sheetSub">${iv.sub}</p>` +
    (iv.deck ? `<p class="deck">${iv.deck}</p>` : '') +
    // A standing head, not a footnote: it sits above the piece, in the reading
    // size, so it is read rather than skipped.
    (iv.disclosure ? `<p class="disclosure">${iv.disclosure}</p>` : '') +
    iv.intro.map(p => `<p class="copy">${p}</p>`).join('') +
    (iv.sections || []).map(sec =>
      `<h3 class="section">${sec.heading}</h3>` + sec.paras.map(p => `<p class="copy">${p}</p>`).join('')
    ).join('') +
    `<h3 class="section">${iv.qaLead}</h3>` +
    iv.qa.map(x => (x.q ? `<p class="q">${x.q}</p>` : '') + (x.a ? `<p class="copy">${x.a}</p>` : '')).join('') +
    '<div class="actions"><button type="button" class="close">CLOSE</button></div>'
  sh.querySelector('.close').addEventListener('click', () => history.back())
  mountSheet(sh, () => openInterviews(false))
}

function openInterviews(push = true) {
  const sh = document.createElement('div')
  sh.className = 'sheet room'
  sh.innerHTML = `<div class="masthead" style="background:${BADGE_YELLOW};color:#111111">INTERVIEWS</div>` +
                 '<div class="grid"></div>' +
                 '<div class="actions"><button type="button" class="close">CLOSE</button></div>'
  const g = sh.querySelector('.grid')
  INTERVIEWS_BY_ISSUE.forEach((iv) => g.appendChild(buildCard({
    id: iv.id, kind: 'image', src: iv.portrait,
    lines: iv.cardLines, sub: iv.sub, bg: '#1a1a1a',
    open: () => openInterview(iv),
  })))
  sh.querySelector('.close').addEventListener('click', () => history.back())
  mountSheet(sh, null, push)
  applyMastheadMetrics(sh.querySelector('.masthead'))
}

function openFiction(push = true) {
  const s = document.createElement('div')
  s.className = 'sheet room'
  s.innerHTML = '<div class="masthead" style="background:#FF5F00;color:#111111">FICTION</div>' +
                '<div class="grid"></div>' +
                '<div class="actions"><button type="button" class="close">CLOSE</button></div>'
  const g = s.querySelector('.grid')
  // A card with a story behind it opens it; the rest of the room stays a promise.
  FICTION_CARDS.forEach((c) => {
    const story = FICTION_STORIES[c.id]
    g.appendChild(buildCard(story
      ? { ...c, open: () => openSheet({ title: story.title, sub: c.sub, paras: story.paras,
                                        onBack: () => openFiction(false) }) }
      : c))
  })
  s.querySelector('.close').addEventListener('click', () => history.back())
  mountSheet(s, null, push)
  applyMastheadMetrics(s.querySelector('.masthead'))
}


// ── Title fitting ─────────────────────────────────────────────────────────────
// The ring shrinks a title until it fits (titleLayout). CSS has no
// shrink-to-fit, so the same measure runs once against the same 600x800 design
// and converts to container-query units, and the break-up is given by hand so
// every card in the grid reads at one size.
const DESIGN_W = 600, DESIGN_MARGIN = 54
const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif"
function fitTitle(lines) {
  const ctx = document.createElement('canvas').getContext('2d')
  const maxW = DESIGN_W - DESIGN_MARGIN * 2
  let size = 74
  for (; size >= 20; size -= 2) {
    ctx.font = `700 ${size}px ${FONT}`
    ctx.letterSpacing = '-0.01em'
    if (Math.max(...lines.map(l => ctx.measureText(l).width)) <= maxW) break
  }
  return (size / DESIGN_W) * 100
}

// ── Badge ─────────────────────────────────────────────────────────────────────
const BADGE_STYLES = [
  { kind: 'hash',   bg: '#111111', fg: '#FFFFFF' },
  { kind: 'number', bg: BADGE_YELLOW, fg: '#111111' },
  { kind: 'circle', bg: '#FFFFFF', fg: BADGE_YELLOW },
]
const BADGE_HOLD_MS = 3000
const badgeEls = []
let badgeIdx = 0

function paintTile(tile, style, num) {
  tile.style.background = style.bg
  tile.style.color = style.fg
  tile.innerHTML = style.kind === 'circle' ? '<i></i>' : (style.kind === 'hash' ? '#' : String(num))
}

function makeBadge(num) {
  const el = document.createElement('div')
  el.className = 'badge'
  const a = document.createElement('div'); a.className = 'tile'
  const b = document.createElement('div'); b.className = 'tile'
  a.style.transform = 'translateX(0)'
  b.style.transform = 'translateX(-100%)'
  paintTile(a, BADGE_STYLES[0], num)
  el.append(a, b)
  badgeEls.push({ el, num, tiles: [a, b], live: 0 })
  return el
}

// Turn every badge together: paint the incoming tile, park it off to the left
// without a transition, then let both run.
function turnBadges(toIdx) {
  const st = BADGE_STYLES[toIdx]
  badgeEls.forEach((b) => {
    const cur = b.tiles[b.live]
    const next = b.tiles[1 - b.live]
    paintTile(next, st, b.num)
    next.style.transition = 'none'
    next.style.transform = 'translateX(-100%)'
    void next.offsetWidth          // commit the parked position before animating
    next.style.transition = ''
    cur.style.transform = 'translateX(100%)'
    next.style.transform = 'translateX(0)'
    b.live = 1 - b.live
  })
}

// Ragged widths on purpose: equal bars read as a loading skeleton, uneven ones
// read as prose. The short line is a paragraph ending.
const COPY_LINES = [100, 96, 99, 92, 100, 88, 54, 97, 100, 84, 91, 63]
const COPY_BREAK_AFTER = 6

// ── Build ─────────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid')

function buildCard(card) {
  const el = document.createElement('div')
  el.className = 'card'
  el.style.background = card.bg
  const overPhoto = card.kind === 'video' || card.kind === 'photo' || card.kind === 'image' || card.kind === 'slides'
  const ink = card.ink || (overPhoto || card.light ? 'rgba(255,255,255,0.94)' : 'rgba(0,0,0,0.88)')
  const inkSub = overPhoto || card.light ? 'rgba(255,255,255,0.62)' : 'rgba(0,0,0,0.50)'
  const inkRule = overPhoto || card.light ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.22)'

  if (card.kind === 'video') {
    const v = document.createElement('video')
    v.className = 'media'
    v.src = card.src
    v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto'
    v.setAttribute('webkit-playsinline', '')
    // iOS only allows inline autoplay on a genuinely muted element, and the
    // property has to be set on the element, not just implied by an attribute.
    v.muted = true; v.defaultMuted = true
    const play = () => v.play().catch(() => {})
    play()
    // Low Power Mode refuses outright; the first touch is a gesture to retry on.
    window.addEventListener('touchstart', play, { once: true, passive: true })
    document.addEventListener('visibilitychange', play)
    el.appendChild(v)
  }

  if (card.kind === 'slides') {
    // Issue 3 has no film of its own — its stills cross-fade instead, which is
    // the same slideshow the ring's card runs.
    const layers = card.slides.map((src, i) => {
      const d = document.createElement('div')
      d.className = 'slide' + (i === 0 ? ' on' : '')
      d.style.backgroundImage = `url('${src}')`
      el.appendChild(d)
      return d
    })
    let si = 0
    setInterval(() => {
      layers[si].classList.remove('on')
      si = (si + 1) % layers.length
      layers[si].classList.add('on')
    }, 3200)
  }

  if (card.kind === 'image') {
    const d = document.createElement('div')
    d.className = 'slide on'
    d.style.backgroundImage = `url('${card.src}')`
    el.appendChild(d)
  }

  if (card.kind === 'photo') {
    const d = document.createElement('div')
    d.className = 'slide on'
    d.style.backgroundImage = `url('${card.src}')`
    d.style.filter = 'grayscale(1) contrast(1.2) brightness(0.95)'
    el.appendChild(d)
  }

  if (overPhoto) {
    el.insertAdjacentHTML('beforeend', '<div class="scrim"></div>')
    if (card.foot) el.insertAdjacentHTML('beforeend', '<div class="scrimFoot"></div>')
    el.insertAdjacentHTML('beforeend', '<div class="static"></div>')
  }

  const head = document.createElement('div')
  head.className = 'head'
  head.innerHTML =
    `<h2 class="title" style="color:${ink};font-size:${fitTitle([...card.lines, ...(card.subLines || [])])}cqw">` +
    card.lines.map(l => `<span>${l}</span>`).join('') + '</h2>' +
    `<div class="rule" style="background:${inkRule}"></div>` +
    (card.subLines
      ? `<h3 class="title subTitle" style="color:${card.subColor || inkSub};font-size:${fitTitle([...card.lines, ...card.subLines])}cqw">`
        + card.subLines.map(l => `<span>${l}</span>`).join('') + '</h3>'
      : card.sub ? `<p class="sub" style="color:${card.subColor || inkSub}">${card.sub}</p>` : '')
  el.appendChild(head)

  if (card.foot) {
    el.insertAdjacentHTML('beforeend', `<div class="foot" style="color:${inkSub}">${card.foot}</div>`)
  }

  if (card.kind === 'body') {
    const b = document.createElement('div')
    b.className = 'body'
    b.innerHTML = card.body.map(p => `<p>${p}</p>`).join('')
    el.appendChild(b)
  }

  if (card.kind === 'enq') el.appendChild(buildEnquiryPreview())

  if (card.dancer) mountDancer(el)
  if (card.rope) mountRope(el)
  if (card.gem) mountGem(el)
  if (card.star) mountStar(el)

  if (card.badge) el.appendChild(makeBadge(card.badge))

  if (card.open) el.addEventListener('click', card.open)
  return el
}

CARDS.forEach((card) => grid.appendChild(buildCard(card)))

setInterval(() => {
  badgeIdx = (badgeIdx + 1) % BADGE_STYLES.length
  turnBadges(badgeIdx)
}, BADGE_HOLD_MS)

// Every masthead — the lobby's and each room's — takes its height and type size
// from the LOBBY's first card title. Measuring each room against its own first
// card made fiction a thinner band than the rest, because HUM is one line where
// PLEASE READ and KARLA IS HERE are two. Still measured rather than hardcoded,
// so it tracks the cards through a rotation or a change of columns.
const masthead = document.getElementById('masthead')
function applyMastheadMetrics(el) {
  const title = grid.querySelector('.card .title')
  if (!title || !el) return
  el.style.height = title.getBoundingClientRect().height + 'px'
  el.style.fontSize = getComputedStyle(title).fontSize
}
function sizeMastheads() {
  document.querySelectorAll('.masthead').forEach(applyMastheadMetrics)
}
sizeMastheads()
addEventListener('resize', sizeMastheads)
if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeMastheads)

// ── Enquiry preview ───────────────────────────────────────────────────────────
function buildEnquiryPreview() {
  const wrap = document.createElement('div')
  wrap.className = 'enq'
  const copy = document.createElement('div')
  copy.className = 'enqCopy'
  const bars = COPY_LINES.map((w, i) => {
    const s = document.createElement('span')
    s.className = 'copyLine' + (i === COPY_BREAK_AFTER ? ' copyBreak' : '')
    s.style.width = w + '%'
    copy.appendChild(s)
    return s
  })
  wrap.innerHTML = '<span class="enqLabel">message</span>'
  wrap.appendChild(copy)
  wrap.insertAdjacentHTML('beforeend', '<span class="enqLabel enqSubmit">submit</span>')

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let n = 0
    setInterval(() => {
      if (n >= bars.length) { n = 0; bars.forEach(b => b.style.transform = 'scaleX(0)'); return }
      bars[n].style.transform = 'scaleX(1)'
      n++
    }, 1500)
  } else {
    bars.forEach(b => b.style.transform = 'scaleX(1)')
  }
  return wrap
}

// ── Sheets ────────────────────────────────────────────────────────────────────
function removeSheet() {
  document.querySelector('.sheet')?.remove()
}
function closeSheet() { removeSheet() }

// A sheet opened from a room remembers how to put that room back, so closing a
// story returns you to fiction rather than all the way out to the grid. The
// room is remounted without pushing history — we are stepping back onto the
// entry that opened it, not adding another.
function mountSheet(node, onBack, push = true) {
  removeSheet()
  node._onBack = onBack || null
  document.body.appendChild(node)
  if (push) history.pushState({ sheet: true }, '')
}

window.addEventListener('popstate', () => {
  const sheet = document.querySelector('.sheet')
  if (!sheet) return
  const back = sheet._onBack
  sheet.remove()
  if (back) back()
})

function openSheet({ title, sub, paras, actions = [], onBack }) {
  const s = document.createElement('div')
  s.className = 'sheet'
  s.innerHTML =
    `<h2>${title}</h2>` + (sub ? `<p class="sheetSub">${sub}</p>` : '') +
    paras.map(p => `<p class="copy">${p}</p>`).join('') +
    '<div class="actions"></div>'
  const row = s.querySelector('.actions')
  actions.forEach((a) => {
    if (a.href) {
      row.insertAdjacentHTML('beforeend', `<a class="act" href="${a.href}" target="_blank" rel="noopener">${a.label}</a>`)
    } else {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = a.label
      b.addEventListener('click', a.run); row.appendChild(b)
    }
  })
  const close = document.createElement('button')
  close.type = 'button'; close.className = 'close'; close.textContent = 'CLOSE'
  close.addEventListener('click', () => history.back())
  row.appendChild(close)
  mountSheet(s, onBack)
}

// Both forms post to the site's existing Formspree, tagged by subject so
// subscriptions and enquiries stay separable in the inbox.
async function postForm(payload, status) {
  status.textContent = 'sending…'
  try {
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
    })
    status.textContent = res.ok ? 'thank you — it is on its way.' : 'that did not go through. try again in a moment.'
    return res.ok
  } catch {
    status.textContent = 'that did not go through. try again in a moment.'
    return false
  }
}

function openSubscribe() {
  const s = document.createElement('div')
  s.className = 'sheet'
  s.innerHTML =
    '<h2>SUBSCRIBE</h2><p class="sheetSub">the journal, when there is an issue</p>' +
    '<form><label>EMAIL:<input type="email" name="email" autocomplete="email" required></label>' +
    '<p class="status"></p><div class="actions">' +
    '<button type="submit">SUBMIT</button>' +
    '<button type="button" class="close">CLOSE</button></div></form>'
  s.querySelector('.close').addEventListener('click', () => history.back())
  s.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const ok = await postForm({ email: e.target.email.value.trim(), _subject: 'Subscribe' }, s.querySelector('.status'))
    if (ok) e.target.reset()
  })
  mountSheet(s)
}

function openEnquiries() {
  const s = document.createElement('div')
  s.className = 'sheet teal'
  s.innerHTML =
    '<h2>ENQUIRIES</h2><p class="sheetSub">get in touch · looking for like minded</p>' +
    '<form><label>NAME:<input type="text" name="name" autocomplete="name" required></label>' +
    '<label>EMAIL:<input type="email" name="email" autocomplete="email" required></label>' +
    '<label>MESSAGE:<textarea name="message" required></textarea></label>' +
    '<p class="status"></p><div class="actions">' +
    '<button type="submit">SUBMIT</button>' +
    '<button type="button" class="close">CLOSE</button></div></form>'
  s.querySelector('.close').addEventListener('click', () => history.back())
  s.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const f = e.target
    const name = f.name.value.trim()
    const ok = await postForm(
      { name, email: f.email.value.trim(), message: f.message.value.trim(), _subject: `Enquiry from ${name}` },
      s.querySelector('.status'))
    if (ok) f.reset()
  })
  mountSheet(s)
}

document.getElementById('subscribeBtn').addEventListener('click', openSubscribe)
</script>
