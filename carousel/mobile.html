<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The browser's own bars take the paper too, so the chrome above and
     below the page is not a white edge around it. Only this view: the
     ring sits on black and sets its own. -->
<meta name="theme-color" content="#E7E2D8">
<title>Oswin Journal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  /* The phone version of the lobby. The ring is a WebGL scene you spin; there is
     no good phone equivalent, so the same rooms are laid out flat as a grid you
     scroll — built to still read as objects, each sitting on its own shadow with
     a lit top edge and a sheen across the glass.

     Faces are DOM, not the ring's canvas textures: a 600x800 card scaled into a
     ~180px column lands its caption at about 4px. Metrics below are the card
     design in container-query units, so the proportions still hold. */
  :root {
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    /* The CARD's size, not the page's. The lobby runs full width again; what
       is held steady is how big a card is, by adding columns as the window
       grows rather than stretching two of them across a monitor.

       Derived from the iPad Pro 12.9" portrait width — 1024 CSS points, the
       same figure index.html's tier script uses as the top of the tablet tier
       — split into the two columns that view has: (1024 - gap) / 2. So a card
       on a wide desktop is the size it is on the largest device this view was
       built for, and the screen simply holds more of them. */
    --gap: 10px;
    --card: 507px;
    /* Sheets hold passages, so they keep a measure rather than running wide. */
    --measure: 1024px;
    /* The ground. Painted on the root as well as on .wrap — see the note there;
       a drift between the two would show as a band at the foot of a phone. */
    --paper: #E7E2D8;
    /* The masthead band. One token for the lobby and every room — trying white
       against the yellow it was; flip this line to #F9FF45 to go back. */
    --band: #FFFFFF;
    --bandInk: #111111;
  }

  /* The paper is painted here as well as on .wrap. .wrap is position:fixed and
     so is laid out against the SMALL viewport — the one with the address bar
     showing. When a phone's bar collapses, the strip it uncovers is outside the
     fixed layer, and with no background on html or body that strip falls
     through to the browser's canvas, which is white. Colouring the root means
     whatever the fixed layer does not cover is still paper. */
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--paper);
  }

  .wrap {
    position: fixed; inset: 0;
    background: var(--paper);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    /* viewport-fit=cover with a translucent status bar means this runs edge to
       edge once installed — inset on all four sides so nothing lands under the
       clock, the battery, or the notch in landscape. */
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(10px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(10px + env(safe-area-inset-left));
    font-family: var(--font);
  }

  /* The cap sits on an inner column, not on .wrap: .wrap is the fixed scroller
     and carries the safe-area insets, so narrowing it would pull the scrollbar
     and the background in with it. */
  .col { width: 100%; margin: 0 auto; }
  /* Sheets are their own fixed layers and carry reading copy, so they keep a
     measure even though the lobby does not. */
  .sheet > * { max-width: var(--measure); margin-left: auto; margin-right: auto; }
  /* A ROOM is not a passage — it is the lobby's grid under another masthead, so
     it tiles the full width. Without this the measure above, which exists for
     paragraphs, quietly held every room to a 1024px column. */
  .sheet.room > * { max-width: none; }
  /* Masthead. Its height is set from the first card's title block in JS, so it
     stands exactly as tall as KARLA IS HERE does on the card beneath it — a
     measurement rather than a number that would drift from the cards. Carries
     the same radius and lift as a card so it sits in the same world. */
  /* The view toggle. Set in the same relationship as the ring's: where you are
     stated plainly, where you can go in the site's purple — the one colour that
     already means "press this" on the menu card. */
  .viewtoggle {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 2px 12px;
    font: 700 12px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.14em;
  }
  /* Purple states what is true, grey what is merely available — the ring's
     menu now reads the same way, so the colour means one thing across the site.
     Not the #8127D3 the ring's note is authored in: that canvas is a texture in
     a lit, tone-mapped scene, and what reaches the screen is this — sampled off
     the rendered frame. Matching the hex would have missed the colour. */
  .viewtoggle .on { color: #BA76CF; }
  .viewtoggle .off { color: rgba(17,17,17,0.38); }
  .viewtoggle .sep { color: rgba(17,17,17,0.28); }
  .viewtoggle a, .viewtoggle button {
    text-decoration: none; -webkit-tap-highlight-color: transparent;
    font: inherit; letter-spacing: inherit; color: inherit;
    background: none; border: 0; padding: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  /* The two pairs read as two statements, so they need more air between them
     than the words inside either one get. */
  .viewtoggle .pair { display: flex; align-items: center; gap: 10px; }
  .viewtoggle .pair + .pair { margin-left: 26px; }
  .viewtoggle .lab { color: rgba(17,17,17,0.38); }
  /* The ring is built for a large screen, and below the 12.9" iPad's 1024pt
     portrait width it is not offered — so the pair that would take you there is
     not shown either. Measured on width alone: a narrow window on a desktop is
     as unsuited to the ring as the device is, and `--measure` already treats
     1024 as the largest screen this view was drawn for.
     The margin goes with it, or the audio pair would start 26px in from an
     element that is no longer there. */
  @media (max-width: 1023px) {
    .viewtoggle .pair.views { display: none; }
    .viewtoggle .pair + .pair { margin-left: 0; }
  }

  .masthead {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    /* One line, always — fitMastheadLine() below shrinks the type to hold it
       rather than letting the name break across two. */
    white-space: nowrap;
    margin-bottom: 10px;
    border-radius: 6px;
    background: var(--band); color: var(--bandInk);
    font-weight: 700; letter-spacing: -0.01em; line-height: 1;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.30),
      inset 0 -1px 0 rgba(0,0,0,0.20),
      0 2px 3px rgba(0,0,0,0.28),
      0 10px 20px rgba(0,0,0,0.22);
  }

  /* Two columns is the phone's layout and stays the default — auto-fill with a
     desktop-sized minimum would collapse a phone to a single column. Only once
     there is room for the cards at their intended size does the grid start
     adding columns instead of widening the two. 1fr, not the raw card width, so
     the row always divides the full width exactly and never leaves a gutter. */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  @media (min-width: 900px) {
    /* The floor is --card OR half the row, whichever is smaller — so a width
       that cannot seat two full cards seats two narrower ones instead of
       dropping to a single column. At 1024 (the large iPad, portrait) the plain
       minmax(507px) asked for 1024px of track inside 1004 and fell back to one
       card per row, which is the widest this view ever renders and the reason
       the masthead needed two lines to hold its name. */
    .grid {
      grid-template-columns:
        repeat(auto-fill, minmax(min(var(--card), (100% - var(--gap)) / 2), 1fr));
    }
  }

  .card {
    container-type: inline-size;
    position: relative;
    display: flex; flex-direction: column;
    aspect-ratio: 3 / 4;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    /* Raised, not floating: a lit top lip and shaded bottom lip give the face a
       thickness, a short hard shadow sits it on the ground, a long soft one
       lifts it off. */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.30),
      0 2px 3px rgba(0,0,0,0.28),
      0 10px 20px rgba(0,0,0,0.22);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .card::after {
    content: '';
    position: absolute; inset: 0; z-index: 4;
    background: linear-gradient(158deg,
      rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.05) 24%, rgba(255,255,255,0) 48%);
    pointer-events: none;
  }
  .card:active {
    transform: translateY(2px) scale(0.988);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(0,0,0,0.30),
      0 1px 2px rgba(0,0,0,0.28),
      0 4px 9px rgba(0,0,0,0.20);
  }

  .media { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; }
  .dancer, .cardArt { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }
  .slide { position: absolute; inset: 0; z-index: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 900ms ease; }
  /* Artwork is shown whole. A cover crop is right for a cover image, which is
     chosen to be cropped; it is wrong for a painting. */
  .card.whole .slide { background-size: contain; }
  .card.whole video.media { object-fit: contain; }
  /* A card may take the proportion of the work it holds rather than the grid's
     3:4. The paintings are 800x900, so on their own cards the art fills the
     frame edge to edge instead of sitting letterboxed inside a taller one. */
  .card[style*="--ar"] { aspect-ratio: var(--ar); }
  .slide.on { opacity: 1; }

  /* Same grain the ring wears over every card, so the two read as one site. */
  .static {
    position: absolute; inset: 0; z-index: 3;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"),
      repeating-linear-gradient(rgba(0,0,0,0.16) 0 1px, rgba(0,0,0,0) 1px 3px);
    background-size: 120px 120px, 100% 3px;
    opacity: 0.22;
    pointer-events: none;
    animation: snow 0.32s steps(1) infinite;
  }
  @keyframes snow {
    0%   { background-position: 0 0, 0 0; }
    25%  { background-position: 37px 61px, 0 0; }
    50%  { background-position: 83px 19px, 0 0; }
    75%  { background-position: 15px 94px, 0 0; }
    100% { background-position: 61px 43px, 0 0; }
  }
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 46%; z-index: 1;
           background: linear-gradient(rgba(0,0,0,0.62), rgba(0,0,0,0)); }
  .scrimFoot { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; z-index: 1;
               background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.55)); }

  .head { position: relative; z-index: 2; padding: 9cqw 9cqw 0; }
  .title { margin: 0; font-weight: 700; line-height: 1.0; letter-spacing: -0.01em; }
  .title span { display: block; }
  .subTitle { margin: 1cqw 0 0; }
  .rule { height: 1px; margin: 2.2cqw 0 2cqw; }
  .sub { margin: 0; font-weight: 300; font-size: max(9.5px, 2.33cqw); letter-spacing: 0.14em; line-height: 1.4; }
  /* The gallery notice. Two sizes only, matching the interviews room's card:
     the show's name at the card's reading size, the label and the date sharing
     the sub's — the date bold and in caps so it reads as the label's pair
     rather than as a third size. Sized in cqw like everything else here, so it
     holds its proportions whether the card is a phone column or a desktop one. */
  .notes { position: relative; z-index: 2; padding: 4cqw 9cqw 0; }
  .note + .note { margin-top: 5cqw; }
  .noteLabel { display: block; font-weight: 300; font-size: max(9.5px, 2.33cqw);
               letter-spacing: 0.14em; line-height: 1.4; }
  .noteName  { display: block; margin-top: 2.4cqw; font-weight: 600;
               font-size: max(14px, 5.2cqw); letter-spacing: -0.01em; line-height: 1.12; }
  .noteName.small { font-weight: 700; font-size: max(9.5px, 2.33cqw); letter-spacing: 0.14em; }
  .noteFoot  { display: block; margin-top: 2.2cqw; font-weight: 700;
               font-size: max(9.5px, 2.33cqw); letter-spacing: 0.14em; }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 9cqw 7cqw;
    font-weight: 300; font-size: max(9px, 2.2cqw); letter-spacing: 0.14em;
  }

  /* The ring's issue tile, flattened: hash, number, then the Journal mark, on
     one shared clock so every badge turns together. */
  .badge {
    position: absolute; top: 0; right: 0; z-index: 3;
    width: 22cqw; height: 22cqw;
    overflow: hidden;
    font-weight: 700; font-size: 12cqw; line-height: 1;
    box-shadow: -1px 1px 3px rgba(0,0,0,0.35);
  }
  /* Two tiles, one showing. On a turn the live one slides off to the right and
     the next follows it in from the left — the ring's own move, which a straight
     content swap loses. */
  .badge .tile {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 550ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* The home button, far right inside a room's band. Sized and inset in em so
     it tracks the masthead's type, which applyMastheadMetrics sets in px from
     the cards — the disc stays in proportion through a resize or a change of
     columns without being measured itself. Absolute, so the title keeps the
     exact centre it had before the button existed. */
  .masthead .home {
    position: absolute; top: 50%; right: 0.62em;
    transform: translateY(-50%);
    /* As tall as the lettering: 0.747em is the measured cap height of OSWIN
       JOURNAL in this face, and every masthead shares one type size, so the
       disc reads as the same height as the wordmark on any screen. */
    width: 0.747em; height: 0.747em; padding: 0;
    border: 0; border-radius: 50%;
    background: currentColor; color: inherit;
    /* A button does not inherit type by default, so without this the em units
       above resolve against the UA's 13px and the disc comes out a speck. */
    font: inherit;
    cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: opacity 160ms ease;
  }
  .masthead .home:hover { opacity: 0.72; }
  .masthead .home:active { opacity: 0.55; }
  .masthead .home:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .masthead .home { transition: none; } }

  .badge i { display: block; width: 62%; height: 62%; border-radius: 50%; background: currentColor; }
  @media (prefers-reduced-motion: reduce) { .badge .tile { transition: none; } }

  .body {
    position: relative; z-index: 2; flex: 1; min-height: 0;
    padding: 4cqw 9cqw 9cqw;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
    font-weight: 300; font-size: max(8px, 2.6cqw); line-height: 1.55;
    color: rgba(0,0,0,0.62);
  }
  .body p { margin: 0 0 0.9em; }

  /* Enquiries: the ring's card types a message out; at this size that can only
     be a smear, so bars stand in for lines of copy being written. */
  .enq { position: relative; z-index: 2; flex: 1; min-height: 0; padding: 5cqw 9cqw 9cqw; display: flex; flex-direction: column; }
  .enqLabel { display: block; font-weight: 300; font-size: max(7px, 2.33cqw); letter-spacing: 0.16em; color: rgba(0,0,0,0.5); }
  .enqCopy { margin: 3.5cqw 0 0; flex: 1; min-height: 0; overflow: hidden;
             mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
             -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%); }
  .copyLine { display: block; height: max(3px, 1.5cqw); margin-bottom: max(3.5px, 1.7cqw);
              background: rgba(0,0,0,0.17); border-radius: 1px;
              transform-origin: left center; transform: scaleX(0);
              transition: transform 1300ms cubic-bezier(0.22,0.8,0.3,1); }
  .copyBreak { margin-top: max(5px, 2.4cqw); }
  .enqSubmit { margin-top: auto; }

  .subscribe {
    display: block; margin: 26px auto calc(6px + env(safe-area-inset-bottom));
    background: none; border: none; padding: 0 0 3px;
    font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: 0.22em;
    color: rgba(0,0,0,0.82); border-bottom: 1px solid rgba(0,0,0,0.82);
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Sheets ───────────────────────────────────────────────────────────── */
  .sheet {
    position: fixed; inset: 0; z-index: 60;
    background: var(--paper); color: #111;
    overflow-y: auto; touch-action: pan-y;
    padding: calc(28px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
             calc(28px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    font-family: var(--font);
  }
  .sheet.teal { background: #00C2A8; }
  /* A room: a sheet that holds a grid rather than a passage, so it takes the
     lobby's own gutter and lets its cards do the work. */
  .sheet.room { padding-left: calc(10px + env(safe-area-inset-left)); padding-right: calc(10px + env(safe-area-inset-right)); }
  .sheet.room .actions { justify-content: center; margin-top: 22px; }
  .sheet h2 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet .sheetSub { margin: 10px 0 30px; font-size: 13px; font-weight: 300; letter-spacing: 0.1em;
                     text-transform: uppercase; color: rgba(0,0,0,0.62); }
  .sheet p.copy { margin: 0 0 1.1em; font-weight: 300; font-size: 15px; line-height: 1.62; color: rgba(0,0,0,0.82); }
  .sheet label { display: block; margin-bottom: 22px; font-size: 12px; letter-spacing: 0.1em; color: rgba(0,0,0,0.62); }
  .sheet input, .sheet textarea {
    display: block; width: 100%; margin-top: 8px;
    background: none; border: none; border-bottom: 1px solid rgba(0,0,0,0.35);
    padding: 6px 0; font-family: var(--font); font-size: 16px; color: #111; border-radius: 0;
  }
  .sheet textarea { min-height: 120px; resize: vertical; }
  .sheet input:focus, .sheet textarea:focus { outline: none; border-bottom-color: #111; }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
  .sheet button, .sheet a.act {
    background: none; border: none; padding: 0 0 3px; cursor: pointer; text-decoration: none;
    font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #111;
    border-bottom: 1px solid #111;
  }
  .sheet button.close { font-weight: 300; color: rgba(0,0,0,0.5); border-bottom: none; }
  .sheet ol.steps {
    margin: 0 0 8px; padding-left: 1.3em;
    font-weight: 300; font-size: 15px; line-height: 1.62; color: rgba(0,0,0,0.82);
  }
  .sheet ol.steps li { margin-bottom: 0.7em; padding-left: 0.2em; }
  .sheet p.close-note { margin-top: 30px; }
  .sheet .status { margin: 14px 0 0; font-size: 12px; color: rgba(0,0,0,0.62); }
  /* Interview furniture: the portrait leads, section heads break the piece up,
     and a question sits in the card-title weight so the answer reads as reply. */
  .sheet .portrait { display: block; width: 100%; height: auto; border-radius: 6px; margin-bottom: 26px; }
  .sheet h3.section {
    margin: 34px 0 16px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(0,0,0,0.62);
  }
  .sheet p.deck {
    margin: -18px 0 26px; font-size: 15px; font-weight: 300;
    line-height: 1.5; color: rgba(0,0,0,0.6);
  }
  .sheet p.disclosure {
    margin: 0 0 30px;
    padding: 18px 0;
    border-top: 1px solid rgba(0,0,0,0.30);
    border-bottom: 1px solid rgba(0,0,0,0.30);
    font-size: 14px; font-weight: 400; line-height: 1.55;
    letter-spacing: 0; color: rgba(0,0,0,0.78);
  }
  .sheet p.q {
    margin: 26px 0 10px; font-size: 15px; font-weight: 700;
    line-height: 1.45; letter-spacing: -0.01em; color: #111;
  }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) { .static { animation: none; } }
</style>
</head>

<script>
  // Remember the choice before leaving, so index.html's tier script does not
  // simply detect a phone and send the visitor straight back here. Written on
  // the click rather than on arrival: landing here by detection is not a choice.
  addEventListener('DOMContentLoaded', () => {
    const a = document.getElementById('toCarousel')
    if (a) a.addEventListener('click', () => { try { localStorage.setItem('oswinView', 'carousel') } catch (e) {} })
  })
</script>
<div class="wrap">
 <div class="col">
  <!-- The ring's menu carries the same pair at its head; this is its other
       half, so the choice can be undone from the side it lands on. -->
  <div class="viewtoggle">
    <span class="pair views">
      <a id="toCarousel" class="off" href="index.html?tier=desktop">CAROUSEL</a>
      <span class="sep">/</span>
      <span class="on">GRID</span>
    </span>
    <span class="pair">
      <span class="lab">AUDIO</span>
      <button type="button" class="audOn off">ON</button>
      <span class="sep">/</span>
      <button type="button" class="audOff on">OFF</button>
    </span>
  </div>
  <div class="masthead" id="masthead">OSWIN JOURNAL</div>
  <div class="grid" id="grid"></div>
  <button class="subscribe" type="button" id="subscribeBtn">SUBSCRIBE</button>
 </div>
</div>

<script src="covers.js"></script>
<script src="fiction_stories.js"></script>
<script src="interviews.js"></script>
<script>
// Where the React app lives. Same reasoning as the ring: in dev Vite serves the
// app at "/" and this page at /carousel/mobile.html; in production Netlify
// serves the ring at "/" and the app under /journal/.
const JOURNAL_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? '/' : '/journal/'
const LIVE_ISSUE = (n) => `${JOURNAL_BASE}?issue=${n}`
const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xvgevdda'

// The site's yellow: the badge's third state, the masthead, and the interviews
// card all sit on this one value.
const BADGE_YELLOW = '#F9FF45'

// The read-me card. Blue because it has to pull the eye without fighting the
// yellow it sits beside — blue and yellow are complements, where red and yellow
// are two warm colours competing for the same attention. This is the blue
// already on the site (Karla's title), so nothing new enters the palette.

// An interview reads like an issue: the portrait, then the writing, then the
// questions. Same sheet the journal write-up uses, with the Q&A set apart so
// you can see where the conversation starts.
function openInterview(iv) {
  const sh = document.createElement('div')
  sh.className = 'sheet'
  // The reading screen gets the band too, naming the room it belongs to rather
   // than the piece — the piece names itself in the <h2> just below. Yellow
   // here, where the rooms are white, so a reading reads as somewhere you have
   // gone INTO rather than another room alongside them.
  sh.innerHTML =
    `<div class="masthead" style="background:${BADGE_YELLOW};color:#111111">INTERVIEWS` +
    '<button type="button" class="home" aria-label="Back to interviews"></button></div>' +
    `<img class="portrait" src="${iv.portrait}" alt="">` +
    `<h2>${iv.title}</h2><p class="sheetSub">${iv.sub}</p>` +
    (iv.deck ? `<p class="deck">${iv.deck}</p>` : '') +
    // A standing head, not a footnote: it sits above the piece, in the reading
    // size, so it is read rather than skipped.
    (iv.disclosure ? `<p class="disclosure">${iv.disclosure}</p>` : '') +
    iv.intro.map(p => `<p class="copy">${p}</p>`).join('') +
    (iv.sections || []).map(sec =>
      `<h3 class="section">${sec.heading}</h3>` + sec.paras.map(p => `<p class="copy">${p}</p>`).join('')
    ).join('') +
    // Guarded like the other two readers: an interview with nothing to ask yet
    // has no lead, and unguarded this printed the word "undefined" as a heading.
    (iv.qaLead ? `<h3 class="section">${iv.qaLead}</h3>` : '') +
    iv.qa.map(x => (x.q ? `<p class="q">${x.q}</p>` : '') + (x.a ? `<p class="copy">${x.a}</p>` : '')).join('') +
    '<div class="actions"><button type="button" class="close">CLOSE</button></div>'
  // One level up from a reading is the room it was opened from.
  const up = () => history.back()
  sh.querySelector('.home').addEventListener('click', up)
  sh.querySelector('.close').addEventListener('click', up)
  mountSheet(sh, () => openInterviews(false))
  applyMastheadMetrics(sh.querySelector('.masthead'))
}

// One band for every room: the journal's yellow with black type. A room used
// to tint its masthead to its own contents, which made the header part of the
// work; a single band makes it part of the furniture instead, and the disc in
// it means the same thing wherever you are.
function openWorkRoom({ title, items, back }, push = true) {
  const sh = document.createElement('div')
  sh.className = 'sheet room'
  sh.innerHTML = `<div class="masthead">${title}` +
                 '<button type="button" class="home" aria-label="Back to Oli Goldsmith"></button></div>' +
                 '<div class="grid"></div>' +
                 '<div class="actions"><button type="button" class="close">CLOSE</button></div>'
  const g = sh.querySelector('.grid')
  items.forEach((it) => g.appendChild(buildCard(it)))
  // Same band the lobby wears. Without this a room's masthead keeps the
  // element's default height and renders as a thin sliver of tiny type.
  applyMastheadMetrics(sh.querySelector('.masthead'))
  // One step back is the entry that opened this room, and `back` remounts Oli
  // on it — so the disc returns to the grid of choices, not to the lobby. Both
  // the disc and CLOSE make the same move; the disc is just where the thumb is.
  const up = () => history.back()
  sh.querySelector('.home').addEventListener('click', up)
  sh.querySelector('.close').addEventListener('click', up)
  mountSheet(sh, back || null, push)
}

// ── Title fitting ─────────────────────────────────────────────────────────────
// The ring shrinks a title until it fits (titleLayout). CSS has no
// shrink-to-fit, so the same measure runs once against the same 600x800 design
// and converts to container-query units, and the break-up is given by hand so
// every card in the grid reads at one size.
const DESIGN_W = 600, DESIGN_MARGIN = 54
const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif"
function fitTitle(lines) {
  const ctx = document.createElement('canvas').getContext('2d')
  const maxW = DESIGN_W - DESIGN_MARGIN * 2
  let size = 74
  for (; size >= 20; size -= 2) {
    ctx.font = `700 ${size}px ${FONT}`
    ctx.letterSpacing = '-0.01em'
    if (Math.max(...lines.map(l => ctx.measureText(l).width)) <= maxW) break
  }
  return (size / DESIGN_W) * 100
}

// ── Badge ─────────────────────────────────────────────────────────────────────
const BADGE_STYLES = [
  { kind: 'hash',   bg: '#111111', fg: '#FFFFFF' },
  { kind: 'number', bg: '#FFFFFF', fg: '#111111' },
  { kind: 'circle', bg: '#FFFFFF', fg: '#111111' },
]
const BADGE_HOLD_MS = 3000
const badgeEls = []
let badgeIdx = 0

function paintTile(tile, style, num) {
  tile.style.background = style.bg
  tile.style.color = style.fg
  tile.innerHTML = style.kind === 'circle' ? '<i></i>'
    : style.kind === 'hash' ? '#'
    : String(num)
}



function makeBadge(num) {
  const el = document.createElement('div')
  el.className = 'badge'
  const a = document.createElement('div'); a.className = 'tile'
  const b = document.createElement('div'); b.className = 'tile'
  a.style.transform = 'translateX(0)'
  b.style.transform = 'translateX(-100%)'
  paintTile(a, BADGE_STYLES[0], num)
  el.append(a, b)
  badgeEls.push({ el, num, tiles: [a, b], live: 0, phase: 0 })
  return el
}

// Turn every badge together: paint the incoming tile, park it off to the left
// without a transition, then let both run.
function turnBadges(toIdx) {
  badgeEls.forEach((b) => {
    const st = BADGE_STYLES[toIdx]
    const cur = b.tiles[b.live]
    const next = b.tiles[1 - b.live]
    paintTile(next, st, b.num)
    next.style.transition = 'none'
    next.style.transform = 'translateX(-100%)'
    void next.offsetWidth          // commit the parked position before animating
    next.style.transition = ''
    cur.style.transform = 'translateX(100%)'
    next.style.transform = 'translateX(0)'
    b.live = 1 - b.live
  })
}

// Ragged widths on purpose: equal bars read as a loading skeleton, uneven ones
// read as prose. The short line is a paragraph ending.
const COPY_LINES = [100, 96, 99, 92, 100, 88, 54, 97, 100, 84, 91, 63]
const COPY_BREAK_AFTER = 6

// ── Build ─────────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid')

function buildCard(card) {
  const el = document.createElement('div')
  el.className = 'card' + (card.whole ? ' whole' : '')
  if (card.ar) el.style.setProperty('--ar', card.ar)
  el.style.background = card.bg
  const overPhoto = card.kind === 'video' || card.kind === 'photo' || card.kind === 'image' || card.kind === 'slides'
  const ink = card.ink || (overPhoto || card.light ? 'rgba(255,255,255,0.94)' : 'rgba(0,0,0,0.88)')
  const inkSub = overPhoto || card.light ? 'rgba(255,255,255,0.62)' : 'rgba(0,0,0,0.50)'
  const inkRule = overPhoto || card.light ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.22)'

  if (card.kind === 'video') {
    const v = document.createElement('video')
    v.className = 'media'
    v.src = card.src
    v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto'
    v.setAttribute('webkit-playsinline', '')
    // iOS only allows inline autoplay on a genuinely muted element, and the
    // property has to be set on the element, not just implied by an attribute.
    v.muted = true; v.defaultMuted = true
    const play = () => v.play().catch(() => {})
    play()
    // Low Power Mode refuses outright; the first touch is a gesture to retry on.
    window.addEventListener('touchstart', play, { once: true, passive: true })
    document.addEventListener('visibilitychange', play)
    el.appendChild(v)
  }

  if (card.kind === 'slides') {
    // Issue 3 has no film of its own — its stills cross-fade instead, which is
    // the same slideshow the ring's card runs.
    const layers = card.slides.map((src, i) => {
      const d = document.createElement('div')
      d.className = 'slide' + (i === 0 ? ' on' : '')
      d.style.backgroundImage = `url('${src}')`
      el.appendChild(d)
      return d
    })
    let si = 0
    setInterval(() => {
      layers[si].classList.remove('on')
      si = (si + 1) % layers.length
      layers[si].classList.add('on')
    }, 3200)
  }

  if (card.kind === 'image') {
    const d = document.createElement('div')
    d.className = 'slide on'
    d.style.backgroundImage = `url('${card.src}')`
    el.appendChild(d)
  }

  if (card.kind === 'photo') {
    const d = document.createElement('div')
    d.className = 'slide on'
    d.style.backgroundImage = `url('${card.src}')`
    d.style.filter = 'grayscale(1) contrast(1.2) brightness(0.95)'
    el.appendChild(d)
  }

  if (overPhoto) {
    el.insertAdjacentHTML('beforeend', '<div class="scrim"></div>')
    if (card.foot) el.insertAdjacentHTML('beforeend', '<div class="scrimFoot"></div>')
    el.insertAdjacentHTML('beforeend', '<div class="static"></div>')
  }

  // A card of pure artwork carries no type at all — nothing is laid over
  // someone's work, the same rule the rings follow.
  if (!card.lines) {
    if (card.badge) el.appendChild(makeBadge(card.badge))
    if (card.open) el.addEventListener('click', card.open)
    return el
  }

  const head = document.createElement('div')
  head.className = 'head'
  head.innerHTML =
    `<h2 class="title" style="color:${ink};font-size:${fitTitle([...card.lines, ...(card.subLines || [])])}cqw">` +
    card.lines.map(l => `<span>${l}</span>`).join('') + '</h2>' +
    `<div class="rule" style="background:${inkRule}"></div>` +
    (card.subLines
      ? `<h3 class="title subTitle" style="color:${card.subColor || inkSub};font-size:${fitTitle([...card.lines, ...card.subLines])}cqw">`
        + card.subLines.map(l => `<span>${l}</span>`).join('') + '</h3>'
      : card.sub ? `<p class="sub" style="color:${card.subColor || inkSub}">${card.sub}</p>` : '')
  el.appendChild(head)

  if (card.notes) {
    const n = document.createElement('div')
    n.className = 'notes'
    n.innerHTML = card.notes.map((b) =>
      '<div class="note">' +
      `<span class="noteLabel" style="color:${inkSub}">${b.label}</span>` +
      b.lines.map((l) => `<span class="noteName${b.small ? ' small' : ''}" style="color:${ink}">${l}</span>`).join('') +
      (b.foot ? `<span class="noteFoot" style="color:${inkSub}">${b.foot.toUpperCase()}</span>` : '') +
      '</div>').join('')
    el.appendChild(n)
  }

  if (card.foot) {
    el.insertAdjacentHTML('beforeend', `<div class="foot" style="color:${inkSub}">${card.foot}</div>`)
  }

  if (card.kind === 'body') {
    const b = document.createElement('div')
    b.className = 'body'
    b.innerHTML = card.body.map(p => `<p>${p}</p>`).join('')
    el.appendChild(b)
  }

  if (card.kind === 'enq') el.appendChild(buildEnquiryPreview())

  if (card.dancer) mountDancer(el)
  if (card.rope) mountRope(el)
  if (card.gem) mountGem(el)
  if (card.star) mountStar(el)

  if (card.badge) el.appendChild(makeBadge(card.badge))

  if (card.open) el.addEventListener('click', card.open)
  return el
}

CARDS.forEach((card) => grid.appendChild(buildCard(card)))

setInterval(() => {
  badgeIdx = (badgeIdx + 1) % BADGE_STYLES.length
  turnBadges(badgeIdx)
}, BADGE_HOLD_MS)

// Every masthead — the lobby's and each room's — takes its height and type size
// from the LOBBY's first card title. Measuring each room against its own first
// card made fiction a thinner band than the rest, because HUM is one line where
// PLEASE READ and KARLA IS HERE are two. Still measured rather than hardcoded,
// so it tracks the cards through a rotation or a change of columns.
const masthead = document.getElementById('masthead')
function applyMastheadMetrics(el) {
  const title = grid.querySelector('.card .title')
  if (!title || !el) return
  el.style.height = title.getBoundingClientRect().height + 'px'
  const base = parseFloat(getComputedStyle(title).fontSize)
  el.style.fontSize = base + 'px'
  fitMastheadLine(el, base)
}

// The card title is what the band WANTS to be; this is what it can be. A name
// is one line or it is not a masthead, so when the cards' size would push it
// onto two the type gives way instead. Measured off the rendered text with
// nowrap already applied, so the width is the true single-line width rather
// than that of a block that has already wrapped.
function fitMastheadLine(el, base) {
  const node = [...el.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim())
  if (!node) return
  // Keep clear of the home disc, and by the same amount on the other side so
  // the title keeps the centre of the band rather than the centre of what is
  // left of it.
  const disc = el.querySelector('.home')
  const reserve = disc
    ? 2 * (el.getBoundingClientRect().right - disc.getBoundingClientRect().left + 10)
    : 0
  const avail = el.clientWidth - reserve
  if (avail <= 0) return
  const range = document.createRange()
  range.selectNodeContents(node)
  const w = range.getBoundingClientRect().width
  if (w > avail) el.style.fontSize = Math.max(8, base * (avail / w)) + 'px'
}
function sizeMastheads() {
  document.querySelectorAll('.masthead').forEach(applyMastheadMetrics)
}
sizeMastheads()
addEventListener('resize', sizeMastheads)
if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeMastheads)

// ── Enquiry preview ───────────────────────────────────────────────────────────
function buildEnquiryPreview() {
  const wrap = document.createElement('div')
  wrap.className = 'enq'
  const copy = document.createElement('div')
  copy.className = 'enqCopy'
  const bars = COPY_LINES.map((w, i) => {
    const s = document.createElement('span')
    s.className = 'copyLine' + (i === COPY_BREAK_AFTER ? ' copyBreak' : '')
    s.style.width = w + '%'
    copy.appendChild(s)
    return s
  })
  wrap.innerHTML = '<span class="enqLabel">message</span>'
  wrap.appendChild(copy)
  wrap.insertAdjacentHTML('beforeend', '<span class="enqLabel enqSubmit">submit</span>')

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let n = 0
    setInterval(() => {
      if (n >= bars.length) { n = 0; bars.forEach(b => b.style.transform = 'scaleX(0)'); return }
      bars[n].style.transform = 'scaleX(1)'
      n++
    }, 1500)
  } else {
    bars.forEach(b => b.style.transform = 'scaleX(1)')
  }
  return wrap
}

// ── Sheets ────────────────────────────────────────────────────────────────────
function removeSheet() {
  document.querySelector('.sheet')?.remove()
}
function closeSheet() { removeSheet() }

// A sheet opened from a room remembers how to put that room back, so closing a
// story returns you to fiction rather than all the way out to the grid. The
// room is remounted without pushing history — we are stepping back onto the
// entry that opened it, not adding another.
function mountSheet(node, onBack, push = true) {
  removeSheet()
  node._onBack = onBack || null
  node.insertAdjacentHTML('afterbegin', audioRowHTML())
  document.body.appendChild(node)
  registerAudioRow(node)
  if (push) history.pushState({ sheet: true }, '')
}

window.addEventListener('popstate', () => {
  const sheet = document.querySelector('.sheet')
  if (!sheet) return
  const back = sheet._onBack
  sheet.remove()
  if (back) back()
})

function openSheet({ title, sub, paras, actions = [], onBack }) {
  const s = document.createElement('div')
  s.className = 'sheet'
  s.innerHTML =
    `<h2>${title}</h2>` + (sub ? `<p class="sheetSub">${sub}</p>` : '') +
    paras.map(p => `<p class="copy">${p}</p>`).join('') +
    '<div class="actions"></div>'
  const row = s.querySelector('.actions')
  actions.forEach((a) => {
    if (a.href) {
      row.insertAdjacentHTML('beforeend', `<a class="act" href="${a.href}" target="_blank" rel="noopener">${a.label}</a>`)
    } else {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = a.label
      b.addEventListener('click', a.run); row.appendChild(b)
    }
  })
  const close = document.createElement('button')
  close.type = 'button'; close.className = 'close'; close.textContent = 'CLOSE'
  close.addEventListener('click', () => history.back())
  row.appendChild(close)
  mountSheet(s, onBack)
}

// Both forms post to the site's existing Formspree, tagged by subject so
// subscriptions and enquiries stay separable in the inbox.
async function postForm(payload, status) {
  status.textContent = 'sending…'
  try {
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
    })
    status.textContent = res.ok ? 'thank you — it is on its way.' : 'that did not go through. try again in a moment.'
    return res.ok
  } catch {
    status.textContent = 'that did not go through. try again in a moment.'
    return false
  }
}

function openSubscribe() {
  const s = document.createElement('div')
  s.className = 'sheet'
  s.innerHTML =
    '<h2>SUBSCRIBE</h2><p class="sheetSub">the journal, when there is an issue</p>' +
    '<form><label>EMAIL:<input type="email" name="email" autocomplete="email" required></label>' +
    '<p class="status"></p><div class="actions">' +
    '<button type="submit">SUBMIT</button>' +
    '<button type="button" class="close">CLOSE</button></div></form>'
  s.querySelector('.close').addEventListener('click', () => history.back())
  s.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const ok = await postForm({ email: e.target.email.value.trim(), _subject: 'Subscribe' }, s.querySelector('.status'))
    if (ok) e.target.reset()
  })
  mountSheet(s)
}

function openEnquiries() {
  const s = document.createElement('div')
  s.className = 'sheet teal'
  s.innerHTML =
    '<h2>ENQUIRIES</h2><p class="sheetSub">get in touch · looking for like minded</p>' +
    '<form><label>NAME:<input type="text" name="name" autocomplete="name" required></label>' +
    '<label>EMAIL:<input type="email" name="email" autocomplete="email" required></label>' +
    '<label>MESSAGE:<textarea name="message" required></textarea></label>' +
    '<p class="status"></p><div class="actions">' +
    '<button type="submit">SUBMIT</button>' +
    '<button type="button" class="close">CLOSE</button></div></form>'
  s.querySelector('.close').addEventListener('click', () => history.back())
  s.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const f = e.target
    const name = f.name.value.trim()
    const ok = await postForm(
      { name, email: f.email.value.trim(), message: f.message.value.trim(), _subject: `Enquiry from ${name}` },
      s.querySelector('.status'))
    if (ok) f.reset()
  })
  mountSheet(s)
}

document.getElementById('subscribeBtn').addEventListener('click', openSubscribe)

// ── Lobby audio ───────────────────────────────────────────────────────────────
// The same bed the ring plays, and the same file — on the ring it is a Web Audio
// graph because the track has to run backwards when you scrub the carousel the
// other way. There is no carousel here and nothing to run backwards, so a plain
// looping element is the whole requirement.
//
// It starts silent: a browser will not sound anything until the reader has
// asked for it, which is why ON is the grey state on arrival rather than a
// purple one that would be lying.
const LOBBY_SRC = 'audio/ethernity_lobby.mp3'
const AUD_FADE_MS = 600          // the ring's FADE_TOGGLE, in milliseconds
let lobbyEl = null, audFade = null, audWanted = false

// Every screen carries its own pair of buttons over one shared player, so the
// state has to be painted onto all of them at once. Rows go stale as sheets are
// torn down; they are dropped on the next paint rather than tracked.
const audRows = []

function registerAudioRow(root) {
  const on = root.querySelector('.audOn'), off = root.querySelector('.audOff')
  if (!on || !off) return
  on.addEventListener('click', audioOn)
  off.addEventListener('click', audioOff)
  audRows.push({ on, off })
  paintAudio()
}

function paintAudio() {
  for (let i = audRows.length - 1; i >= 0; i--) {
    const r = audRows[i]
    if (!r.on.isConnected) { audRows.splice(i, 1); continue }
    r.on.className = 'audOn ' + (audWanted ? 'on' : 'off')
    r.off.className = 'audOff ' + (audWanted ? 'off' : 'on')
  }
}

// The row a sheet gets: the audio pair alone. CAROUSEL / GRID belongs to the
// lobby, where the choice of view is actually made.
//
// ETHERNITY needs no exception of its own — it is Oli's own site, reached by
// leaving ours, so there is no screen of ours left to carry the control.
function audioRowHTML() {
  return '<div class="viewtoggle">' +
           '<span class="pair">' +
             '<span class="lab">AUDIO</span>' +
             '<button type="button" class="audOn off">ON</button>' +
             '<span class="sep">/</span>' +
             '<button type="button" class="audOff on">OFF</button>' +
           '</span>' +
         '</div>'
}

// Nothing on this site cuts, so the bed arrives and leaves on a ramp. The
// element's own volume is the only gain available without a Web Audio graph.
function fadeAudio(to, after) {
  if (audFade) cancelAnimationFrame(audFade)
  const from = lobbyEl.volume, t0 = performance.now()
  const step = (t) => {
    const k = Math.min(1, (t - t0) / AUD_FADE_MS)
    lobbyEl.volume = from + (to - from) * k
    if (k < 1) { audFade = requestAnimationFrame(step) }
    else { audFade = null; if (after) after() }
  }
  audFade = requestAnimationFrame(step)
}

async function audioOn() {
  if (audWanted) return
  audWanted = true; paintAudio()        // optimistic, as the ring's PLAY is
  if (!lobbyEl) {
    lobbyEl = new Audio(LOBBY_SRC)
    lobbyEl.loop = true
    lobbyEl.preload = 'none'
  }
  lobbyEl.volume = 0
  try {
    await lobbyEl.play()
  } catch (e) {
    // Blocked, or the file would not play — say so by going back to OFF rather
    // than leaving a purple ON over silence.
    audWanted = false; paintAudio()
    return
  }
  if (!audWanted) return                // turned off again while it loaded
  fadeAudio(1)
}

function audioOff() {
  if (!audWanted) return
  audWanted = false; paintAudio()
  if (lobbyEl) fadeAudio(0, () => { if (!audWanted) lobbyEl.pause() })
}

registerAudioRow(document.querySelector('.wrap'))
</script>
