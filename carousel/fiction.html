<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oswin Journal — Fiction</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0e0b08; color:#fff;
               font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; }
  canvas.ring { display:block; position:fixed; inset:0; }

  #backBtn {
    position:fixed; top:20px; left:22px; z-index:20;
    padding:6px 4px; border:none; background:none; cursor:pointer;
    color:rgba(255,255,255,0.55); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing:0.22em; transition:color 200ms ease;
  }
  #backBtn:hover { color:rgba(255,255,255,0.92); }

  .mast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:20;
          background:#FF5F00; color:#111111; font-weight:700; letter-spacing:-0.01em;
          font-size:15px; line-height:1; padding:9px 16px; border-radius:2px; }

  /* ── Reading view ─────────────────────────────────────────────────────────
     The stories are long, so they get a proper column rather than being drawn
     onto a card face the way the ring's short bodies are. */
  #reader { position:fixed; inset:0; z-index:1000; background:#0a0a0a;
            overflow-y:auto; -webkit-overflow-scrolling:touch; display:none; }
  #reader.open { display:block; }
  #reader .col { max-width:38em; margin:0 auto; padding:104px 26px 120px; }
  #reader h2 { margin:0; font-size:54px; line-height:1; font-weight:700; letter-spacing:-0.01em; }
  #reader .sub { margin:14px 0 0; font-size:13px; font-weight:300; letter-spacing:0.16em;
                 text-transform:uppercase; color:rgba(255,255,255,0.5); }
  #reader hr { border:0; border-top:1px solid rgba(255,255,255,0.18); margin:26px 0 34px; }
  #reader p { margin:0 0 1.5em; font-size:18px; line-height:1.62; font-weight:300;
              color:rgba(255,255,255,0.86); }
  #reader .close { position:fixed; top:20px; left:22px; z-index:1001;
                   padding:6px 4px; border:none; background:none; cursor:pointer;
                   color:rgba(255,255,255,0.55); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
                   letter-spacing:0.22em; transition:color 200ms ease; }
  #reader .close:hover { color:rgba(255,255,255,0.92); }
</style>
</head>
<body>

<button id="backBtn" aria-label="Back">←&nbsp;&nbsp;BACK</button>
<div class="mast">FICTION</div>

<div id="reader" aria-hidden="true">
  <button class="close" type="button">←&nbsp;&nbsp;CLOSE</button>
  <div class="col" id="readerCol"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="covers.js"></script>
<script src="fiction_stories.js"></script>
<script>
// ── Fiction — the room behind the ring's FICTION card ─────────────────────────
// The desktop counterpart of the phone grid's fiction room: the same eight
// pieces, in the same order, with the same four live covers — but presented the
// way this side of the site presents cards, as a ring you spin.
//
// RADIUS, CAM_Z, the 55° field, the panel proportion, THICK, and the whole
// drag/momentum/idle feel (SENS, FRICTION, MAX_VEL, AUTO_SPEED, DRAG_THRESH)
// are the lobby ring's own numbers from index.html, so this reads as the same
// object spinning, not a lookalike.
//
// Card faces are the ring's 600x800 design at the ring's 54px margin. The
// covers come from covers.js and the writing from fiction_stories.js, both
// shared with mobile.html — neither is duplicated here.

const W = 600, H = 800, LM = 54

const CARDS = [
  { id: 'hum',      title: 'HUM',                   sub: 'Broken Sign',                video: 'videos/fiction/hum.mp4',    bg: '#0c0c0c' },
  { id: 'elon',     title: "ELON'S IN MY ELEVATOR", sub: 'Floor 41',                   image: 'images/fiction/elon.jpg',   bg: '#1a1a1a' },
  { id: 'siphon',   title: 'SIPHON',                sub: 'Falling Dots',               video: 'videos/fiction/siphon.mp4', bg: '#05061a' },
  { id: 'knife',    title: 'CASUAL KNIFE FIGHT',    sub: '',                           video: 'videos/fiction/knife.mp4',  bg: '#C9A400' },
  { id: 'grafting', title: 'GRAFTING',              sub: 'Synthetic to Organic',       cover: 'rope',   bg: '#046A38' },
  { id: 'boogie',   title: 'BOOGIE',                sub: '',                           cover: 'dancer', bg: '#582C83' },
  { id: 'cbc',      title: 'CBC',                   sub: 'The One-Way Glass Incident', cover: 'gem',    bg: '#E4002B' },
  { id: 'dorthy',   title: 'DORTHY SOTHERBY',       sub: 'Waiting for Applause',       cover: 'star',   bg: '#F37021' },
]
const COUNT = CARDS.length

// Each cover is handed the card's own 600x800 box, so it composes at this scale
// rather than being drawn small and stretched.
const COVERS = {
  rope:   (ctx, t) => drawRope(ctx, W, H, t),
  gem:    (ctx, t) => drawGemZoom(ctx, W, H, t),
  star:   (ctx, t) => drawStar(ctx, W, H, t),
  dancer: (ctx, t) => drawFigure(ctx, W, H, DANCES.spinPoint(t), dancerLine(W, H), t),
}
const COVER_SPEED = { rope: ROPE_SPEED, gem: GEM_SPEED, star: STAR_SPEED, dancer: DANCER_SPEED }

// ── TV static (index.html: GRAIN_LIGHTEN / GRAIN_MULTIPLY) ────────────────────
const _noiseCanvas = document.createElement('canvas')
_noiseCanvas.width = 220; _noiseCanvas.height = 293
const _noiseCtx = _noiseCanvas.getContext('2d')
function regenNoise() {
  const id = _noiseCtx.createImageData(_noiseCanvas.width, _noiseCanvas.height)
  const d = id.data
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255
  }
  _noiseCtx.putImageData(id, 0, 0)
}
const GRAIN_LIGHTEN = 0.088, GRAIN_MULTIPLY = 0.06
function applyTvStatic(ctx) {
  ctx.save()
  ctx.imageSmoothingEnabled = false
  ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = GRAIN_LIGHTEN
  ctx.drawImage(_noiseCanvas, 0, 0, W, H)
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = GRAIN_MULTIPLY
  ctx.drawImage(_noiseCanvas, 0, 0, W, H)
  ctx.restore()
  ctx.save()
  ctx.globalAlpha = 0.16; ctx.fillStyle = '#000'
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1)
  ctx.restore()
}

// ── Type (verbatim from index.html) ───────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  const words = text.split(' ')
  const lines = []
  let line = ''
  for (const w of words) {
    const test = line ? line + ' ' + w : w
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w }
    else line = test
  }
  if (line) lines.push(line)
  return lines
}
function titleLayout(ctx, card, maxW) {
  let size = 74, lines
  for (; size >= 24; size -= 2) {
    ctx.font = `700 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '-0.01em'
    lines = wrapText(ctx, card.title, maxW)
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width))
    if (lines.length <= 3 && widest <= maxW) break
  }
  const lineH = size
  const titleTop = 64
  const titleBottom = titleTop + lines.length * lineH
  const ruleY = titleBottom + 10
  return { size, lines, lineH, titleTop, ruleY, subTop: ruleY + 12 }
}

// ── Card face ─────────────────────────────────────────────────────────────────
function drawMediaCover(ctx, src, mw, mh) {
  if (!mw || !mh) return
  const s = Math.max(W / mw, H / mh)          // cover: fill the card, crop overflow
  ctx.drawImage(src, (W - mw * s) / 2, (H - mh * s) / 2, mw * s, mh * s)
}

function drawCard(card, t) {
  const ctx = card._ctx
  ctx.clearRect(0, 0, W, H)
  ctx.fillStyle = card.bg
  ctx.fillRect(0, 0, W, H)

  let footage = false
  if (card.cover) COVERS[card.cover](ctx, t)
  if (card._video && card._video.readyState >= 2) {
    drawMediaCover(ctx, card._video, card._video.videoWidth, card._video.videoHeight); footage = true
  }
  if (card._img && card._img.naturalWidth) {
    drawMediaCover(ctx, card._img, card._img.naturalWidth, card._img.naturalHeight); footage = true
  }

  // A scrim only where there is footage under the type. The drawn covers are
  // tonal — a shade of their own ground — so a scrim would just muddy them.
  if (footage) {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.52)
    g.addColorStop(0, 'rgba(0,0,0,0.72)'); g.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.52)
  }

  const t2 = titleLayout(ctx, card, W - LM * 2)
  ctx.font = `700 ${t2.size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '-0.01em'
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'
  ctx.fillStyle = 'rgba(255,255,255,0.95)'
  t2.lines.forEach((ln, i) => ctx.fillText(ln, LM, t2.titleTop + i * t2.lineH))

  ctx.strokeStyle = 'rgba(255,255,255,0.33)'; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(LM, t2.ruleY); ctx.lineTo(W - LM, t2.ruleY); ctx.stroke()

  if (card.sub) {
    ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = 'rgba(255,255,255,0.60)'
    ctx.fillText(card.sub, LM, t2.subTop)
  }

  applyTvStatic(ctx)
  if (card._tex) card._tex.needsUpdate = true
}

// ── The ring — the lobby's own numbers ────────────────────────────────────────
const RADIUS = 6.0, CAM_Z = 10.0
const scene = new THREE.Scene()
scene.background = new THREE.Color('#0e0b08')
scene.fog = new THREE.Fog('#0e0b08', 8, 50)

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200)
camera.position.set(0, 0, CAM_Z)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.outputEncoding = THREE.sRGBEncoding
renderer.domElement.className = 'ring'
document.body.appendChild(renderer.domElement)

const nearDist = CAM_Z - RADIUS
const vFOV = (camera.fov * Math.PI) / 180
const panelH = 0.9 * 2 * nearDist * Math.tan(vFOV / 2)
const panelW = panelH * (3 / 4)
const THICK = 0.16

const panelGeo = new THREE.BoxGeometry(panelW, panelH, THICK)
// Authored sRGB, converted for a linear pipeline. Handing 0x0b0b0b straight to
// the material makes it a mid grey once the renderer encodes out to sRGB — the
// edges read far lighter than the near-black they are meant to be.
const edgeMat = new THREE.MeshBasicMaterial({
  color: new THREE.Color('#0b0b0b').convertSRGBToLinear(),
})
// The lobby ring shows the far side of itself: you read the cards across the
// ring, reversed and dimmed. Matching that here (BACK_OPACITY 0.42) rather than
// capping the panels with an opaque back, which walls the ring off.
const BACK_OPACITY = 0.42

// ── Reflection ───────────────────────────────────────────────────────────────
// The glow each card casts on the floor of the ring. Ported from index.html
// (makePortalReflTex / REFL_FRAC / reflMesh) so a card here sits on the same
// ground as the one you clicked to arrive: a radial bloom in the card's own bg
// colour, hazed at the top where it meets the card and faded out at the foot.
const REFL_FRAC = 0.55
const reflH = panelH * REFL_FRAC
const reflGeo = new THREE.PlaneGeometry(panelW, reflH)

function makeReflTex(bgHex) {
  const r = parseInt(bgHex.slice(1, 3), 16)
  const g = parseInt(bgHex.slice(3, 5), 16)
  const b = parseInt(bgHex.slice(5, 7), 16)
  const CW = 256, CH = 160
  const c = document.createElement('canvas'); c.width = CW; c.height = CH
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(CW / 2, 0, 0, CW / 2, 0, CW * 0.72)
  grd.addColorStop(0,    `rgba(${r},${g},${b},0.55)`)
  grd.addColorStop(0.35, `rgba(${r},${g},${b},0.22)`)
  grd.addColorStop(0.7,  `rgba(${r},${g},${b},0.06)`)
  grd.addColorStop(1,    `rgba(${r},${g},${b},0.0)`)
  ctx.fillStyle = grd; ctx.fillRect(0, 0, CW, CH)
  const fade = ctx.createLinearGradient(0, 0, 0, CH)
  fade.addColorStop(0,    'rgba(14,11,8,0.55)')
  fade.addColorStop(0.12, 'rgba(14,11,8,0.0)')
  fade.addColorStop(0.7,  'rgba(14,11,8,0.0)')
  fade.addColorStop(1,    'rgba(14,11,8,0.82)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, CW, CH)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

CARDS.forEach((card, i) => {
  const c = document.createElement('canvas')
  c.width = W; c.height = H
  card._ctx = c.getContext('2d')

  const tex = new THREE.CanvasTexture(c)
  tex.encoding = THREE.sRGBEncoding
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
  card._tex = tex

  // Unlit face: the covers are tonal, and a lit material would shift the very
  // shades they are built out of.
  const face = new THREE.MeshBasicMaterial({ map: tex })
  const back = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: BACK_OPACITY })
  // BoxGeometry material order is +x, -x, +y, -y, +z, -z — the face is +z.
  const mesh = new THREE.Mesh(panelGeo, [edgeMat, edgeMat, edgeMat, edgeMat, face, back])
  const a = (i / COUNT) * Math.PI * 2
  mesh.position.set(Math.sin(a) * RADIUS, 0, Math.cos(a) * RADIUS)
  mesh.rotation.y = a
  mesh.userData.card = card

  const reflMesh = new THREE.Mesh(reflGeo, new THREE.MeshBasicMaterial({
    map: makeReflTex(card.bg), transparent: true, opacity: 0.38, depthWrite: false,
  }))
  reflMesh.position.set(0, -(panelH + reflH) / 2, THICK / 2 + 0.002)
  reflMesh.frustumCulled = false
  mesh.add(reflMesh)

  scene.add(mesh)
  card._mesh = mesh

  if (card.video) {
    const v = document.createElement('video')
    v.src = card.video
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true
    v.setAttribute('webkit-playsinline', '')
    v.play().catch(() => {})
    card._video = v
  }
  if (card.image) {
    const im = new Image()
    im.src = card.image
    im.onload = () => drawCard(card, 0)
    card._img = im
  }
})

const ring = new THREE.Group()
// Only the panels themselves — each reflection is a child of its own panel
// and travels with it, so lifting them here would tear them off.
CARDS.forEach(c => ring.add(c._mesh))
scene.add(ring)

// ── Interaction — the lobby's physics ─────────────────────────────────────────
const SENS = 0.005, FRICTION = 2.5, MAX_VEL = 6.0
const AUTO_SPEED = 0.0375, DRAG_THRESH = 6
let angle = -Math.PI / 2, angVel = AUTO_SPEED, autoDir = 1
let dragging = false, moved = 0, lastX = 0

const el = renderer.domElement
el.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX
  el.setPointerCapture(e.pointerId)
})
el.addEventListener('pointermove', (e) => {
  if (!dragging) return
  const dx = e.clientX - lastX; lastX = e.clientX
  moved += Math.abs(dx)
  angle += dx * SENS
  angVel = Math.max(-MAX_VEL, Math.min(MAX_VEL, dx * SENS * 60))
})
el.addEventListener('pointerup', (e) => {
  // Only a release that belongs to a press ON the ring counts. Without this,
  // any stray pointerup over the canvas — one whose press landed elsewhere, or
  // arrived before the first press — reads as a tap and opens whatever card is
  // under the cursor.
  const wasDragging = dragging
  dragging = false
  if (!wasDragging) return
  // A deliberate spin re-aims the idle direction and it keeps going that way.
  if (Math.abs(angVel) > AUTO_SPEED) autoDir = angVel > 0 ? 1 : -1
  if (moved < DRAG_THRESH) pick(e)
})

const raycaster = new THREE.Raycaster()
const pointer = new THREE.Vector2()
function pick(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1
  pointer.y = -(e.clientY / innerHeight) * 2 + 1
  raycaster.setFromCamera(pointer, camera)
  const hit = raycaster.intersectObjects(ring.children, false)[0]   // false: panels only, not their reflections
  if (!hit) return
  const card = hit.object.userData.card
  const story = FICTION_STORIES[card.id]
  if (story) openStory(card, story)
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

// ── Frame ─────────────────────────────────────────────────────────────────────
const clocks = {}
CARDS.forEach(c => { if (c.cover) clocks[c.id] = 0 })
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
let last = performance.now()

function frame(now) {
  requestAnimationFrame(frame)
  const dt = Math.min((now - last) / 1000, 0.05); last = now

  if (!dragging) {
    // Ease back to the idle drift rather than stopping dead.
    const target = AUTO_SPEED * autoDir
    angVel += (target - angVel) * Math.min(1, FRICTION * dt)
    angle += angVel * dt
  }
  ring.rotation.y = angle

  // The reader sits over the ring; there is nothing to draw behind a page of text.
  if (!document.getElementById('reader').classList.contains('open')) {
    regenNoise()
    for (const card of CARDS) {
      if (card.cover && !reduced) clocks[card.id] += dt * COVER_SPEED[card.cover]
      if (card._video || card.cover) drawCard(card, clocks[card.id] || 0)
    }
    renderer.render(scene, camera)
  }
}

;(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  regenNoise()
  CARDS.forEach(card => { if (!card._video && !card.cover) drawCard(card, 0) })
  requestAnimationFrame(frame)
})

// ── Reading view ──────────────────────────────────────────────────────────────
const reader = document.getElementById('reader')
const readerCol = document.getElementById('readerCol')
let storyPushed = false

function openStory(card, story) {
  readerCol.innerHTML =
    `<h2>${story.title}</h2>` +
    (card.sub ? `<p class="sub">${card.sub}</p>` : '') +
    '<hr>' +
    story.paras.map(p => `<p>${p}</p>`).join('')
  reader.classList.add('open')
  reader.setAttribute('aria-hidden', 'false')
  reader.scrollTop = 0
  history.pushState({ story: card.id }, '')
  storyPushed = true
}
function hideReader() {
  reader.classList.remove('open')
  reader.setAttribute('aria-hidden', 'true')
  last = performance.now()                    // no jump from the paused clock
}
function closeStory() {
  if (!reader.classList.contains('open')) return
  hideReader()
  if (storyPushed) { storyPushed = false; history.back() }
}
reader.querySelector('.close').addEventListener('click', closeStory)
addEventListener('popstate', () => {
  if (reader.classList.contains('open')) { storyPushed = false; hideReader() }
})
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStory() })

document.getElementById('backBtn').onclick = () => {
  // Embedded in the ring's card overlay this drives the PARENT's history, which
  // trips its popstate handler and closes the overlay. Standalone it just goes back.
  if (window !== window.top) { try { window.parent.history.back(); return } catch (e) {} }
  if (history.length > 1) history.back(); else location.href = 'index.html'
}
</script>
</body>
</html>
