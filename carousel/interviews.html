<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oswin Journal — Interviews</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  html, body { margin:0; min-height:100%; background:#0e0b08; color:#fff;
               font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; }
  /* The ring is WebGL — index.html's renderer, the same one Oli's room and the
     fiction room use — so the canvas fills the window and the chrome rides on
     top of it. */
  main { display:none; }
  body > canvas { position:fixed; inset:0; width:100%; height:100%; display:block;
                  touch-action:pan-y; cursor:grab; }
  body.dragging > canvas { cursor:grabbing; }

  #backBtn {
    position:fixed; top:20px; left:22px; z-index:20;
    padding:6px 4px; border:none; background:none; cursor:pointer;
    color:rgba(255,255,255,0.55); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing:0.22em; transition:color 200ms ease;
  }
  #backBtn:hover { color:rgba(255,255,255,0.92); }

  .mast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:20;
          background:#F9FF45; color:#111111; font-weight:700; letter-spacing:-0.01em;
          font-size:15px; line-height:1; padding:9px 16px; border-radius:2px; }

  /* ── Reading view ─────────────────────────────────────────────────────────
     The stories are long, so they get a proper column rather than being drawn
     onto a card face the way the ring's short bodies are. */
  #reader { position:fixed; inset:0; z-index:1000; background:#0a0a0a;
            overflow-y:auto; -webkit-overflow-scrolling:touch; display:none; }
  #reader.open { display:block; }
  #reader .col { max-width:38em; margin:0 auto; padding:104px 26px 120px; }
  #reader h2 { margin:0; font-size:54px; line-height:1; font-weight:700; letter-spacing:-0.01em; }
  #reader .sub { margin:14px 0 0; font-size:13px; font-weight:300; letter-spacing:0.16em;
                 text-transform:uppercase; color:rgba(255,255,255,0.5); }
  #reader hr { border:0; border-top:1px solid rgba(255,255,255,0.18); margin:26px 0 34px; }
  #reader .portrait { display:block; width:100%; height:auto; margin:0 0 30px; border-radius:2px; }
  #reader .deck { font-size:21px; line-height:1.5; font-weight:300; color:rgba(255,255,255,0.94); margin:0 0 1.4em; }
  #reader .disclosure { font-size:18px; line-height:1.62; font-weight:300; color:rgba(255,255,255,0.62);
                        border-left:2px solid rgba(249,255,69,0.7); padding-left:16px; margin:0 0 1.6em; }
  #reader h3 { margin:2.2em 0 0.9em; font-size:13px; font-weight:500; letter-spacing:0.18em;
               text-transform:uppercase; color:#F9FF45; }
  #reader .q { font-size:18px; line-height:1.62; font-weight:500; color:#FFFFFF; margin:0 0 0.7em; }
  #reader p { margin:0 0 1.5em; font-size:18px; line-height:1.62; font-weight:300;
              color:rgba(255,255,255,0.86); }
  #reader .close { position:fixed; top:20px; left:22px; z-index:1001;
                   padding:6px 4px; border:none; background:none; cursor:pointer;
                   color:rgba(255,255,255,0.55); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
                   letter-spacing:0.22em; transition:color 200ms ease; }
  #reader .close:hover { color:rgba(255,255,255,0.92); }
</style>
</head>
<body>

<button id="backBtn" aria-label="Back">←&nbsp;&nbsp;BACK</button>
<div class="mast">INTERVIEWS</div>

<main>
  <!-- The ring's canvas is appended here by the renderer. -->
</main>

<div id="reader" aria-hidden="true">
  <button class="close" type="button">←&nbsp;&nbsp;CLOSE</button>
  <div class="col" id="readerCol"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="interviews.js"></script>
<script>
// ── Interviews — the room behind the ring's INTERVIEWS card ──────────────────
// The desktop counterpart of the phone grid's interviews room: the same three
// pieces in issue order, on the ring's own 600x800 card face at its 54px margin.
//
// Laid out as a rack rather than a ring. Three panels on a carousel sized for
// eight reads sparse, and these are a set to be compared rather than a sequence
// to be spun through — the fiction room next door keeps the ring, where eight
// pieces earn it.
//
// An interview is longer and more structured than a story — a portrait, a
// standing head, an intro, sections, then the questions — so the reading view
// carries that shape rather than a flat run of paragraphs. The writing comes
// from interviews.js, shared with mobile.html.

const W = 600, H = 800, LM = 54
// A fifth of a card's width at the same height. Declared up here with the card
// dimensions, not down with the geometry: the canvas-sizing loop below needs it
// first, and a const read before its declaration throws and kills the script.
const SPINE_ASPECT = (3 / 4) / 5

// Newest first: 4, 3, 2, 1. INTERVIEWS_BY_ISSUE is the reading order ascending
// and is shared with mobile.html, so it is copied before reversing rather than
// turned over in place — reverse() mutates, and the other front end would get
// the flip too.
const CARDS = [...INTERVIEWS_BY_ISSUE].reverse().map(iv => ({
  id: iv.id,
  title: iv.title,
  sub: iv.sub,
  image: iv.portrait,
  bg: '#1a1a1a',
  iv,
}))

// Two cards that are not interviews. Spliced in by POSITION rather than added
// to interviews.js: that file is the issue list, and neither of these has an
// issue number for it to sort by.
//
// Order ends up: Karla, Chris, Schoenberg, FICTION, Oli, Oswin Gallery.

// A slim board, a fifth of a card's width at the same height, with the word
// turned on its side — the same object the paintings ring uses for INTERVIEW.
// After Arnold.
// Positioned by ANCHOR, not by index: both were asked for relative to a
// particular interview, and an index would have quietly meant something else
// the moment the issues were reversed.
function insertAfter(id, card) {
  const i = CARDS.findIndex((c) => c.id === id)
  CARDS.splice(i < 0 ? CARDS.length : i + 1, 0, card)
}

insertAfter('schoenberg', {
  id: 'fiction',
  spine: 'FICTION',
  href: 'fiction.html',
  bg: '#FFFFFF',
  light: true,
})

// The gallery notice, after Karla — so it closes the ring rather than
// interrupting the run of issues.
insertAfter('karla', {
  id: 'oswin-gallery',
  title: 'OSWIN GALLERY',
  // A list of notices rather than one set of fields, so a third is a list entry
  // and not another pair of properties threaded through the renderer.
  // `lines` are broken by hand: the measure would fit "No Beginning, No End" on
  // one line, and the break belongs after the comma.
  blocks: [
    { label: 'currently showing', lines: ['No Beginning,', 'No End'], foot: 'Alex Taves' },
    // small: the name takes the foot's treatment instead of the reading size,
    // so the whole upcoming notice sits quieter than what is currently on.
    { label: 'upcoming', lines: ['Oli Goldsmith'], small: true, foot: 'Feb 12, 2027' },
  ],
  bg: '#FFFFFF',
  light: true,          // light ground, so drawCardBase mirrors the ink
})

const COUNT = CARDS.length

// ── TV static (index.html: GRAIN_LIGHTEN / GRAIN_MULTIPLY) ────────────────────
const _noiseCanvas = document.createElement('canvas')
_noiseCanvas.width = 220; _noiseCanvas.height = 293
const _noiseCtx = _noiseCanvas.getContext('2d')
function regenNoise() {
  const id = _noiseCtx.createImageData(_noiseCanvas.width, _noiseCanvas.height)
  const d = id.data
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255
  }
  _noiseCtx.putImageData(id, 0, 0)
}
const GRAIN_LIGHTEN = 0.088, GRAIN_MULTIPLY = 0.06
// Sized per call: a spine's canvas is not the cards' 600x800, and stretching
// the field to the wrong box would scale the grain differently on it.
function applyTvStatic(ctx, w = W, h = H) {
  ctx.save()
  ctx.imageSmoothingEnabled = false
  ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = GRAIN_LIGHTEN
  ctx.drawImage(_noiseCanvas, 0, 0, w, h)
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = GRAIN_MULTIPLY
  ctx.drawImage(_noiseCanvas, 0, 0, w, h)
  ctx.restore()
  ctx.save()
  ctx.globalAlpha = 0.16; ctx.fillStyle = '#000'
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1)
  ctx.restore()
}

// ── Type (verbatim from index.html) ───────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  const words = text.split(' ')
  const lines = []
  let line = ''
  for (const w of words) {
    const test = line ? line + ' ' + w : w
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w }
    else line = test
  }
  if (line) lines.push(line)
  return lines
}
function titleLayout(ctx, card, maxW) {
  let size = 74, lines
  for (; size >= 24; size -= 2) {
    ctx.font = `700 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '-0.01em'
    lines = wrapText(ctx, card.title, maxW)
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width))
    if (lines.length <= 3 && widest <= maxW) break
  }
  const lineH = size
  const titleTop = 64
  const titleBottom = titleTop + lines.length * lineH
  const ruleY = titleBottom + 10
  return { size, lines, lineH, titleTop, ruleY, subTop: ruleY + 12 }
}

// ── Card face ─────────────────────────────────────────────────────────────────
function drawMediaCover(ctx, src, mw, mh) {
  if (!mw || !mh) return
  const s = Math.max(W / mw, H / mh)          // cover: fill the card, crop overflow
  ctx.drawImage(src, (W - mw * s) / 2, (H - mh * s) / 2, mw * s, mh * s)
}

// Split from the static so the loop can re-lay fresh noise over cached content
// without redrawing the portrait and the type sixty times a second.
function drawCardBase(card, ctx) {
  // A light card needs dark ink. Everything here was written for white-on-near-
  // black, so the weights are mirrored rather than hard-coded twice.
  const INK = card.light
    ? { title: 'rgba(17,17,17,0.95)', rule: 'rgba(17,17,17,0.30)',
        sub: 'rgba(17,17,17,0.55)', show: 'rgba(17,17,17,0.92)', artist: 'rgba(17,17,17,0.60)' }
    : { title: 'rgba(255,255,255,0.95)', rule: 'rgba(255,255,255,0.33)',
        sub: 'rgba(255,255,255,0.60)', show: 'rgba(255,255,255,0.92)', artist: 'rgba(255,255,255,0.62)' }
  const CW = card._w, CH = card._h
  ctx.clearRect(0, 0, CW, CH)
  ctx.fillStyle = card.bg
  ctx.fillRect(0, 0, CW, CH)

  // A spine carries one word and nothing else, turned a quarter turn clockwise
  // so it reads top to bottom. Same face as the card titles: Helvetica Neue at
  // 700, tightened the same way.
  if (card.spine) {
    ctx.save()
    ctx.translate(CW / 2, CH / 2)
    ctx.rotate(Math.PI / 2)
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.font = "700 74px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '-0.01em'
    ctx.fillStyle = INK.title
    ctx.fillText(card.spine, 0, 0)
    ctx.restore()
    return
  }

  let footage = false
  if (card._video && card._video.readyState >= 2) {
    drawMediaCover(ctx, card._video, card._video.videoWidth, card._video.videoHeight); footage = true
  }
  if (card._img && card._img.naturalWidth) {
    drawMediaCover(ctx, card._img, card._img.naturalWidth, card._img.naturalHeight); footage = true
  }

  // A scrim only where there is footage under the type. The drawn covers are
  // tonal — a shade of their own ground — so a scrim would just muddy them.
  if (footage) {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.52)
    g.addColorStop(0, 'rgba(0,0,0,0.72)'); g.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.52)
  }

  const t2 = titleLayout(ctx, card, W - LM * 2)
  ctx.font = `700 ${t2.size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '-0.01em'
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'
  ctx.fillStyle = INK.title
  t2.lines.forEach((ln, i) => ctx.fillText(ln, LM, t2.titleTop + i * t2.lineH))

  ctx.strokeStyle = INK.rule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(LM, t2.ruleY); ctx.lineTo(W - LM, t2.ruleY); ctx.stroke()

  if (card.sub) {
    ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = INK.sub
    ctx.fillText(card.sub, LM, t2.subTop)
  }

  // What is on. Set below the standing head rather than in it: the show's name
  // is the thing to read on this card, so it takes the weight the portraits give
  // their sitter's name, with the artist quieter beneath it.
  // Each notice is label / name / foot, in three weights and only two sizes:
  // the name takes the card's reading size, and the label and foot share the
  // standing head's — the foot bold and in caps so it reads as its pair rather
  // than as a third size.
  if (card.blocks) {
    let y = t2.subTop
    card.blocks.forEach((b, bi) => {
      if (bi > 0) y += 34                     // air between notices
      ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
      ctx.letterSpacing = '0.16em'
      ctx.fillStyle = INK.sub
      ctx.fillText(b.label, LM, y)
      y += 46

      if (b.small) {
        // Same weight, size and tracking as the foot below it.
        ctx.font = "700 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
        ctx.letterSpacing = '0.16em'
        ctx.fillStyle = INK.show
        b.lines.forEach((ln) => { ctx.fillText(ln, LM, y); y += 24 })
        y -= 24
      } else {
        ctx.font = "600 38px 'Helvetica Neue', Helvetica, Arial, sans-serif"
        ctx.letterSpacing = '-0.01em'
        ctx.fillStyle = INK.show
        b.lines.forEach((ln) => { ctx.fillText(ln, LM, y); y += 44 })
        y -= 44
      }
      y += b.small ? 24 : 44

      if (b.foot) {
        y += b.small ? 2 : 16
        ctx.font = "700 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
        ctx.letterSpacing = '0.16em'
        ctx.fillStyle = INK.artist
        ctx.fillText(b.foot.toUpperCase(), LM, y)
        y += 22
      }
    })
  }

}

// Content cached once; the loop lays live static over it (see frame()).
function cacheBase(card) {
  if (!card._base) {
    card._base = document.createElement('canvas')
    card._base.width = card._w; card._base.height = card._h
  }
  drawCardBase(card, card._base.getContext('2d'))
}

function drawCard(card) {
  cacheBase(card)
  card._ctx.clearRect(0, 0, card._w, card._h)
  card._ctx.drawImage(card._base, 0, 0)
  applyTvStatic(card._ctx, card._w, card._h)
}

const REFL_FRAC = 0.55            // the ring's own proportion

// The card, upside down beneath itself, fading to nothing. Drawn from the
// finished face so it carries the type and the static too, not just the photo.

// ── Build ────────────────────────────────────────────────────────────────────
// Each portrait still paints into its own 600x800 canvas; that canvas is now a
// texture on a ring panel rather than a DOM element.
CARDS.forEach((card, i) => {
  card._slot = i
  // A spine's canvas is its own shape, not the cards' 600x800 — drawing a
  // narrow board into a wide canvas would letterbox it.
  card._w = card.spine ? 160 : W
  card._h = card.spine ? Math.round(160 / SPINE_ASPECT) : H
  const c = document.createElement('canvas')
  c.width = card._w; c.height = card._h
  card._ctx = c.getContext('2d')
  card._face = c

  if (!card.image) return          // nothing to load; painted with the statics

  const im = new Image()
  im.src = card.image
  im.onload = () => {
    drawCard(card)
    if (card._faceTex) card._faceTex.needsUpdate = true
    if (card._backTex) refreshBack(card)
  }
  card._img = im
})

// ── Ring ─────────────────────────────────────────────────────────────────────
// index.html's ring, lifted rather than approximated: same RADIUS and CAM_Z,
// same panelH arithmetic off CARD_FOV_FRAC, same BoxGeometry with six
// materials, same rounded alpha map, same glow reflection. SLOTS placements of
// which the first few carry a card, so issue 5 drops into the next placement
// and the ones already there do not move.
const SLOTS  = 9
const RADIUS = 6.0
const CAM_Z  = 10.0

const scene = new THREE.Scene()
const bgC = document.createElement('canvas'); bgC.width = 4; bgC.height = 512
const bgCtx2 = bgC.getContext('2d')
const bgG = bgCtx2.createLinearGradient(0, 0, 0, 512)
bgG.addColorStop(0, '#16110d'); bgG.addColorStop(1, '#0a0704')
bgCtx2.fillStyle = bgG; bgCtx2.fillRect(0, 0, 4, 512)
const bgTex = new THREE.CanvasTexture(bgC); bgTex.encoding = THREE.sRGBEncoding
scene.background = bgTex
scene.fog = new THREE.Fog('#0e0b08', 8, 50)   // refitted to the ring below

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400)
camera.lookAt(0, 0, 0)   // placed below, once the ring's radius is known

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.appendChild(renderer.domElement)

const envScene = new THREE.Scene()
envScene.background = new THREE.Color('#0e0b08')
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 200).texture
scene.add(new THREE.HemisphereLight('#2a1a0a', '#0e0806', 0.15))
const keyLight = new THREE.DirectionalLight('#ffffff', 1.1); keyLight.position.set(4, 6, 5)
const rimLight = new THREE.DirectionalLight('#ffcf90', 0.5); rimLight.position.set(-5, 2, -4)
scene.add(keyLight, rimLight)

const nearDist = CAM_Z - RADIUS
const vFOV = (camera.fov * Math.PI) / 180
// How much of the vertical field of view a card fills. Was 0.9; trimmed by 5%
// so the ring sits a touch shorter in the window — the same number the homepage,
// Oli's room and the fiction room carry.
const CARD_FOV_FRAC = 0.855
const panelH = CARD_FOV_FRAC * 2 * nearDist * Math.tan(vFOV / 2)
const panelW = panelH * (3 / 4)
const THICK = 0.16 * (CARD_FOV_FRAC / 0.9)
const FRONT_OPACITY = 0.92
const BACK_OPACITY = 0.42
const reflH = panelH * REFL_FRAC
const panelGeo = new THREE.BoxGeometry(panelW, panelH, THICK)
const reflGeo = new THREE.PlaneGeometry(panelW, reflH)

const spineW = panelH * SPINE_ASPECT
const spineGeo = new THREE.BoxGeometry(spineW, panelH, THICK)
const spineReflGeo = new THREE.PlaneGeometry(spineW, reflH)
const widthOf = (card) => (card.spine ? spineW : panelW)

// Cards are NOT evenly spaced. Equal slots sized for the widest card leave a
// slim board marooned between two full-width gaps. Each card instead gets an
// arc of its OWN width plus a share of the gap, and the radius is whatever
// closes the circle — so the space between any two neighbours is the same.
//
// A spine contributes NO padding of its own, which leaves only its neighbours'
// halves: exactly half the space either side of it, by construction.
const RING_GAP = panelW * 0.57
const ARCS = CARDS.map((c) => widthOf(c) + (c.spine ? 0 : RING_GAP))
const CIRCUM = ARCS.reduce((a, b) => a + b, 0)

// The RADIUS stays what it always was. Solving it from the arcs instead — the
// way the paintings ring does — packs the cards into a complete circle, and
// with only six of them that circle came out at half the size: the ring drew
// in to 3.1 and the neighbours loomed over the frame.
//
// This room was built with spare placements and should keep them. So the arcs
// set the ANGLES at a fixed radius, and whatever they do not use stays empty
// arc behind you — the same roominess as before, but with each card's share
// sized to its own width.
const RING_RADIUS = RADIUS
const SLOT_ANGLE = (() => {
  const out = []; let acc = 0
  ARCS.forEach((w) => { out.push((acc + w / 2) / RING_RADIUS); acc += w })
  return out
})()
const MEAN_STEP = (Math.PI * 2) / CARDS.length

// Now that the radius is known, sit the camera back from it and refit the fog.
// Both were declared above, before this block could exist — reading RING_RADIUS
// up there is a dead-zone error that kills the whole script.
camera.position.set(0, 0, RING_RADIUS + nearDist)
camera.lookAt(0, 0, 0)
scene.fog.near = RING_RADIUS + nearDist - 2
scene.fog.far = RING_RADIUS * 3.6

function makeRoundedAlphaMap(aspect) {
  const AW = 128, AH = Math.round(AW / aspect)
  const c = document.createElement('canvas'); c.width = AW; c.height = AH
  const ctx = c.getContext('2d')
  const r = 5
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, AW, AH)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.lineTo(AW - r, 0)
  ctx.arcTo(AW, 0, AW, r, r); ctx.lineTo(AW, AH - r)
  ctx.arcTo(AW, AH, AW - r, AH, r); ctx.lineTo(r, AH)
  ctx.arcTo(0, AH, 0, AH - r, r); ctx.lineTo(0, r)
  ctx.arcTo(0, 0, r, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  return new THREE.CanvasTexture(c)
}
const roundedAlphaMap = makeRoundedAlphaMap(3 / 4)
const spineAlphaMap = makeRoundedAlphaMap(SPINE_ASPECT)

function makePortalReflTex(bgHex) {
  const r = parseInt(bgHex.slice(1, 3), 16)
  const g = parseInt(bgHex.slice(3, 5), 16)
  const b = parseInt(bgHex.slice(5, 7), 16)
  const RW = 256, RH = 160
  const c = document.createElement('canvas'); c.width = RW; c.height = RH
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(RW / 2, 0, 0, RW / 2, 0, RW * 0.72)
  grd.addColorStop(0,    'rgba(' + r + ',' + g + ',' + b + ',0.55)')
  grd.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.22)')
  grd.addColorStop(0.7,  'rgba(' + r + ',' + g + ',' + b + ',0.06)')
  grd.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0.0)')
  ctx.fillStyle = grd; ctx.fillRect(0, 0, RW, RH)
  const fade = ctx.createLinearGradient(0, 0, 0, RH)
  fade.addColorStop(0,    'rgba(14,11,8,0.55)')
  fade.addColorStop(0.12, 'rgba(14,11,8,0.0)')
  fade.addColorStop(0.7,  'rgba(14,11,8,0.0)')
  fade.addColorStop(1,    'rgba(14,11,8,0.82)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, RW, RH)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

function refreshBack(card) {
  const img = card._backTex.image
  const ctx = img.getContext('2d')
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.clearRect(0, 0, img.width, img.height)
  ctx.save(); ctx.translate(img.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(card._face, 0, 0); ctx.restore()
  card._backTex.needsUpdate = true
}

function makeFlippedTex(src) {
  const c = document.createElement('canvas')
  c.width = src.width; c.height = src.height
  const ctx = c.getContext('2d')
  ctx.translate(c.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(src, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

const ring = new THREE.Group()
scene.add(ring)

CARDS.forEach((card) => {
  const faceTex = new THREE.CanvasTexture(card._face)
  faceTex.encoding = THREE.sRGBEncoding
  const backTex = makeFlippedTex(card._face)
  const panelCol = new THREE.Color(card.bg)

  const faceMat = new THREE.MeshPhysicalMaterial({
    map: faceTex, transparent: true, opacity: FRONT_OPACITY, side: THREE.FrontSide,
    roughness: 0.55, metalness: 0.0, envMapIntensity: 0.12,
    color: new THREE.Color(0xffffff), alphaMap: card.spine ? spineAlphaMap : roundedAlphaMap,
  })
  const glassMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: BACK_OPACITY,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const backMat = new THREE.MeshPhysicalMaterial({
    map: backTex, transparent: true, opacity: 0.72,
    roughness: 0.6, metalness: 0.0, color: new THREE.Color(0xffffff), alphaMap: card.spine ? spineAlphaMap : roundedAlphaMap,
  })
  const sideMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: 0.65,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const reflMat = new THREE.MeshBasicMaterial({
    map: makePortalReflTex(card.bg), transparent: true, opacity: 0.38,
  })

  const mesh = new THREE.Mesh(card.spine ? spineGeo : panelGeo, [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
  mesh.frustumCulled = false
  mesh.userData.card = card

  const reflMesh = new THREE.Mesh(card.spine ? spineReflGeo : reflGeo, reflMat)
  reflMesh.position.set(0, -(panelH + reflH) / 2, THICK / 2 + 0.002)
  reflMesh.frustumCulled = false
  mesh.add(reflMesh)

  ring.add(mesh)
  card._mesh = mesh
  card._faceTex = faceTex
  card._backTex = backTex
})

// Each panel is set from its CURRENT orbit position — rotation.y = atan2(x, z)
// turns it to face straight out from the centre, which at the front of the ring
// is straight at the camera. index.html does it this way rather than rotating a
// parent; a group rotation plus a fixed local angle double-counts the turn.
function placePanels() {
  CARDS.forEach((card) => {
    const a = SLOT_ANGLE[card._slot] + spin
    const x = Math.cos(a) * RING_RADIUS, z = Math.sin(a) * RING_RADIUS
    card._mesh.position.set(x, 0, z)
    card._mesh.rotation.set(0, Math.atan2(x, z), 0)
  })
}

function slotSpin(card) { return Math.PI / 2 - SLOT_ANGLE[card._slot] }

// Arrive facing the middle card, so the ring opens with a filled placement on
// either side rather than everything stacked off one edge — unless ?i names an
// interview, which is how the homepage's INTERVIEW card lands you on the piece
// it shows rather than on whatever happens to sit in the middle.
const _wantId = new URLSearchParams(location.search).get('i')
// Opens on Oli — the latest interview — rather than on whatever happens to sit
// in the middle. ?i= still overrides it, which is how the homepage card lands
// you on a specific piece. The middle stays the last resort for a set that has
// no latest.
const _startCard = (_wantId && CARDS.find((c) => c.id === _wantId))
  || CARDS.find((c) => c.id === 'oli')
  || CARDS[Math.floor((CARDS.length - 1) / 2)]
let spin = slotSpin(_startCard), target = spin
let dragging = false, dragFrom = 0, spinFrom = 0, moved = 0, activeId = null
let lastDragEnd = -Infinity, lastDragMoved = 0

function nearestFilled(from) {
  let best = from, bestD = Infinity
  CARDS.forEach((card) => {
    let a = slotSpin(card)
    a += Math.round((from - a) / (Math.PI * 2)) * Math.PI * 2
    const d = Math.abs(from - a)
    if (d < bestD) { bestD = d; best = a }
  })
  return best
}

const cv = renderer.domElement

cv.addEventListener('pointerdown', (e) => {
  // One gesture, primary contact only: a duplicate down would re-read the
  // baseline mid-drag and throw away the travel so far.
  if (dragging || !e.isPrimary) return
  dragging = true; moved = 0; activeId = e.pointerId
  dragFrom = e.clientX; spinFrom = spin
  document.body.classList.add('dragging')
  // No setPointerCapture: it retargets the click away from the canvas, and the
  // raycast below needs it.
})

addEventListener('pointermove', (e) => {
  if (!dragging || e.pointerId !== activeId) return
  const dx = e.clientX - dragFrom
  moved = Math.max(moved, Math.abs(dx))
  // Negated so the ring travels WITH the hand: drag left and the card that was
  // on the right comes to the centre.
  spin = target = spinFrom - (dx / (innerWidth / 3)) * MEAN_STEP
})

function endDrag(e) {
  if (!dragging || (e && e.pointerId !== activeId)) return
  dragging = false; activeId = null
  document.body.classList.remove('dragging')
  lastDragEnd = performance.now(); lastDragMoved = moved
  target = nearestFilled(spin)
}
addEventListener('pointerup', endDrag)
addEventListener('pointercancel', endDrag)

const raycaster = new THREE.Raycaster()
const ndc = new THREE.Vector2()

cv.addEventListener('click', (e) => {
  // A drag ends in a click too. Ignored by time rather than a flag, which would
  // stick whenever a drag ends without one.
  if (lastDragMoved > 6 && performance.now() - lastDragEnd < 300) return
  ndc.x = (e.clientX / innerWidth) * 2 - 1
  ndc.y = -(e.clientY / innerHeight) * 2 + 1
  raycaster.setFromCamera(ndc, camera)
  const hit = raycaster.intersectObjects(ring.children, false)[0]
  if (!hit) return
  const card = hit.object.userData.card
  if (!card) return
  // An off-centre card turns to face you first; only the front one opens.
  if (Math.abs(((spin - slotSpin(card)) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI) > 0.25) {
    target = nearestFilled(slotSpin(card))
    return
  }
  // Only a card already at the centre acts, the same contract the other rings
  // use. The notice and the spine have no interview behind them — openInterview
  // reads card.iv and would throw on a card that has none.
  if (card.href) {
    if (Math.abs(slotSpin(card) - spin) < 0.01) { location.replace(card.href); return }
    target = nearestFilled(slotSpin(card)); return
  }
  if (!card.iv) { target = nearestFilled(slotSpin(card)); return }
  openInterview(card)
})

addEventListener('keydown', (e) => {
  if (reader.classList.contains('open')) return
  const step = MEAN_STEP
  if (e.key === 'ArrowLeft')  target = nearestFilled(target + step * 0.6)
  if (e.key === 'ArrowRight') target = nearestFilled(target - step * 0.6)
})

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

function frame() {
  // One fresh noise field per frame, shared by every card — the same field they
  // already shared within a single paint. Only the static is re-laid; the
  // content underneath is the cached base, so this costs a blit per card rather
  // than a redraw of the portrait and the type.
  regenNoise()
  CARDS.forEach((card) => {
    if (!card._base) return                 // not painted yet; fonts resolving
    card._ctx.clearRect(0, 0, card._w, card._h)
    card._ctx.drawImage(card._base, 0, 0)
    applyTvStatic(card._ctx, card._w, card._h)
    card._faceTex.needsUpdate = true
  })

  spin += (target - spin) * 0.16
  if (Math.abs(target - spin) < 0.0001) spin = target
  placePanels()
  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}

// Portraits are stills, so the faces are painted once rather than per frame. The
// static is regenerated per paint, which is what gives each card its own grain
// rather than four identical fields.
;(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  CARDS.forEach((card) => {
    regenNoise()
    drawCard(card)
    card._faceTex.needsUpdate = true
    refreshBack(card)
  })
})
placePanels()
frame()

// ── Reading view ──────────────────────────────────────────────────────────────
const reader = document.getElementById('reader')
const readerCol = document.getElementById('readerCol')
let storyPushed = false

function openInterview(card) {
  const iv = card.iv
  const esc = []
  esc.push(`<img class="portrait" src="${iv.portrait}" alt="">`)
  esc.push(`<h2>${iv.title}</h2>`)
  if (iv.sub) esc.push(`<p class="sub">${iv.sub}</p>`)
  esc.push('<hr>')
  if (iv.deck) esc.push(`<p class="deck">${iv.deck}</p>`)
  // A standing head, not a footnote: it sits above the piece, in the reading
  // size, so it is read rather than skipped.
  if (iv.disclosure) esc.push(`<p class="disclosure">${iv.disclosure}</p>`)
  ;(iv.intro || []).forEach(p => esc.push(`<p>${p}</p>`))
  ;(iv.sections || []).forEach(sec => {
    esc.push(`<h3>${sec.heading}</h3>`)
    sec.paras.forEach(p => esc.push(`<p>${p}</p>`))
  })
  if (iv.qaLead) esc.push(`<h3>${iv.qaLead}</h3>`)
  // An unanswered question is a question still out; it is not shown as a gap.
  ;(iv.qa || []).forEach(x => {
    if (x.q) esc.push(`<p class="q">${x.q}</p>`)
    if (x.a) esc.push(`<p>${x.a}</p>`)
  })
  readerCol.innerHTML = esc.join('')
  reader.classList.add('open')
  reader.setAttribute('aria-hidden', 'false')
  reader.scrollTop = 0
  history.pushState({ interview: card.id }, '')
  storyPushed = true
}

function hideReader() {
  reader.classList.remove('open')
  reader.setAttribute('aria-hidden', 'true')
  last = performance.now()                    // no jump from the paused clock
}
function closeStory() {
  if (!reader.classList.contains('open')) return
  hideReader()
  if (storyPushed) { storyPushed = false; history.back() }
}
reader.querySelector('.close').addEventListener('click', closeStory)
addEventListener('popstate', () => {
  if (reader.classList.contains('open')) { storyPushed = false; hideReader() }
})
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStory() })

document.getElementById('backBtn').onclick = () => {
  // Embedded in the ring's card overlay this drives the PARENT's history, which
  // trips its popstate handler and closes the overlay. Standalone it just goes back.
  if (window !== window.top) { try { window.parent.history.back(); return } catch (e) {} }
  if (history.length > 1) history.back(); else location.href = 'index.html'
}
</script>
</body>
</html>
