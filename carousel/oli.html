<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oswin Journal — Oli Goldsmith</title>
<style>
  html, body { margin:0; min-height:100vh; background:#0a0a0a; color:#fff;
               font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; }

  /* Same idle-reveal BACK the other carousel sub-pages draw for themselves —
     index.html deliberately supplies none for relative-URL cards. */
  #backBtn {
    position:fixed; top:20px; left:22px; z-index:20;
    padding:6px 4px; border:none; background:none; cursor:pointer;
    color:rgba(255,255,255,0.55); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing:0.22em; transition:color 200ms ease;
  }
  #backBtn:hover { color:rgba(255,255,255,0.92); }

  /* Fullscreen toggle — the ring's own control, same position, chip and icon. */
  #fsBtn {
    position: fixed; top: 20px; right: 20px; z-index: 30;
    background: rgba(255, 255, 255, 0.08); border: none; border-radius: 4px;
    padding: 8px; line-height: 0; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.55s ease;
  }
  #fsBtn svg { display: block; }

  /* Symmetric padding so the rack centres on the WINDOW, not on a box that was
     offset to clear the BACK button. At 80vh the cards leave 10vh above them at
     any window height, which clears BACK on its own. */
  /* The ring is WebGL now — index.html's renderer, not a lookalike — so the
     canvas simply fills the window and the chrome rides on top of it. */
  main { display:none; }
  body > canvas { position:fixed; inset:0; width:100%; height:100%; display:block;
                  touch-action:pan-y; cursor:grab; }
  body.dragging > canvas { cursor:grabbing; }

  /* Tonal tuner — only ever built when ?tune is in the URL (see the bottom of
     the script). Not a visitor-facing control: it exists so the duotone can be
     dialled in against the real card, lit by the real ring, instead of guessed
     at a hex at a time. */
  #tuner { position:fixed; top:14px; right:14px; z-index:3000; width:244px;
           max-height:calc(100vh - 28px); overflow-y:auto;
           padding:14px 16px 12px; border-radius:4px;
           background:rgba(12,12,12,0.9); backdrop-filter:blur(8px);
           border:1px solid rgba(255,255,255,0.14);
           font:400 11px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif;
           color:rgba(255,255,255,0.86); }
  #tuner h4 { margin:14px 0 9px; font-size:10px; font-weight:600;
              letter-spacing:0.18em; text-transform:uppercase;
              color:rgba(255,255,255,0.5); }
  #tuner label { display:block; margin:0 0 9px; }
  #tuner .row { display:flex; justify-content:space-between; margin-bottom:3px;
                letter-spacing:0.06em; }
  #tuner .row b { font-weight:500; color:#fff; font-variant-numeric:tabular-nums; }
  #tuner input[type=range] { width:100%; margin:0; accent-color:#FFE24A; }
  #tuner .swatches { display:flex; gap:6px; margin:10px 0 8px; }
  #tuner .sw { flex:1; height:22px; border-radius:2px;
               border:1px solid rgba(255,255,255,0.18); }
  #tuner code { display:block; padding:7px 8px; border-radius:2px;
                background:rgba(0,0,0,0.5); color:#FFE24A;
                font:500 10px/1.6 ui-monospace, Menlo, monospace;
                user-select:all; white-space:pre; }
  #tuner .hint { margin:7px 0 0; color:rgba(255,255,255,0.4); font-size:10px; }

  /* Reading overlay — the Interview and the Foreword. Deliberately the same dark
     column the interviews room reads in (#reader in interviews.html): the
     Interview here is a second VIEW of an interviews.js entry, not a different
     object, so it should not change colour depending on which door you came
     through — and a paper overlay flashing up over this dark page would announce
     it as one. Sizes and the yellow standing head are that room's, verbatim. */
  #reader { position:fixed; inset:0; z-index:2000; background:#0a0a0a;
            overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #reader .inner { max-width:38em; margin:0 auto; padding:104px 26px 120px; }
  #reader h1 { margin:0; font-size:54px; line-height:1; font-weight:700;
               letter-spacing:-0.01em; color:#fff; }
  #reader .cap { margin:14px 0 0; font-size:13px; font-weight:300; letter-spacing:0.16em;
                 text-transform:uppercase; color:rgba(255,255,255,0.5); }
  #reader hr { border:0; border-top:1px solid rgba(255,255,255,0.18); margin:26px 0 34px; }
  #reader .portrait { display:block; width:100%; height:auto; margin:0 0 30px;
                      border-radius:2px; }
  #reader h3 { margin:2.2em 0 0.9em; font-size:13px; font-weight:500;
               letter-spacing:0.18em; text-transform:uppercase; color:#F9FF45; }
  #reader .q { margin:0 0 0.7em; font-size:18px; line-height:1.62; font-weight:500; color:#FFFFFF; }
  #reader p { margin:0 0 1.5em; font-size:18px; line-height:1.62; font-weight:300;
              color:rgba(255,255,255,0.86); }
  #reader .pending { font-style:italic; color:rgba(255,255,255,0.4); }
  @media (max-width:640px) {
    #reader .inner { padding:92px 22px 110px; }
    #reader h1 { font-size:38px; }
  }

  /* No wrapped breakpoint: a ring does not reflow. layout() narrows the card
     on small windows instead, and the arc simply gets tighter. */
</style>
</head>
<body>

<button id="backBtn" aria-label="Back">←&nbsp;&nbsp;BACK</button>
<button id="fsBtn" aria-label="Toggle fullscreen">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2">
    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
  </svg>
</button>

<main>
  <!-- The ring's canvas is appended here by the renderer. -->
</main>

<script src="vendor/three.min.js"></script>
<script src="interviews.js"></script>
<script>
// ── Oli Goldsmith — the card behind the homepage card ─────────────────────────
// Typography, margins, gradients and TV static are ported verbatim from the
// ring's card renderer in index.html (titleLayout / drawPortalCard /
// drawVideoTrace / applyTvStatic) so these read as the same object as the card
// you clicked to get here — same 600x800 face, same 54px margin, same Helvetica.

const W = 600, H = 800, LM = 54
// How far the floor reflection carries, as a fraction of the card. index.html's
// REFL_FRAC. Declared up here because the build loop sizes a canvas with it.
const REFL_FRAC = 0.55

const CARDS = [
  {
    // No artwork: a paper ground against the video and the photograph, so the
    // three faces read as three different kinds of thing. Same tone as the ring's
    // OSWIN JOURNAL card, which is the other card on the site that is purely text.
    title: 'FOREWORD',
    sub: '',
    bg: '#D4D2CB',
    titleColor: '#111111',
    bottomCaption: 'by alex taves',
    action: 'read',
    instructions: [],
    // Plain paragraphs rather than Q/A.
    read: { body: [] },
  },
  {
    // The work itself. 800x900 source, so the card is built at 8:9 rather than the
    // ring's 3:4 — the artwork sets the card's shape, not the other way round, and
    // nothing of it is cropped. No title and no static: it is a painting, not a
    // cover. Opens the full set.
    piece: 'images/oli_pieces/boysintown.jpg',
    aspect: 8 / 9,
    title: 'SELECTED PIECES',
    badge: 'Selected Works 1993-2010',
    bg: '#12151b',
    titleColor: '#FFFFFF',
    href: 'pieces.html',
  },
  {
    // A sketchbook page, sat between the finished paintings and the animations —
    // the working-out that sits behind both. 670x900, so its own ratio again
    // rather than the ring's 3:4. Opens the full sketchbook.
    piece: 'images/oli_sketches/sketch-09.jpg',
    aspect: 576 / 740,
    title: 'SKETCHBOOK',
    badge: 'sketchbook, 1993-2026',
    bg: '#15151a',
    titleColor: '#FFFFFF',
    href: 'sketches.html',
  },
  {
    // The sitting boy series, matted: cropped to the drawing and given an even
    // border, which turned them from square scans into landscape sheets. 900x706,
    // so this is the widest card on the ring by some way. Opens all nine.
    piece: 'images/oli_sitting/sitting-09.jpg',
    aspect: 900 / 706,
    title: 'SITTING BOY',
    badge: 'sitting boy, 2025',
    bg: '#15151a',
    titleColor: '#FFFFFF',
    href: 'sitting.html',
  },
  {
    // The moving work, sat directly after the still work: the paintings, then
    // the same hand in motion. 468x622 source, so very near the ring's 3:4 but
    // taken from the file rather than assumed. Opens all nineteen loops.
    pieceVideo: 'videos/oli_loops/loop-13.mp4',
    aspect: 468 / 622,
    title: 'MOVING PIECES',
    badge: 'sketchbook animations, 1993-2026',
    bg: '#15151a',
    titleColor: '#FFFFFF',
    href: 'loops.html',
  },
  {
    title: 'OLI GOLDSMITH',
    sub: '',
    video: 'videos/oli_oswin_opener.mp4',
    badge: 'Ethernity, 2026',
    bg: '#12151b',
    titleColor: '#FFFFFF',
    bottomCaption: 'audio by karla is here',
    action: 'enter',
    // Broken by hand: auto-wrapping at this measure orphans "continue".
    instructions: ['immersive space, move through it,', 'double tap to continue'],
    href: 'https://ethernity.space/',
  },
  {
    title: 'INTERVIEW',
    // Deliberately dressed as the interviews room dresses its own: the portrait
    // full bleed, the name over it, and the faint "Issue N · Name" standing head
    // underneath — no bottom caption and no action verb. It IS one of those
    // cards, shown here as well, so it should not read as a different object.
    //
    // Greyscale as a file rather than desaturated on the canvas: the face is
    // painted once and the TV static goes over the top, so there is nothing to
    // gain from doing the work on every repaint. 3:4, so nothing is cropped.
    image: 'images/interviews/oli.jpg',
    // Tonal rather than a photograph: the portrait reads as an impression you
    // resolve rather than a picture that announces itself, which is how the
    // ring's trace cards carry their content. Entirely in yellow — highlights at
    // BADGE_YELLOW, shadows held at a deep olive of the same hue so no part of
    // the image falls to black.
    // Dialled in on the real card with ?tune. One hue top to bottom: the
    // highlights at the periwinkle, the shadows held at a deep indigo of the
    // same family so nothing in the portrait falls to black.
    tonal: {
      alpha: 0.85,
      grayscale: 1,
      tint: '#9285c7',      // the highlight end
      shadow: '#2c234d',    // the darkest the portrait is allowed to go
    },
    sub: 'Latest \u00b7 Oli Goldsmith',
    // bg is the ground the trace sits on AND the colour of the card's edges, its
    // back plate and the glow it throws on the floor — so the whole object, not
    // just the face, is in the one hue.
    bg: '#9285c7',
    // Ink pitched below the shadow end rather than carried over from the
    // previous colourway: type in a leftover hue reads as a mistake on a card
    // that is otherwise one family.
    // White, not a deep tint of the hue: the standing head renders at 60% of
    // whatever this is, and a dark purple at 60% over a mid purple ground was
    // mud — there was no contrast left for it to be read against.
    titleColor: '#FFFFFF',
    subColor: '#FFFFFF',
    // Backed off from 2. At that strength the grain was heavier than the
    // portrait underneath it; now that the static MOVES it reads as more present
    // at a lower amount than it did frozen at a higher one.
    staticAmt: 1.15,
    // The copy itself lives in interviews.js — one entry, read by the interviews
    // room and by this card, so the duplicate is a second VIEW of Oli's words
    // rather than a second copy of them to keep in step by hand.
    read: { iv: INTERVIEWS.find((x) => x.issue === 4) },
  },
]

// ── Shared TV static (index.html: GRAIN_LIGHTEN / GRAIN_MULTIPLY, 20% down) ────
const _noiseCanvas = document.createElement('canvas')
_noiseCanvas.width = 220; _noiseCanvas.height = 293
const _noiseCtx = _noiseCanvas.getContext('2d')
function regenNoise() {
  const id = _noiseCtx.createImageData(_noiseCanvas.width, _noiseCanvas.height)
  const d = id.data
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255
  }
  _noiseCtx.putImageData(id, 0, 0)
}
const GRAIN_LIGHTEN = 0.088, GRAIN_MULTIPLY = 0.06
// amt scales all three layers together — the lighten grain, the multiply grain
// and the scanlines — so a card can carry more or less of the same look rather
// than a different one. 1 is the ring's own strength, which is what every card
// gets unless it says otherwise.
function applyTvStatic(ctx, amt = 1) {
  if (amt <= 0) return
  ctx.save()
  ctx.imageSmoothingEnabled = false
  ctx.globalCompositeOperation = 'lighten'; ctx.globalAlpha = Math.min(1, GRAIN_LIGHTEN * amt)
  ctx.drawImage(_noiseCanvas, 0, 0, W, H)
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = Math.min(1, GRAIN_MULTIPLY * amt)
  ctx.drawImage(_noiseCanvas, 0, 0, W, H)
  ctx.restore()
  ctx.save()
  ctx.globalAlpha = Math.min(1, 0.16 * amt)
  ctx.drawImage(_scanCanvas, 0, 0)
  ctx.restore()
}

// The scanlines never change, so they are rendered once and blitted rather than
// laid down as ~270 fillRects on every card on every frame. Only the noise moves.
const _scanCanvas = (() => {
  const c = document.createElement('canvas')
  c.width = W; c.height = H
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#000'
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1)
  return c
})()

// ── Type layout (verbatim from index.html titleLayout) ─────────────────────────
function wrapText(ctx, text, maxW) {
  const words = text.split(' ')
  const lines = []
  let line = ''
  for (const w of words) {
    const test = line ? line + ' ' + w : w
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w }
    else line = test
  }
  if (line) lines.push(line)
  return lines
}

function titleLayout(ctx, card, maxW) {
  let size = 74, lines
  for (; size >= 24; size -= 2) {
    ctx.font = `700 ${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
    ctx.letterSpacing = '-0.01em'
    lines = wrapText(ctx, card.title, maxW)
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width))
    if (lines.length <= 3 && widest <= maxW) break
  }
  const lineH = size
  const titleTop = 64
  const titleBottom = titleTop + lines.length * lineH
  const ruleY = titleBottom + 10
  const subTop = ruleY + 12
  return { size, lines, lineH, titleTop, titleBottom, ruleY, subTop }
}

// ── Card face ──────────────────────────────────────────────────────────────────
// ── Duotone trace — index.html's, verbatim ───────────────────────────────────
// A faint single-hue impression of a still, composited behind the title so it
// reads as a subtle imprint of the content rather than a picture in its own
// right. The tint is the card's own bg, so it always reads as that card's
// colour, varied only by the source's luminance.
const duotoneOff = document.createElement('canvas')
const duotoneOffCtx = duotoneOff.getContext('2d')
// One divergence from index.html's version: an optional SHADOW colour. Multiply
// alone sends every dark pixel to black, because black times any tint is black —
// which is fine for the ring's cards, sitting as they do on a near-black ground,
// but it is the one thing a card made entirely of one hue cannot have. Filling
// again with 'lighten' afterwards takes the per-channel max, so nothing in the
// image is allowed below the shadow colour: the darks land on a deep version of
// the hue instead of on nothing, and the image spans shadow -> highlight.
function drawDuotoneTrace(ctx, source, W, H, tintHex, alpha, grayscaleAmt = 1, shadowHex = null) {
  const sw = source.videoWidth || source.naturalWidth
  const sh = source.videoHeight || source.naturalHeight
  if (!sw || !sh) return
  duotoneOff.width = W; duotoneOff.height = H
  duotoneOffCtx.filter = `grayscale(${grayscaleAmt}) contrast(1.1)`
  const scale = Math.max(W / sw, H / sh)
  const dw = sw * scale, dh = sh * scale
  duotoneOffCtx.drawImage(source, (W - dw) / 2, (H - dh) / 2, dw, dh)
  duotoneOffCtx.filter = 'none'
  duotoneOffCtx.globalCompositeOperation = 'multiply'
  duotoneOffCtx.fillStyle = tintHex
  duotoneOffCtx.fillRect(0, 0, W, H)
  if (shadowHex) {
    duotoneOffCtx.globalCompositeOperation = 'lighten'
    duotoneOffCtx.fillStyle = shadowHex
    duotoneOffCtx.fillRect(0, 0, W, H)
  }
  duotoneOffCtx.globalCompositeOperation = 'source-over'
  ctx.save()
  ctx.globalAlpha = alpha
  ctx.drawImage(duotoneOff, 0, 0, W, H)
  ctx.restore()
}

function drawMediaCover(ctx, media, sw, sh) {
  if (!sw || !sh) return
  const s = Math.max(W / sw, H / sh)     // cover: fill the card, crop overflow
  const dw = sw * s, dh = sh * s
  ctx.drawImage(media, (W - dw) / 2, (H - dh) / 2, dw, dh)
}

function drawVideoCover(ctx, video) {
  drawMediaCover(ctx, video, video.videoWidth, video.videoHeight)
}

// Split in two so the static can be re-laid without redrawing the artwork. A
// still card's face was painted exactly once, which is why its grain sat frozen
// while the video card's crawled: the noise is only regenerated when something
// redraws. Now the base is cached and the loop re-lays fresh static over it,
// which is cheap — a blit and three composites — and costs nothing on the cards
// that do not ask for it.
function drawCardBase(ctx, card) {
  ctx.clearRect(0, 0, W, H)
  ctx.fillStyle = card.bg
  ctx.fillRect(0, 0, W, H)

  if (card._video && card._video.readyState >= 2) drawVideoCover(ctx, card._video)
  else if (card._img && card._img.complete && card._img.naturalWidth) {
    if (card.tonal) {
      drawDuotoneTrace(ctx, card._img, W, H, card.tonal.tint || card.bg,
                       card.tonal.alpha, card.tonal.grayscale, card.tonal.shadow)
    } else {
      drawMediaCover(ctx, card._img, card._img.naturalWidth, card._img.naturalHeight)
    }
  }

  // Legibility gradients — top behind the title, bottom behind the instructions
  // and caption. Heavier than the ring's 0.55 top: the ring never puts white
  // type over white footage, and the Monty Python line drawings are on near
  // white, which swallowed the title at the homepage value.
  // Skipped for a tonal card: these are black washes, and the whole point of
  // that treatment is that nothing on the card goes to black. Its type earns its
  // contrast from the ink colour instead.
  if ((card._video || card._img) && !card.tonal) {
    const gTop = ctx.createLinearGradient(0, 0, 0, H * 0.52)
    gTop.addColorStop(0, 'rgba(0,0,0,0.78)'); gTop.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = gTop; ctx.fillRect(0, 0, W, H * 0.52)

    // Reaches higher when the card carries instructions, so the whole block
    // sits on its own ground rather than on the artwork.
    const botTop = card.action ? H * 0.46 : H * 0.62
    const gBot = ctx.createLinearGradient(0, botTop, 0, H)
    gBot.addColorStop(0, 'rgba(0,0,0,0)')
    gBot.addColorStop(1, card.action ? 'rgba(0,0,0,0.82)' : 'rgba(0,0,0,0.62)')
    ctx.fillStyle = gBot; ctx.fillRect(0, botTop, W, H - botTop)
  }

  // The three share one colour unless a card says otherwise. The alpha suffixes
  // are the house look — title solid, standing head quieter, rule quieter still
  // — so an explicit subColor changes the HUE of the second line without
  // promoting it to the weight of the first.
  const ink     = card.titleColor + 'F2'
  const inkSub  = (card.subColor || card.titleColor) + '99'
  const inkRule = (card.subColor || card.titleColor) + '55'

  const t = titleLayout(ctx, card, W - LM * 2)

  ctx.font = `700 ${t.size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`
  ctx.letterSpacing = '-0.01em'
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'
  ctx.fillStyle = ink
  t.lines.forEach((ln, i) => ctx.fillText(ln, LM, t.titleTop + i * t.lineH))

  ctx.strokeStyle = inkRule; ctx.lineWidth = 0.5
  ctx.beginPath(); ctx.moveTo(LM, t.ruleY); ctx.lineTo(W - LM, t.ruleY); ctx.stroke()

  if (card.sub) {
    ctx.font = "300 14px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = inkSub
    ctx.fillText(card.sub, LM, t.subTop)
  }

  // Navigation instructions: "enter" as the action, the how-to underneath.
  // Sits above the bottom caption so the two never collide.
  if (card.action) {
    // "enter" takes the bottom-caption scale (28/300/0.16em) so the two lock-ups
    // on this card share one voice; the how-to sits under it, smaller but at a
    // weight that survives the footage behind it.
    ctx.font = "300 16px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.14em'
    const instr = Array.isArray(card.instructions)
      ? card.instructions
      : wrapText(ctx, card.instructions, W - LM * 2)

    const capReserve = card.bottomCaption ? 92 : 52
    let y = H - capReserve - (instr.length * 26) - 46

    ctx.font = "300 28px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = ink
    ctx.fillText(card.action, LM, y)
    y += 46

    ctx.font = "300 16px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.14em'
    ctx.fillStyle = card.titleColor + 'D9'
    instr.forEach((ln, i) => ctx.fillText(ln, LM, y + i * 26))
  }

  // Bottom caption — same 28px/0.16em as the ring's "visuals by oswin".
  if (card.bottomCaption) {
    ctx.save()
    ctx.textBaseline = 'alphabetic'
    ctx.font = "300 28px 'Helvetica Neue', Helvetica, Arial, sans-serif"
    ctx.letterSpacing = '0.16em'
    ctx.fillStyle = card.titleColor
    ctx.fillText(card.bottomCaption, LM, H - 48)
    ctx.restore()
  }

}

function staticAmtOf(card) { return card.staticAmt === undefined ? 1 : card.staticAmt }

function drawCard(ctx, card) {
  drawCardBase(ctx, card)
  applyTvStatic(ctx, staticAmtOf(card))
}

// Cache the content of a still card so the loop has something to re-lay static
// over without re-running the duotone every frame.
function cacheBase(card) {
  if (!card._base) {
    card._base = document.createElement('canvas')
    card._base.width = W; card._base.height = H
    card._baseCtx = card._base.getContext('2d')
  }
  card._baseCtx.clearRect(0, 0, W, H)
  drawCardBase(card._baseCtx, card)
}

// ── Build ────────────────────────────────────────────────────────────────────
// Each card still paints into its own 600x800 canvas exactly as before; that
// canvas is now a texture on a ring panel rather than a DOM element.
const DPR = Math.min(devicePixelRatio || 1, 2)

CARDS.forEach((card, i) => {
  card._slot = i                       // the placement it occupies on the ring
  if (card.piece || card.pieceVideo) return   // the work is the face; nothing to draw
  const c = document.createElement('canvas')
  c.width = W; c.height = H
  card._ctx = c.getContext('2d')
  card._face = c

  if (card.video) {
    const v = document.createElement('video')
    v.src = card.video
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true
    v.setAttribute('webkit-playsinline', '')
    v.play().catch(() => {})
    card._video = v
  }

  if (card.image) {
    const im = new Image()
    // Repaint and re-upload on arrival: the still cards are painted once, when
    // the fonts resolve, which routinely beats a network image.
    im.onload = () => {
      cacheBase(card)
      drawCard(card._ctx, card)
      if (card._faceTex) card._faceTex.needsUpdate = true
      if (card._backTex) refreshBack(card)
    }
    im.src = card.image
    card._img = im
  }
})

// ── Ring ─────────────────────────────────────────────────────────────────────
// This is index.html's ring, not an approximation of it: the same RADIUS and
// CAM_Z, the same panelH/panelW arithmetic, the same BoxGeometry carrying six
// materials, the same rounded alpha map, and the same glow reflection — which
// is a radial wash of the card's own bg colour cast on the floor, NOT a mirror
// of the artwork. Only the placement count differs: SLOTS positions of which
// the first few carry a card, so a new card drops into the next placement and
// the ones already there do not move.
const SLOTS  = 9
const RADIUS = 6.0
const CAM_Z  = 10.0

const scene = new THREE.Scene()
const bgC = document.createElement('canvas'); bgC.width = 4; bgC.height = 512
const bgCtx = bgC.getContext('2d')
const bgG = bgCtx.createLinearGradient(0, 0, 0, 512)
bgG.addColorStop(0, '#16110d'); bgG.addColorStop(1, '#0a0704')
bgCtx.fillStyle = bgG; bgCtx.fillRect(0, 0, 4, 512)
const bgTex = new THREE.CanvasTexture(bgC); bgTex.encoding = THREE.sRGBEncoding
scene.background = bgTex
scene.fog = new THREE.Fog('#0e0b08', 8, 50)

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200)
camera.position.set(0, 0, CAM_Z)
camera.lookAt(0, 0, 0)

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputEncoding = THREE.sRGBEncoding
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.appendChild(renderer.domElement)

// Environment, lights — index.html's, verbatim.
const envScene = new THREE.Scene()
envScene.background = new THREE.Color('#0e0b08')
;[
  [0, 8, 0, 8, 8, 1.6], [6, 2, 0, 4, 8, 0.02],
  [-6, 2, 0, 4, 8, 0.02], [0, -6, 0, 12, 12, 0.0],
].forEach(([x, y, z, w, h, b]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(b) }))
  m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m)
})
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 200).texture
scene.add(new THREE.HemisphereLight('#2a1a0a', '#0e0806', 0.15))
const keyLight = new THREE.DirectionalLight('#ffffff', 1.1); keyLight.position.set(4, 6, 5)
const rimLight = new THREE.DirectionalLight('#ffcf90', 0.5); rimLight.position.set(-5, 2, -4)
scene.add(keyLight, rimLight)

const nearDist = CAM_Z - RADIUS
const vFOV = (camera.fov * Math.PI) / 180
// How much of the vertical field of view a card fills. Was 0.9; trimmed by 5%
// so the ring sits a touch shorter in the window. Kept as a named constant
// because every other size on the card — its width, its thickness, the glow it
// throws on the floor — is derived from panelH, so this one number moves them
// all together and nothing has to be re-tuned by hand.
const CARD_FOV_FRAC = 0.855

const panelH = CARD_FOV_FRAC * 2 * nearDist * Math.tan(vFOV / 2)
const panelW = panelH * (3 / 4)
// index.html's THICK is 0.16 against a card filling 0.9 of the view, so it is
// carried across as that same proportion rather than as the bare number — a
// shorter card gets a proportionally thinner edge.
const THICK = 0.16 * (CARD_FOV_FRAC / 0.9)
const FRONT_OPACITY = 0.92
const BACK_OPACITY = 0.42
const reflH = panelH * REFL_FRAC
const panelGeo = new THREE.BoxGeometry(panelW, panelH, THICK)
const reflGeo = new THREE.PlaneGeometry(panelW, reflH)

// A card may declare its own aspect (width / height). Everything derived from
// it — the slab, the reflection plane, the rounded corner mask — has to be built
// per aspect rather than shared, or the artwork gets letterboxed into a 3:4 box
// and the corner radius stretches with it. Cached, since cards share ratios.
const CARD_ASPECT = 3 / 4
const _geoCache = new Map()
function geoFor(card) {
  const a = card.aspect || CARD_ASPECT
  let g = _geoCache.get(a)
  if (!g) {
    const w = panelH * a
    g = {
      panel: new THREE.BoxGeometry(w, panelH, THICK),
      refl: new THREE.PlaneGeometry(w, reflH),
      alpha: makeRoundedAlphaMap(a),
      w,
    }
    _geoCache.set(a, g)
  }
  return g
}

function makeRoundedAlphaMap(aspect) {
  const AW = 128, AH = Math.round(AW / aspect)
  const c = document.createElement('canvas'); c.width = AW; c.height = AH
  const ctx = c.getContext('2d')
  const r = 5
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, AW, AH)
  ctx.filter = 'blur(2.5px)'
  ctx.beginPath()
  ctx.moveTo(r, 0); ctx.lineTo(AW - r, 0)
  ctx.arcTo(AW, 0, AW, r, r); ctx.lineTo(AW, AH - r)
  ctx.arcTo(AW, AH, AW - r, AH, r); ctx.lineTo(r, AH)
  ctx.arcTo(0, AH, 0, AH - r, r); ctx.lineTo(0, r)
  ctx.arcTo(0, 0, r, 0, r); ctx.closePath()
  ctx.fillStyle = '#fff'; ctx.fill()
  return new THREE.CanvasTexture(c)
}
const roundedAlphaMap = makeRoundedAlphaMap(CARD_ASPECT)

function makePortalReflTex(bgHex) {
  const r = parseInt(bgHex.slice(1, 3), 16)
  const g = parseInt(bgHex.slice(3, 5), 16)
  const b = parseInt(bgHex.slice(5, 7), 16)
  const RW = 256, RH = 160
  const c = document.createElement('canvas'); c.width = RW; c.height = RH
  const ctx = c.getContext('2d')
  const grd = ctx.createRadialGradient(RW / 2, 0, 0, RW / 2, 0, RW * 0.72)
  grd.addColorStop(0,    'rgba(' + r + ',' + g + ',' + b + ',0.55)')
  grd.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.22)')
  grd.addColorStop(0.7,  'rgba(' + r + ',' + g + ',' + b + ',0.06)')
  grd.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0.0)')
  ctx.fillStyle = grd; ctx.fillRect(0, 0, RW, RH)
  const fade = ctx.createLinearGradient(0, 0, 0, RH)
  fade.addColorStop(0,    'rgba(14,11,8,0.55)')
  fade.addColorStop(0.12, 'rgba(14,11,8,0.0)')
  fade.addColorStop(0.7,  'rgba(14,11,8,0.0)')
  fade.addColorStop(1,    'rgba(14,11,8,0.82)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, RW, RH)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// The back plate is the face seen through the card, so it is mirrored. Redrawn
// from the face whenever the face itself changes.
function refreshBack(card) {
  const img = card._backTex.image
  const ctx = img.getContext('2d')
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.clearRect(0, 0, img.width, img.height)
  ctx.save(); ctx.translate(img.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(card._face, 0, 0); ctx.restore()
  card._backTex.needsUpdate = true
}

function makeFlippedTex(src) {
  const c = document.createElement('canvas')
  c.width = src.width; c.height = src.height
  const ctx = c.getContext('2d')
  ctx.translate(c.width, 0); ctx.scale(-1, 1)
  ctx.drawImage(src, 0, 0)
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t
}

// ── Badge plaque ─────────────────────────────────────────────────────────────
// The ring's issue badge, carried over: a raised tab the card's own thickness,
// stuck on the right edge and flush with the top, parented to the card so it
// orbits and tilts with it. Two things differ. It is WHITE rather than the
// homepage's cycling yellow, and it does not cycle at all — these say one thing.
//
// And it is not square. The homepage badge holds a single numeral, so a tile of
// panelH/8 does; "Selected Works 1993-2010" does not. The plaque therefore
// MEASURES its text and takes its width from that, keeping the height fixed so
// every badge on the ring still reads as the same object. A short label like
// "2026" comes out near enough square, which is the point.
const BADGE_FRAC = 1 / 8     // side length as a fraction of card height
const BADGE_PX = 256         // texture resolution (square)
const BADGE_PAD = 20         // inset from the plaque's edge, in texture px
const BADGE_LEADING = 1.45   // line height as a multiple of the type size
const BADGE_SHRINK = 0.9     // then back off a further 10% off the fitted size
const badgeFont = (px) => '600 ' + px + "px 'Helvetica Neue', Helvetica, Arial, sans-serif"

// Wrap `text` at `size` and report whether it fits the square. Used by the fit
// loop below rather than guessing a size per label.
function badgeLayout(ctx, text, size, inner) {
  ctx.font = badgeFont(size)
  ctx.letterSpacing = '0.04em'
  const lines = []
  let line = ''
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word
    if (line && ctx.measureText(test).width > inner) { lines.push(line); line = word }
    else line = test
  }
  if (line) lines.push(line)
  const lineH = size * BADGE_LEADING
  const widest = Math.max(...lines.map((l) => ctx.measureText(l).width))
  return { lines, lineH, fits: widest <= inner && lines.length * lineH <= inner }
}

function makeBadgeMesh(card, cardW) {
  const c = document.createElement('canvas')
  c.width = BADGE_PX; c.height = BADGE_PX
  const ctx = c.getContext('2d')
  const inner = BADGE_PX - BADGE_PAD * 2

  // The plaque is a CUBE, like the ring's issue badge — its size never changes
  // with what it says. So the type gives way instead: the largest size at which
  // the label wraps inside the square wins. "2026" comes out large, "sketchbook
  // animations, 1993-2026" comes out small, and both sit in the same object.
  let size = 56, layout = badgeLayout(ctx, card.badge, size, inner)
  while (size > 7 && !layout.fits) {
    size -= 1
    layout = badgeLayout(ctx, card.badge, size, inner)
  }
  // Then step back off the size that only just fits, and re-wrap: at the smaller
  // size the lines may break differently, so the layout has to be recomputed
  // rather than just scaled.
  size = Math.max(6, Math.round(size * BADGE_SHRINK))
  layout = badgeLayout(ctx, card.badge, size, inner)

  ctx.fillStyle = '#FFFFFF'
  ctx.fillRect(0, 0, BADGE_PX, BADGE_PX)
  ctx.font = badgeFont(size)
  ctx.letterSpacing = '0.04em'
  ctx.fillStyle = '#111111'
  ctx.textAlign = 'left'
  ctx.textBaseline = 'middle'
  // Ranged left off the padding, but still centred vertically in the square.
  const blockH = layout.lines.length * layout.lineH
  let y = BADGE_PX / 2 - blockH / 2 + layout.lineH / 2
  layout.lines.forEach((ln) => { ctx.fillText(ln, BADGE_PAD, y); y += layout.lineH })

  const tex = new THREE.CanvasTexture(c)
  tex.encoding = THREE.sRGBEncoding

  const bs = panelH * BADGE_FRAC
  const white = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.5, metalness: 0.0, envMapIntensity: 0.15,
  })
  const faceM = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.5, metalness: 0.0, envMapIntensity: 0.15,
  })
  // BoxGeometry material order is [+x, -x, +y, -y, +z front, -z]: label on the front.
  const badge = new THREE.Mesh(new THREE.BoxGeometry(bs, bs, THICK),
    [white, white, white, white, faceM, white])
  // Stuck on the right edge, flush with the top — the ring's own placement.
  badge.position.set(cardW / 2 + bs / 2, panelH / 2 - bs / 2, 0)
  badge.frustumCulled = false
  return badge
}

const ring = new THREE.Group()
scene.add(ring)

CARDS.forEach((card) => {
  const geo = geoFor(card)

  // A piece card carries nothing but the work: the image IS the face, drawn at
  // the card's own ratio so none of it is cropped, with no title, no grain and
  // no scanlines over the top of someone's painting.
  let faceTex, backTex
  if (card.pieceVideo) {
    // Same idea as a still piece — the work IS the face, no title and no static
    // over it — but it moves. Autoplaying muted is allowed without a gesture;
    // there is only one of these on this ring, so unlike loops.html it needs no
    // play-gating.
    const v = document.createElement('video')
    v.src = card.pieceVideo
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true
    v.setAttribute('webkit-playsinline', '')
    v.play().catch(() => {})
    card._loopVideo = v
    faceTex = new THREE.VideoTexture(v)
    faceTex.encoding = THREE.sRGBEncoding
    faceTex.minFilter = THREE.LinearFilter
    faceTex.magFilter = THREE.LinearFilter
    backTex = faceTex
  } else if (card.piece) {
    faceTex = new THREE.TextureLoader().load(card.piece, (t) => {
      t.encoding = THREE.sRGBEncoding
      faceTex.needsUpdate = true
    })
    faceTex.encoding = THREE.sRGBEncoding
    backTex = faceTex
  } else {
    faceTex = new THREE.CanvasTexture(card._face)
    faceTex.encoding = THREE.sRGBEncoding
    backTex = makeFlippedTex(card._face)
  }
  const panelCol = new THREE.Color(card.bg)

  const faceMat = new THREE.MeshPhysicalMaterial({
    map: faceTex, transparent: true, opacity: FRONT_OPACITY, side: THREE.FrontSide,
    roughness: 0.55, metalness: 0.0, envMapIntensity: 0.12,
    color: new THREE.Color(0xffffff), alphaMap: geo.alpha,
  })
  const glassMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: BACK_OPACITY,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const backMat = new THREE.MeshPhysicalMaterial({
    map: backTex, transparent: true, opacity: 0.72,
    roughness: 0.6, metalness: 0.0, color: new THREE.Color(0xffffff), alphaMap: geo.alpha,
  })
  const sideMat = new THREE.MeshStandardMaterial({
    color: panelCol, transparent: true, opacity: 0.65,
    roughness: 0.6, metalness: 0.0, envMapIntensity: 0.1,
  })
  const reflMat = new THREE.MeshBasicMaterial({
    map: makePortalReflTex(card.bg), transparent: true, opacity: 0.38,
  })

  const mesh = new THREE.Mesh(geo.panel, [sideMat, sideMat, glassMat, glassMat, faceMat, backMat])
  mesh.frustumCulled = false
  mesh.userData.card = card
  // Placed and oriented per frame by placePanels(), the way index.html does it.

  const reflMesh = new THREE.Mesh(geo.refl, reflMat)
  reflMesh.position.set(0, -(panelH + reflH) / 2, THICK / 2 + 0.002)
  reflMesh.frustumCulled = false
  mesh.add(reflMesh)
  if (card.badge) mesh.add(makeBadgeMesh(card, geo.w))

  ring.add(mesh)
  card._mesh = mesh
  card._faceTex = faceTex
  card._backTex = backTex
})

// index.html sets each panel from its CURRENT orbit position rather than
// rotating a parent — rotation.y = atan2(x, z) turns the panel to face straight
// out from the ring's centre, which at the front of the ring is straight at the
// camera. Doing it the other way (a rotating group plus a fixed local angle)
// double-counts the turn and the cards end up facing off to one side.
function placePanels() {
  CARDS.forEach((card) => {
    const a = (card._slot / SLOTS) * Math.PI * 2 + spin
    const x = Math.cos(a) * RADIUS, z = Math.sin(a) * RADIUS
    card._mesh.position.set(x, 0, z)
    card._mesh.rotation.set(0, Math.atan2(x, z), 0)
  })
}

// Slot i faces the camera when its orbit angle reaches PI/2.
function slotSpin(card) { return Math.PI / 2 - (card._slot / SLOTS) * Math.PI * 2 }

// Arrive facing the FIRST card. These four are a reading order, not a set to
// browse at random — the foreword sets it up, the paintings are the work itself,
// ETHERNITY is the room you walk into, and the interview is him talking about
// all of it — so the ring opens at the start of that rather than in the middle.
let spin = slotSpin(CARDS[0]), target = spin
let dragging = false, dragFrom = 0, spinFrom = 0, moved = 0, activeId = null
let lastDragEnd = -Infinity, lastDragMoved = 0

function nearestFilled(from) {
  let best = from, bestD = Infinity
  CARDS.forEach((card) => {
    let a = slotSpin(card)
    a += Math.round((from - a) / (Math.PI * 2)) * Math.PI * 2
    const d = Math.abs(from - a)
    if (d < bestD) { bestD = d; best = a }
  })
  return best
}

const cv = renderer.domElement

cv.addEventListener('pointerdown', (e) => {
  // One gesture at a time, primary contact only: a duplicate down would re-read
  // the baseline mid-drag and throw away the travel so far.
  if (dragging || !e.isPrimary) return
  dragging = true; moved = 0; activeId = e.pointerId
  dragFrom = e.clientX; spinFrom = spin
  document.body.classList.add('dragging')
  // Deliberately no setPointerCapture: capturing retargets the click away from
  // the canvas, and the raycast below needs it.
})

addEventListener('pointermove', (e) => {
  if (!dragging || e.pointerId !== activeId) return
  const dx = e.clientX - dragFrom
  moved = Math.max(moved, Math.abs(dx))
  // A third of the window turns the ring by one placement. Negated so the ring
  // travels WITH the hand: drag left and the whole ring slides left, bringing
  // the card that was on the RIGHT to the centre. That is also the way round the
  // arrow keys below already worked, so the two now agree — before the negation
  // a swipe and ArrowLeft moved the ring opposite ways.
  spin = target = spinFrom - (dx / (innerWidth / 3)) * ((Math.PI * 2) / SLOTS)
})

function endDrag(e) {
  if (!dragging || (e && e.pointerId !== activeId)) return
  dragging = false; activeId = null
  document.body.classList.remove('dragging')
  lastDragEnd = performance.now(); lastDragMoved = moved
  target = nearestFilled(spin)
}
addEventListener('pointerup', endDrag)
addEventListener('pointercancel', endDrag)

// Clicking a card opens it — but a drag ends in a click too, so one that
// followed real travel is ignored. By time, not a flag: a flag cleared on the
// next click sticks whenever a drag ends without one.
const raycaster = new THREE.Raycaster()
const ndc = new THREE.Vector2()

cv.addEventListener('click', (e) => {
  if (lastDragMoved > 6 && performance.now() - lastDragEnd < 300) return
  ndc.x = (e.clientX / innerWidth) * 2 - 1
  ndc.y = -(e.clientY / innerHeight) * 2 + 1
  raycaster.setFromCamera(ndc, camera)
  const hit = raycaster.intersectObjects(ring.children, false)[0]
  if (!hit) return
  const card = hit.object.userData.card
  if (!card) return
  // Off-centre cards turn to face you first; only the front one opens.
  if (Math.abs(((spin - slotSpin(card)) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI) > 0.25) {
    target = nearestFilled(slotSpin(card))
    return
  }
  if (card.href) {
    if (/^[a-z]+:/i.test(card.href)) openSite(card.href, card.title)
    else location.replace(card.href)
  } else if (card.read) {
    openReader(card)
  }
})

addEventListener('keydown', (e) => {
  if (document.getElementById('reader') || document.getElementById('siteOverlay')) return
  const step = (Math.PI * 2) / SLOTS
  if (e.key === 'ArrowLeft')  target = nearestFilled(target + step * 0.6)
  if (e.key === 'ArrowRight') target = nearestFilled(target - step * 0.6)
})

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

// Live cards redraw each frame; the static ones are painted once fonts are ready.
function frame() {
  // One fresh noise field per frame, shared by every card — the same field they
  // already shared within a single paint.
  regenNoise()
  CARDS.forEach((card) => {
    if (card._video) {
      // Its content changes every frame anyway, so it redraws whole.
      drawCard(card._ctx, card)
      card._faceTex.needsUpdate = true
      refreshBack(card)
      return
    }
    if (!card._base) return          // not painted yet; fonts still resolving
    // Still card: re-lay static over the cached content rather than rebuilding
    // the duotone, which would mean decoding and recolouring the portrait 60
    // times a second for a layer of noise.
    card._ctx.clearRect(0, 0, W, H)
    card._ctx.drawImage(card._base, 0, 0)
    applyTvStatic(card._ctx, staticAmtOf(card))
    card._faceTex.needsUpdate = true
  })
  spin += (target - spin) * 0.16
  if (Math.abs(target - spin) < 0.0001) spin = target
  placePanels()
  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}

function paintStatics() {
  regenNoise()
  CARDS.forEach((card) => {
    if (card._video || card.piece || card.pieceVideo) return
    cacheBase(card)
    drawCard(card._ctx, card)
    card._faceTex.needsUpdate = true
    refreshBack(card)
  })
}

// Helvetica is a system face here, but wait for the font set anyway so the
// auto-sizing title measures against the real metrics rather than a fallback.
;(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  paintStatics()
  requestAnimationFrame(frame)
})

// ── Tonal tuner (dev only) ───────────────────────────────────────────────────
// Built only for ?tune, so it costs a visitor nothing. Drives the one card that
// carries a `tonal` block, redrawing its face and re-uploading the texture on
// every input so the change is seen on the lit card in the ring rather than on a
// swatch. Hue and saturation are shared by both ends — that is what keeps it a
// duotone of ONE hue rather than two unrelated colours — and the two lightness
// sliders set how far apart the ends sit.
if (new URLSearchParams(location.search).has('tune')) {
  const card = CARDS.find((c) => c.tonal)
  if (card) {
    const hslToHex = (h, sPct, lPct) => {
      const sN = sPct / 100, lN = lPct / 100
      const a = sN * Math.min(lN, 1 - lN)
      const f = (n) => {
        const k = (n + h / 30) % 12
        const v = lN - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))
        return Math.round(255 * v).toString(16).padStart(2, '0')
      }
      return '#' + f(0) + f(8) + f(4)
    }

    const hexToHsl = (hex) => {
      const r = parseInt(hex.slice(1, 3), 16) / 255
      const g = parseInt(hex.slice(3, 5), 16) / 255
      const b = parseInt(hex.slice(5, 7), 16) / 255
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn
      const l = (mx + mn) / 2
      let h = 0, sat = 0
      if (d) {
        sat = d / (1 - Math.abs(2 * l - 1))
        h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4
        h *= 60; if (h < 0) h += 360
      }
      return { h: Math.round(h), s: Math.round(sat * 100), l: Math.round(l * 100) }
    }

    // Seeded from the card itself, so the panel always opens on what is really
    // on it. Hue and saturation come from the highlight; the two ends share them.
    const hi = hexToHsl(card.tonal.tint), lo = hexToHsl(card.tonal.shadow)
    const state = { h: hi.h, s: hi.s, hi: hi.l, lo: lo.l, alpha: Math.round(card.tonal.alpha * 100) }
    const ti = hexToHsl(card.titleColor)
    const su = hexToHsl(card.subColor || card.titleColor)
    state.th = ti.h; state.ts = ti.s; state.tl = ti.l
    state.sh = su.h; state.ss = su.s; state.sl = su.l
    state.st = Math.round((card.staticAmt === undefined ? 1 : card.staticAmt) * 100)

    const FIELDS = [
      ['--', 'Portrait'],
      ['h',     'Hue',        0, 360],
      ['s',     'Saturation', 0, 100],
      ['hi',    'Highlight',  0, 100],
      ['lo',    'Shadow',     0, 100],
      ['alpha', 'Presence',   0, 100],
      ['st',    'Static',     0, 400],
      ['--', 'Title'],
      ['th',    'Hue',        0, 360],
      ['ts',    'Saturation', 0, 100],
      ['tl',    'Lightness',  0, 100],
      ['--', 'Issue line'],
      ['sh',    'Hue',        0, 360],
      ['ss',    'Saturation', 0, 100],
      ['sl',    'Lightness',  0, 100],
    ]
    const SLIDERS = FIELDS.filter((f) => f[0] !== '--')

    const el = document.createElement('div')
    el.id = 'tuner'
    el.innerHTML = FIELDS.map(([k, label, min, max]) =>
      k === '--'
        ? '<h4>' + label + '</h4>'
        : '<label><span class="row">' + label + ' <b id="v_' + k + '"></b></span>' +
          '<input type="range" autocomplete="off" id="r_' + k + '" min="' + min + '" max="' + max + '" value="' + state[k] + '"></label>'
    ).join('') +
      '<div class="swatches"><div class="sw" id="sw_lo"></div><div class="sw" id="sw_hi"></div>' +
      '<div class="sw" id="sw_ti"></div><div class="sw" id="sw_su"></div></div>' +
      '<code id="tuneOut"></code>' +
      '<p class="hint">?tune only — paste the block back into CARDS.</p>'
    document.body.appendChild(el)

    const out = el.querySelector('#tuneOut')
    const swHi = el.querySelector('#sw_hi'), swLo = el.querySelector('#sw_lo')
    const swTi = el.querySelector('#sw_ti'), swSu = el.querySelector('#sw_su')

    function apply() {
      const tint = hslToHex(state.h, state.s, state.hi)
      const shadow = hslToHex(state.h, state.s, state.lo)
      const titleCol = hslToHex(state.th, state.ts, state.tl)
      const subCol = hslToHex(state.sh, state.ss, state.sl)
      card.tonal.tint = tint
      card.tonal.shadow = shadow
      card.tonal.alpha = state.alpha / 100
      card.titleColor = titleCol
      card.subColor = subCol
      card.staticAmt = state.st / 100
      // bg is the ground, the edges, the back plate and the floor glow, so it
      // tracks the highlight — otherwise only the face would change hue and the
      // object around it would stay the old colour.
      card.bg = tint
      if (card._mesh) {
        const col = new THREE.Color(tint)
        const mats = card._mesh.material
        mats[0].color.copy(col); mats[1].color.copy(col)   // sides
        mats[2].color.copy(col); mats[3].color.copy(col)   // glass
        const refl = card._mesh.children[0]
        if (refl) { refl.material.map = makePortalReflTex(tint); refl.material.needsUpdate = true }
      }
      // Slider positions are written FROM state, never just read into it.
      // Chrome restores form values across a reload of the same URL, so the
      // value attribute is only a hint — without this the tuner comes back on
      // whatever hue it was left on rather than on the card's real colours.
      SLIDERS.forEach(([k]) => {
        el.querySelector('#v_' + k).textContent = state[k]
        const r = el.querySelector('#r_' + k)
        if (+r.value !== state[k]) r.value = state[k]
      })
      swHi.style.background = tint
      swLo.style.background = shadow
      swTi.style.background = titleCol
      swSu.style.background = subCol
      out.textContent =
        'tonal: {\n' +
        '  alpha: ' + (state.alpha / 100).toFixed(2) + ',\n' +
        '  grayscale: 1,\n' +
        "  tint: '" + tint + "',\n" +
        "  shadow: '" + shadow + "',\n" +
        '},\n' +
        "bg: '" + tint + "',\n" +
        "titleColor: '" + titleCol + "',\n" +
        "subColor: '" + subCol + "',\n" +
        'staticAmt: ' + (state.st / 100).toFixed(2) + ','
      regenNoise()
      cacheBase(card)
      drawCard(card._ctx, card)
      card._faceTex.needsUpdate = true
      refreshBack(card)
    }

    SLIDERS.forEach(([k]) => {
      el.querySelector('#r_' + k).addEventListener('input', (e) => {
        state[k] = +e.target.value
        apply()
      })
    })
    // The face is painted on document.fonts.ready, which may not have resolved
    // yet; applying after it keeps the tuner from being overwritten.
    ;(document.fonts ? document.fonts.ready : Promise.resolve()).then(apply)
  }
}

// ── Oli's sound ────────────────────────────────────────────────────────────────
// There is no longer a handover here, and that is the point. The ring's lobby
// bed is now this same ETHERNITY recording (carousel/audio/ethernity_lobby.mp3),
// playing unbroken from the moment the visitor pushes PLAY, so walking into
// Oli's space should change nothing about the sound — it is already his track
// they are listening to. The ring accordingly does not duck on oswinRoomAudio.
//
// So this player stays off: starting it would put a SECOND copy of the same
// recording against the lobby's, at a different playhead, phasing. The machinery
// below is left intact and one flag away from working, for a future room that
// wants a bed of its own.
//
// Caveat that cannot be closed from here: ETHERNITY is a 3DVista tour carrying
// its own background player, configured asBackground/allowResume against this
// same file. Whether that internal player starts inside our frame is neither
// inspectable nor mutable across a cross-origin boundary. If you hear the bed
// doubled and drifting inside the space, that copy is the tour's own, and the
// fix is on Oli's side of the frame rather than here.
const PLAY_ROOM_TRACK = false
const ROOM_AUDIO = 'https://ethernity.space/media/audio_C90D44A6_D02B_52DD_41B2_62B8BCDBD958_en.mp3'
const ROOM_FADE_MS = 1600
const ROOM_VOL = 0.85

let roomAudio = null, roomCtx = null, roomGain = null, roomStopTimer = null

// Gain ramps are scheduled on the AudioContext's own clock, which keeps running
// when the tab is backgrounded. An earlier requestAnimationFrame fade stalled
// the moment the tab lost focus — and since the pause lived in the fade's
// completion callback, leaving the space in a background tab left Oli's bed
// playing silently under the lobby forever.
function roomFade(to, ms) {
  if (!roomGain) return
  const t = roomCtx.currentTime
  roomGain.gain.cancelScheduledValues(t)
  roomGain.gain.setValueAtTime(roomGain.gain.value, t)
  roomGain.gain.linearRampToValueAtTime(Math.max(0.0001, to), t + ms / 1000)
}

function roomSoundOn() {
  // Still announced, though the ring deliberately does not duck on it: it is
  // the only signal that a room has taken the sound, and the ring's handler
  // documents why it chooses to play through.
  try { window.top.postMessage({ type: 'oswinRoomAudio', on: true }, location.origin) } catch (e) {}
  if (!PLAY_ROOM_TRACK) return

  clearTimeout(roomStopTimer)

  // Built once and kept between visits, so stepping back into the space picks
  // the bed up where it was instead of restarting the piece.
  if (!roomAudio) {
    roomAudio = new Audio()
    roomAudio.loop = true
    roomAudio.preload = 'auto'
    // Required before the element can be routed through Web Audio without
    // tainting the graph; the host sends access-control-allow-origin:*.
    roomAudio.crossOrigin = 'anonymous'
    roomAudio.src = ROOM_AUDIO

    roomCtx = new (window.AudioContext || window.webkitAudioContext)()
    roomGain = roomCtx.createGain()
    roomGain.gain.value = 0.0001
    roomCtx.createMediaElementSource(roomAudio).connect(roomGain)
    roomGain.connect(roomCtx.destination)
  }

  // Called from the card's click handler, so this is a user gesture and both
  // the context resume and playback are allowed.
  roomCtx.resume().catch(() => {})
  roomAudio.play().catch(() => {})
  roomFade(ROOM_VOL, ROOM_FADE_MS)
}

function roomSoundOff() {
  try { window.top.postMessage({ type: 'oswinRoomAudio', on: false }, location.origin) } catch (e) {}
  if (!roomAudio) return
  roomFade(0, ROOM_FADE_MS)
  // Timers still fire in a backgrounded tab (throttled), so the element is
  // parked even if the visitor tabs away mid-fade.
  clearTimeout(roomStopTimer)
  roomStopTimer = setTimeout(() => { if (roomAudio) roomAudio.pause() }, ROOM_FADE_MS + 120)
}

// ── Reading overlay ───────────────────────────────────────────────────────────
// The Interview and the Foreword open here rather than on pages of their own, so
// the visitor never leaves Oli's cards — and since the ring no longer ducks for
// this page, the lobby bed plays straight through the read.
function openReader(card) {
  if (document.getElementById('reader')) return

  const o = document.createElement('div')
  o.id = 'reader'
  const inner = document.createElement('div')
  inner.className = 'inner'

  // Two kinds of read on this page. The Interview is an interviews.js entry —
  // the very one the interviews room builds its card from — so it renders in
  // that room's order and Oli's words stay in one place. The Foreword is local
  // prose with no home but here.
  const iv = card.read && card.read.iv

  if (iv && iv.portrait) {
    const im = document.createElement('img')
    im.className = 'portrait'
    im.src = iv.portrait
    im.alt = ''
    inner.appendChild(im)
  }

  const h = document.createElement('h1')
  h.textContent = iv ? iv.title : card.title
  inner.appendChild(h)

  const cap = iv ? iv.sub : card.bottomCaption
  if (cap) {
    const c = document.createElement('p')
    c.className = 'cap'
    c.textContent = cap
    inner.appendChild(c)
  }
  inner.appendChild(document.createElement('hr'))

  const para = (text, cls) => {
    const p = document.createElement('p')
    if (cls) p.className = cls
    p.textContent = text
    inner.appendChild(p)
  }
  const head = (text) => {
    const h3 = document.createElement('h3')
    h3.textContent = text
    inner.appendChild(h3)
  }

  let wrote = false
  if (iv) {
    ;(iv.intro || []).forEach((t) => { para(t); wrote = true })
    ;(iv.sections || []).forEach((sec) => {
      head(sec.heading)
      ;(sec.paras || []).forEach((t) => para(t))
      wrote = true
    })
    if (iv.qaLead) head(iv.qaLead)
    // An unanswered question is a question still out; it is not shown as a gap.
    ;(iv.qa || []).forEach((x) => {
      if (x.q) { para(x.q, 'q'); wrote = true }
      if (x.a) { para(x.a); wrote = true }
    })
  } else {
    ;((card.read && card.read.body) || []).forEach((t) => { para(t); wrote = true })
  }
  if (!wrote) para('[ copy to come ]', 'pending')

  o.appendChild(inner)

  const back = document.createElement('button')
  back.textContent = '\u2190 BACK'
  back.setAttribute('aria-label', 'Back to the Oli Goldsmith cards')
  back.style.cssText = "position:fixed; top:20px; left:22px; z-index:2001; padding:6px 4px; border:none; background:none; color:rgba(255,255,255,0.55); font:500 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing:0.22em; cursor:pointer;"
  back.onclick = closeReader
  o.appendChild(back)

  document.body.appendChild(o)

  // Same history contract as openSite, so the browser BACK and the on-screen one
  // do the same thing and neither strands the overlay open.
  history.pushState({ reader: true }, '')
  readerPushed = true
}
let readerPushed = false

function closeReader() {
  const o = document.getElementById('reader')
  if (!o) return
  o.remove()
  if (readerPushed) { readerPushed = false; history.back() }
}

// ── Embedded site overlay ──────────────────────────────────────────────────────
// Keeps an external destination inside oswinjournal.com. Same shape as the ring's
// own openCardIframe: a full-bleed frame, and a BACK that fades in on movement
// and settles away. The BACK never auto-hides here — we cannot see pointer events
// over a cross-origin frame, so hiding it would remove the only way out.
function openSite(url, label) {
  if (document.getElementById('siteOverlay')) return

  const overlay = document.createElement('div')
  overlay.id = 'siteOverlay'
  overlay.style.cssText = 'position:fixed; inset:0; z-index:2000; background:#000;'

  const frame = document.createElement('iframe')
  frame.src = url
  frame.title = label || ''
  frame.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; border:0;'
  // Note what is NOT granted: fullscreen. The tour requests fullscreen for
  // ITSELF, and a fullscreen cross-origin frame paints above everything —
  // measured, it took BACK and the fullscreen control offscreen and left Escape
  // as the only way out of Oli's space. Withholding the permission keeps the
  // frame in its box; fullscreen is then ours to give, applied to this document
  // so our chrome rides on top of it. autoplay stays — the bed needs it.
  frame.setAttribute('allow', 'autoplay; microphone; camera; gyroscope; accelerometer; xr-spatial-tracking')
  overlay.appendChild(frame)

  // mix-blend-mode:difference rather than a fixed colour: what sits behind this
  // is someone else's page and can be any brightness, and plain white would
  // vanish into a light one.
  const back = document.createElement('button')
  back.textContent = '← BACK'
  back.setAttribute('aria-label', 'Back to the Oli Goldsmith cards')
  back.style.cssText = "position:fixed; top:22px; left:26px; z-index:2001; padding:6px 4px; border:none; background:none; color:#fff; mix-blend-mode:difference; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13px; font-weight:400; letter-spacing:0.05em; line-height:1; cursor:pointer;"
  back.onclick = closeSite
  overlay.appendChild(back)
  overlay.appendChild(makeOverlayFsButton())

  document.body.appendChild(overlay)
  roomSoundOn()
  // Fullscreen on the way in. Applied to OUR document, not granted to the frame
  // (see the allow list above), so BACK and the fullscreen control still ride on
  // top of Oli's space. iOS Safari has no Fullscreen API for non-video elements
  // and simply rejects; the catch lets it fall back to the edge-to-edge layout.
  enteredFsForSite = false
  const fsEl = document.documentElement
  const req = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen
  if (req && !(document.fullscreenElement || document.webkitFullscreenElement)) {
    try { Promise.resolve(req.call(fsEl)).then(() => { enteredFsForSite = true }).catch(() => {}) } catch {}
  }

  history.pushState({ siteOverlay: true }, '')
  sitePushed = true
}
let sitePushed = false

// Only leave fullscreen if entering the space is what put us there — someone who
// was already fullscreen should stay that way.
let enteredFsForSite = false
function leaveSiteFullscreen() {
  if (!enteredFsForSite) return
  enteredFsForSite = false
  const exit = document.exitFullscreen || document.webkitExitFullscreen
  if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
    try { Promise.resolve(exit.call(document)).catch(() => {}) } catch {}
  }
}

function closeSite() {
  const o = document.getElementById('siteOverlay')
  if (!o) return
  o.remove()
  leaveSiteFullscreen()
  roomSoundOff()
  if (sitePushed) { sitePushed = false; history.back() }
}

addEventListener('popstate', () => {
  const o = document.getElementById('siteOverlay')
  if (o) { sitePushed = false; o.remove(); leaveSiteFullscreen(); roomSoundOff() }
  // Cleared without calling history.back(): the pop that got us here already
  // unwound the entry, and closeReader's own back() would eat the ring's.
  const r = document.getElementById('reader')
  if (r) { readerPushed = false; r.remove() }
})

// Leaving these cards entirely (BACK to the ring, or on to a reel) must not
// strand the room's bed playing under the lobby.
addEventListener('pagehide', () => { clearTimeout(roomStopTimer); if (roomAudio) roomAudio.pause() })
addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSite(); closeReader() } })

// ── Fullscreen — the ring's control, ported whole ─────────────────────────────
const fsBtn = document.getElementById('fsBtn')
const FS_ENTER = 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3'
const FS_EXIT = 'M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3'
const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement)

function toggleFs(e) {
  if (e) e.stopPropagation()
  if (inFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document)
  } else {
    // documentElement, not the embedded frame: fullscreening the frame itself
    // would take BACK and this control offscreen with it, and the frame is
    // cross-origin so nothing inside it could bring them back.
    const el = document.documentElement
    ;(el.requestFullscreen || el.webkitRequestFullscreen).call(el)
  }
}
fsBtn.addEventListener('click', toggleFs)

// Every fullscreen control on the page shares one icon state — the cards' and
// the one over the embedded site — so entering fullscreen from either leaves
// both telling the truth.
const fsPaths = [fsBtn.querySelector('path')]
const syncFsIcon = () => fsPaths.forEach((pth) => {
  if (pth.isConnected) pth.setAttribute('d', inFullscreen() ? FS_EXIT : FS_ENTER)
})
document.addEventListener('fullscreenchange', syncFsIcon)
document.addEventListener('webkitfullscreenchange', syncFsIcon)

// The control as it appears OVER the embedded site: no chip, difference blend,
// matching the BACK label beside it. Someone else's page can be any brightness
// and a fixed white icon would vanish into a light one. Like that BACK, it does
// not idle away — we cannot see pointer movement over a cross-origin frame, so
// a faded control could never be summoned back.
function makeOverlayFsButton() {
  const b = document.createElement('button')
  b.setAttribute('aria-label', 'Toggle fullscreen')
  b.style.cssText = 'position:fixed; top:20px; right:24px; z-index:2001; padding:6px 4px; border:none; background:none; line-height:0; cursor:pointer; mix-blend-mode:difference;'
  b.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">'
    + '<path d="' + (inFullscreen() ? FS_EXIT : FS_ENTER) + '" /></svg>'
  b.addEventListener('click', toggleFs)
  fsPaths.push(b.querySelector('path'))
  return b
}

let fsHideTimer = null
function revealFsBtn() {
  fsBtn.style.opacity = '0.7'
  fsBtn.style.pointerEvents = 'auto'
  clearTimeout(fsHideTimer)
  fsHideTimer = setTimeout(() => {
    fsBtn.style.opacity = '0'
    fsBtn.style.pointerEvents = 'none'
  }, 2600)
}
addEventListener('pointermove', revealFsBtn)
addEventListener('pointerdown', revealFsBtn)
addEventListener('touchstart', revealFsBtn, { passive: true })
revealFsBtn()

document.getElementById('backBtn').onclick = () => {
  // Embedded in the ring's card overlay this drives the PARENT's history, which
  // trips its popstate handler and closes the overlay. Standalone it just goes back.
  if (window !== window.top) { try { window.parent.history.back(); return } catch (e) {} }
  if (history.length > 1) history.back(); else location.href = 'index.html'
}
</script>
</body>
</html>
